
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: herramientas de fontanería - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="task">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main"><div class="options" id="options"></div></div>
<div class="footer">
<div class="helper">Selecciona la herramienta correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">🔧 Tu primer día</div>
<div class="modal-body">Eres ayudante en una empresa de fontanería. El oficial te pide herramientas para cada tarea. ¡Elige la correcta!</div>
<div class="modal-actions"><button class="cta" onclick="startGame()">¡Empezar!</button></div>
</div>
</div>

<script>
const tasks=[
{task:"Cortar un tubo de cobre de 15mm",opts:["Cortatubos","Sierra de arco","Tijera PVC"],icons:["","🪚","✂️"],ans:0,correct:"Cortatubos",why:"El cortatubos hace cortes limpios sin virutas. La sierra deja rebabas que dañan juntas. La tijera PVC es solo para plástico."},
{task:"Apretar un racor de latón en la toma",opts:["Llave grifa","Llave inglesa","Alicates"],icons:["🔧","🔧",""],ans:0,correct:"Llave grifa",why:"La llave grifa tiene mordazas dentadas para racores. La inglesa resbala en superficies redondas. Los alicates marcan y dañan el latón."},
{task:"Desatascar el sifón del lavabo",opts:["Desatascador ventosa","Guía pasacables","Sonda flexible"],icons:["🪠","",""],ans:0,correct:"Desatascador ventosa",why:"La ventosa genera presión para empujar el atasco. La guía es para cables eléctricos. La sonda es para tuberías largas, no sifones."},
{task:"Sellar la rosca de un grifo",opts:["Cinta de teflón","Silicona","Masilla"],icons:["","",""],ans:0,correct:"Cinta de teflón",why:"El teflón sella roscas metálicas sin pegar. La silicona es para juntas fijas. La masilla no resiste presión de agua."},
{task:"Curvar un tubo de cobre sin aplastarlo",opts:["Curvadora manual","Soplete","Muelle curvador"],icons:["","🔥",""],ans:0,correct:"Curvadora manual",why:"La curvadora mantiene la sección circular. El soplete es para soldar, no curvar. El muelle sirve pero requiere más técnica y puede aplastar."},
{task:"Medir el diámetro interior de un tubo",opts:["Calibre","Flexómetro","Nivel"],icons:["📏","📐",""],ans:0,correct:"Calibre",why:"El calibre mide diámetros con precisión. El flexómetro mide longitudes, no diámetros internos. El nivel comprueba horizontalidad."}
];

let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),taskEl=document.getElementById('task'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=tasks.length){showResults();return}
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=((idx)/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
opts.innerHTML=t.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${t.icons[i]?t.icons[i]+' ':''}${o}</button>`).join('');
ensureFits();
}

function select(i){
const t=tasks[idx];
const correct=i===t.ans;
if(correct)score++;
answers.push({task:t.task,user:t.opts[i],correct:t.correct,isCorrect:correct,why:t.why});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===i)b.classList.add(correct?'correct':'incorrect');
if(j===t.ans&&!correct)b.classList.add('correct');
});
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔧 ¡Jornada completada!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Herramientas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.isCorrect?'✓ '+a.user:'✗ Elegiste: '+a.user+' → Correcta: '+a.correct}</div>
<div class="result-explanation">${a.why}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Kit básico del fontanero aprendiz</div>
<div class="result-explanation">Lleva siempre: cortatubos, llave grifa, llave inglesa, teflón, desatascador y flexómetro. Con esto resolverás el 80% de tareas domésticas.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

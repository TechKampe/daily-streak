
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o realidad? ⚡ Seguridad eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o realidad? ⚡</div>
<div class="subtitle">Seguridad eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="statement"></p>
</div>
</div>
<div class="footer">
<div class="helper">¿Verdadero o Falso?</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">Falso</button>
</div>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">⚡ Tu primer día</div>
<div class="modal-body">El encargado te lanza afirmaciones sobre seguridad eléctrica. Decide si cada una es verdadera o falsa.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const data=[
{statement:"La madera siempre aísla la corriente eléctrica.",correct:false,exp:"La madera húmeda conduce electricidad. Solo la madera seca y tratada ofrece cierto aislamiento, pero nunca es fiable como protección."},
{statement:"Antes de intervenir en una instalación hay que cortar y verificar ausencia de tensión.",correct:true,exp:"Regla de oro: cortar alimentación, bloquear, verificar ausencia de tensión, señalizar y poner a tierra si procede."},
{statement:"Los guantes de trabajo normales protegen de descargas eléctricas.",correct:false,exp:"Solo los guantes dieléctricos homologados (clase 00 a 4) protegen. Los de cuero o tela no aíslan."},
{statement:"Un diferencial elimina todo riesgo de electrocución.",correct:false,exp:"El diferencial reduce el riesgo, pero no lo elimina. Puede fallar o no actuar a tiempo en contactos directos."},
{statement:"12 V en corriente continua no puede producir daños en condiciones húmedas.",correct:false,exp:"En ambientes húmedos la resistencia del cuerpo baja drásticamente. Tensiones bajas pueden provocar fibrilación."},
{statement:"Trabajar en tensión está prohibido salvo casos excepcionales y con formación específica.",correct:true,exp:"El RD 614/2001 prohíbe trabajos en tensión salvo que sea imprescindible y con personal cualificado y equipado."},
{statement:"El color verde-amarillo identifica siempre al conductor de protección (tierra).",correct:true,exp:"Por normativa IEC 60446, el bicolor verde-amarillo está reservado exclusivamente para el conductor de tierra."}
];
let idx=0,answers=[],blocked=false;
const scene=document.getElementById('scene'),stEl=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnT=document.getElementById('btnTrue'),btnF=document.getElementById('btnFalse'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}
function render(){
if(idx>=data.length){showResults();return}
blocked=false;
btnT.className='btn-option';btnF.className='btn-option';
btnT.disabled=false;btnF.disabled=false;
stEl.textContent=data[idx].statement;
prog.style.width=(idx/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
ensureFits();
}
function answer(val){
if(blocked)return;
blocked=true;
const correct=val===data[idx].correct;
const btn=val?btnT:btnF;
btn.classList.add(correct?'correct':'incorrect');
btnT.disabled=true;btnF.disabled=true;
answers.push({statement:data[idx].statement,userAnswer:val,correct:data[idx].correct,isCorrect:correct,exp:data[idx].exp});
setTimeout(()=>{idx++;render();},1000);
}
function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.statement}</div>
<div class="result-answer">Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} ${a.isCorrect?'✓':'✗'} · Correcta: ${a.correct?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item" style="background:var(--surface-alt);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Siempre verifica ausencia de tensión con un detector homologado antes de tocar cualquier conductor o equipo eléctrico, aunque creas que está desconectado.</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}
function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}
function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}
function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}
window.addEventListener('load',()=>{modal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

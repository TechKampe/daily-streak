
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔌 Conecta los Conceptos Eléctricos - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
.memory-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%;max-width:400px;margin:0 auto}
.mem-card{height:70px;width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform 0.2s ease;font-family:'Baloo 2',sans-serif;box-sizing:border-box;padding:4px}
.mem-card.covered{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700}
.mem-card.revealed{background:#fff;border:2px solid #0B214A;color:#0B214A;font-size:12px;line-height:1.2}
.mem-card.matched{background:#d4edda;border:2px solid #28a745;color:#28a745}
.mem-card.shake{animation:shake 0.5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.mem-card.pop{animation:pop 0.2s ease}
@keyframes pop{0%{transform:scale(0.95)}100%{transform:scale(1)}}
.stats-row{display:flex;justify-content:space-between;padding:0 16px;font-size:14px;color:#0B214A;font-family:'Baloo 2',sans-serif}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔌 Conecta los Conceptos</div>
<div class="subtitle">Encuentra las 4 parejas técnicas</div>
</div>
</div>
<div class="stats-row">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="main">
<div class="memory-board" id="board"></div>
</div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejar conceptos</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const pairs=[
{id:1,a:"Polímetro",b:"Medir voltaje",exp:"El polímetro mide tensión, corriente y resistencia eléctrica."},
{id:2,a:"Regleta",b:"Conectar cables",exp:"La regleta permite unir varios cables de forma segura."},
{id:3,a:"Diferencial",b:"Protección personas",exp:"El diferencial protege contra contactos eléctricos."},
{id:4,a:"Pelacables",b:"Retirar aislante",exp:"El pelacables quita el aislamiento sin dañar el conductor."}
];
let cards=[],first=null,second=null,locked=false,attempts=0,matched=0,history=[];
const maxAttempts=10,board=document.getElementById('board'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs'),scene=document.getElementById('scene');

function init(){
cards=[];
pairs.forEach(p=>{cards.push({pairId:p.id,text:p.a,type:'a'});cards.push({pairId:p.id,text:p.b,type:'b'})});
shuffle(cards);
renderBoard();
ensureFits();
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}

function renderBoard(){
board.innerHTML='';
cards.forEach((c,i)=>{
const el=document.createElement('div');
el.className='mem-card covered';
el.textContent='?';
el.dataset.index=i;
el.onclick=()=>flipCard(i,el);
board.appendChild(el);
});
}

function flipCard(idx,el){
if(locked||el.classList.contains('revealed')||el.classList.contains('matched'))return;
el.classList.remove('covered');
el.classList.add('revealed','pop');
el.textContent=cards[idx].text;
if(!first){first={idx,el};return}
second={idx,el};
locked=true;
attempts++;
attemptsEl.textContent=`Intento ${attempts}/10`;
checkMatch();
}

function checkMatch(){
const isMatch=cards[first.idx].pairId===cards[second.idx].pairId&&cards[first.idx].type!==cards[second.idx].type;
if(isMatch){
first.el.classList.add('matched');
second.el.classList.add('matched');
matched++;
pairsEl.textContent=`${matched}/4 parejas`;
const p=pairs.find(x=>x.pairId===cards[first.idx].pairId);
history.push({a:p.a,b:p.b,exp:p.exp,found:true});
resetSelection();
if(matched===4)endGame(true);
}else{
first.el.classList.add('shake');
second.el.classList.add('shake');
setTimeout(()=>{
first.el.classList.remove('revealed','shake');
first.el.classList.add('covered');
first.el.textContent='?';
second.el.classList.remove('revealed','shake');
second.el.classList.add('covered');
second.el.textContent='?';
resetSelection();
if(attempts>=maxAttempts)endGame(false);
},2000);
}
}

function resetSelection(){first=null;second=null;locked=false}

function endGame(win){
pairs.forEach(p=>{if(!history.find(h=>h.a===p.a))history.push({a:p.a,b:p.b,exp:p.exp,found:false})});
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${win?'¡Felicidades!':'¡Sigue practicando!'}</div>
<div class="results-score">${matched}/4</div>
<div class="results-subtitle">parejas encontradas en ${attempts} intentos</div>
</div>
<div class="results-list">
${history.map(h=>`<div class="result-item ${h.found?'correct':'incorrect'}">
<div class="result-question">${h.a} ↔ ${h.b}</div>
<div class="result-answer">${h.found?'✓ Emparejado':'✗ No encontrado'}</div>
<div class="result-explanation">${h.exp}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{init();ensureFits()});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

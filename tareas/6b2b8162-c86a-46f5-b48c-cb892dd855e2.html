
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ Voltaje Seguro: ¿Dominas lo básico? - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">⚡ Voltaje Seguro</div>
<div class="subtitle" id="question">Cargando...</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Tu jefe evalúa tus conocimientos básicos</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">⚡ Primera semana de ayudante</div>
<div class="modal-body">Tu jefe quiere comprobar que conoces las bases antes de tocar el cuadro eléctrico. ¡Demuestra lo que sabes!</div>
<div class="modal-actions">
<button class="cta" onclick="startQuiz()">Comenzar</button>
</div>
</div>
</div>

<script>
const data=[
{q:"¿Qué EPI es imprescindible para trabajos eléctricos?",opts:["Guantes aislantes","Gafas de sol","Rodilleras"],ans:0,exp:"Los guantes aislantes protegen contra descargas eléctricas y son obligatorios."},
{q:"¿De qué color es el cable de tierra según normativa?",opts:["Azul","Verde/Amarillo","Marrón"],ans:1,exp:"El cable de tierra siempre es verde/amarillo para identificarlo fácilmente."},
{q:"¿Cuál es el voltaje doméstico estándar en España?",opts:["120V","230V","380V"],ans:1,exp:"En España el voltaje doméstico es 230V, diferente a otros países como EEUU."},
{q:"¿Qué característica deben tener las herramientas eléctricas?",opts:["Mango metálico","Mango aislado","Cualquier mango"],ans:1,exp:"Las herramientas deben tener mangos aislados para evitar conducción eléctrica."},
{q:"¿Qué hacer primero si un compañero sufre electrocución?",opts:["Tocarlo para apartarlo","Cortar la corriente","Echarle agua"],ans:1,exp:"Primero corta la corriente. Tocar a la víctima te electrocutaría también."}
];

let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),qEl=document.getElementById('question'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function startQuiz(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
qEl.textContent=d.q;
prog.style.width=((idx)/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
helper.textContent='Toca la respuesta correcta';
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" aria-label="Opción: ${o}" onclick="select(${i})">${o}</button>`).join('');
ensureFits();
}

function select(i){
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>b.disabled=true);
const correct=i===data[idx].ans;
btns[i].classList.add(correct?'correct':'incorrect');
if(!correct)btns[data[idx].ans].classList.add('correct');
if(correct)score++;
answers.push({q:data[idx].q,correct,exp:data[idx].exp,user:data[idx].opts[i],correctAns:data[idx].opts[data[idx].ans]});
helper.textContent=correct?'¡Correcto! ✓':'Incorrecto ✗';
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">⚡ ¡Evaluación completada!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">${score>=4?'¡Excelente base!':score>=3?'Buen nivel, repasa algunos puntos':'Necesitas repasar conceptos básicos'}</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${i+1}. ${a.q}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Tu respuesta: '+a.user}</div>
${!a.correct?`<div class="result-answer" style="opacity:0.8">Correcta: ${a.correctAns}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt);border-left:3px solid var(--accent)">
<div class="result-question">💡 Consejo del día</div>
<div class="result-explanation">Siempre verifica ausencia de tensión con un comprobador antes de manipular cualquier instalación eléctrica.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

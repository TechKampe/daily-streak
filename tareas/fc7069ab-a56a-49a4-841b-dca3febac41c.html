
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔌 Conecta los Conceptos Eléctricos - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%;max-width:400px;margin:0 auto}
.memory-card{height:70px;width:100%;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box;transition:transform 0.2s ease,background 0.2s ease}
.memory-card.covered{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700}
.memory-card.revealed{background:#fff;border:2px solid #0B214A;color:#0B214A;font-size:12px;line-height:1.2}
.memory-card.matched{background:#d4edda;border:2px solid #28a745;color:#0B214A;font-size:12px;line-height:1.2}
.memory-card.shake{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.memory-card:active:not(.matched):not(.revealed){transform:scale(0.95)}
.stats-row{display:flex;justify-content:center;gap:16px;font-size:14px;color:#0B214A;margin-bottom:8px}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔌 Conecta los Conceptos</div>
<div class="subtitle">Encuentra las 4 parejas técnicas</div>
</div>
</div>
<div class="stats-row">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="main">
<div class="memory-grid" id="grid"></div>
</div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejar conceptos</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const pairsData=[
{a:"Polímetro",b:"Medir voltaje",exp:"El polímetro es el instrumento básico para medir tensión, corriente y resistencia."},
{a:"Regleta",b:"Conectar cables",exp:"La regleta permite unir varios cables de forma segura y ordenada."},
{a:"Interruptor diferencial",b:"Protección personas",exp:"El diferencial protege a las personas de descargas eléctricas por fuga de corriente."},
{a:"Pelacables",b:"Retirar aislante",exp:"El pelacables retira el aislamiento del cable sin dañar el conductor."}
];

let cards=[],firstCard=null,secondCard=null,locked=false,attempts=0,matched=0;
const maxAttempts=10,totalPairs=4;
const grid=document.getElementById('grid'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs'),scene=document.getElementById('scene');

function init(){
cards=[];
pairsData.forEach((p,i)=>{
cards.push({id:i*2,pairId:i,text:p.a,type:'a'});
cards.push({id:i*2+1,pairId:i,text:p.b,type:'b'});
});
shuffle(cards);
renderGrid();
ensureFits();
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}

function renderGrid(){
grid.innerHTML='';
cards.forEach(c=>{
const div=document.createElement('div');
div.className='memory-card covered';
div.dataset.id=c.id;
div.textContent='?';
div.onclick=()=>handleClick(c,div);
grid.appendChild(div);
});
}

function handleClick(card,el){
if(locked||el.classList.contains('matched')||el.classList.contains('revealed'))return;
revealCard(el,card.text);
if(!firstCard){
firstCard={card,el};
}else{
secondCard={card,el};
attempts++;
updateStats();
locked=true;
checkMatch();
}
}

function revealCard(el,text){
el.classList.remove('covered');
el.classList.add('revealed');
el.textContent=text;
el.style.transform='scale(0.95)';
setTimeout(()=>el.style.transform='scale(1)',100);
}

function coverCard(el){
el.classList.remove('revealed');
el.classList.add('covered');
el.textContent='?';
}

function checkMatch(){
const isMatch=firstCard.card.pairId===secondCard.card.pairId&&firstCard.card.type!==secondCard.card.type;
if(isMatch){
firstCard.el.classList.remove('revealed');
firstCard.el.classList.add('matched');
secondCard.el.classList.remove('revealed');
secondCard.el.classList.add('matched');
matched++;
updateStats();
resetSelection();
if(matched===totalPairs)endGame(true);
}else{
firstCard.el.classList.add('shake');
secondCard.el.classList.add('shake');
setTimeout(()=>{
firstCard.el.classList.remove('shake');
secondCard.el.classList.remove('shake');
coverCard(firstCard.el);
coverCard(secondCard.el);
resetSelection();
if(attempts>=maxAttempts)endGame(false);
},2000);
}
}

function resetSelection(){firstCard=null;secondCard=null;locked=false;}

function updateStats(){
attemptsEl.textContent=`Intento ${attempts}/${maxAttempts}`;
pairsEl.textContent=`${matched}/${totalPairs} parejas`;
}

function endGame(won){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const unmatchedPairs=pairsData.filter((_,i)=>!cards.some(c=>c.pairId===i&&document.querySelector(`[data-id="${c.id}"]`).classList.contains('matched'))).length>0?pairsData.slice(matched):'';
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${won?'¡Excelente trabajo!':'¡Sigue practicando!'}</div>
<div class="results-score">${matched}/${totalPairs}</div>
<div class="results-subtitle">Parejas encontradas en ${attempts} intentos</div>
</div>
<div class="results-list">
${pairsData.map((p,i)=>`<div class="result-item ${i<matched?'correct':'incorrect'}">
<div class="result-question">${p.a} ↔ ${p.b}</div>
<div class="result-answer">${i<matched?'✓ Emparejado':'✗ No encontrado'}</div>
<div class="result-explanation">${p.exp}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{init();ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual del Electricista ⚡ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual ⚡</div>
<div class="subtitle" id="instruction">Selecciona la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="sentence"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Primer día en el taller. ¡Demuestra tu vocabulario!</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const data=[
{sentence:"Para medir tensión, uso el ___.",answer:"multímetro",options:["multímetro","buscapolos","alicates"],exp:"El multímetro mide tensión, corriente y resistencia. El buscapolos solo detecta fase."},
{sentence:"El cable de tierra siempre es de color ___.",answer:"amarillo-verde",options:["amarillo-verde","azul","marrón"],exp:"Por normativa, tierra es amarillo-verde. Azul es neutro y marrón es fase."},
{sentence:"La unidad de potencia eléctrica es el ___.",answer:"vatio",options:["vatio","voltio","amperio"],exp:"El vatio (W) mide potencia. El voltio mide tensión y el amperio mide corriente."},
{sentence:"Para proteger un circuito contra sobrecargas, instalo un ___.",answer:"magnetotérmico",options:["magnetotérmico","enchufe","clema"],exp:"El magnetotérmico corta el circuito ante sobrecargas. Enchufes y clemas son conexiones."},
{sentence:"Para unir cables de forma segura uso una ___.",answer:"clema",options:["clema","cinta aislante","brida"],exp:"La clema garantiza conexión segura y desmontable. La cinta es temporal y la brida solo sujeta."},
{sentence:"La herramienta para pelar cables se llama ___.",answer:"pelacables",options:["pelacables","destornillador","alicate"],exp:"El pelacables está diseñado para retirar el aislante sin dañar el conductor."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),sentenceEl=document.getElementById('sentence'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),instruction=document.getElementById('instruction');

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
prog.style.width=(idx/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
instruction.textContent='Selecciona la palabra correcta';
const parts=d.sentence.split('___');
sentenceEl.innerHTML=parts[0]+'<span class="cloze-blank">___</span>'+(parts[1]||'');
opts.innerHTML=d.options.map(o=>`<button class="btn-option" onclick="select('${o}')">${o}</button>`).join('');
helper.textContent='Toca la opción correcta para completar la frase';
ensureFits();
}

function select(chosen){
const d=data[idx];
const correct=chosen===d.answer;
answers.push({sentence:d.sentence,answer:d.answer,user:chosen,correct,exp:d.exp,options:d.options});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent===d.answer)b.classList.add('correct');
else if(b.textContent===chosen&&!correct)b.classList.add('incorrect');
});
const parts=d.sentence.split('___');
sentenceEl.innerHTML=parts[0]+`<span class="cloze-filled ${correct?'correct':'incorrect'}">${chosen}</span>`+(parts[1]||'');
helper.textContent=correct?'¡Correcto!':'La respuesta correcta era: '+d.answer;
setTimeout(()=>{idx++;render();},1200);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual Completado!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Frases correctas</div>
</div>
<div class="results-list">
${answers.map(a=>{
const filled=a.sentence.replace('___',`<strong>${a.answer}</strong>`);
const wrongOpts=a.options.filter(o=>o!==a.answer).join(', ');
return `<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${filled}</div>
<div class="result-answer">${a.correct?'✓ Respondiste: '+a.user:'✗ Respondiste: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`;}).join('')}
</div>
<div class="results-tip">
<strong>💡 Consejo:</strong> Usar la terminología correcta es clave para comunicarte con compañeros y evitar errores en obra. Un término mal usado puede causar accidentes o instalaciones defectuosas.
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

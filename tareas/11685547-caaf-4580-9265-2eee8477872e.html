
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Ordena y Conquista: Protocolos de Taller - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena y Conquista</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main" id="main"></div>
<div class="footer">
<div class="helper" id="helper">Usa ↑↓ o arrastra para reordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Primera semana en el taller</div>
<div class="modal-body">Tu supervisor te evalúa. Ordena 3 procedimientos de climatización correctamente para demostrar que estás listo.</div>
<div class="modal-actions">
<button class="cta" onclick="closeModal()">¡Comenzar!</button>
</div>
</div>
</div>

<script>
const challenges = [
{
title: "Purgar circuito de refrigerante",
steps: [
{id:1, text:"Conectar manómetros al sistema"},
{id:2, text:"Abrir válvula de baja presión"},
{id:3, text:"Purgar aire del circuito"},
{id:4, text:"Verificar presión estable"},
{id:5, text:"Cerrar válvulas y desconectar"}
],
correct: [1,2,3,4,5],
tip: "Purgar aire evita daños en el compresor y mejora eficiencia."
},
{
title: "Revisión antes de encender split",
steps: [
{id:1, text:"Verificar conexiones eléctricas"},
{id:2, text:"Comprobar filtros limpios"},
{id:3, text:"Revisar tubería sin fugas"},
{id:4, text:"Encender y probar modos"}
],
correct: [1,2,3,4],
tip: "Revisar antes de encender previene averías costosas."
},
{
title: "Limpieza segura de filtros",
steps: [
{id:1, text:"Apagar unidad interior"},
{id:2, text:"Desconectar de la corriente"},
{id:3, text:"Retirar filtros con cuidado"},
{id:4, text:"Limpiar con agua y secar"},
{id:5, text:"Reinstalar y reconectar"}
],
correct: [1,2,3,4,5],
tip: "Siempre desconecta antes de manipular componentes."
}
];

let currentChallenge = 0;
let userAnswers = [];
let currentOrder = [];
let draggedItem = null;

const scene = document.getElementById('scene');
const main = document.getElementById('main');
const cta = document.getElementById('cta');
const subtitle = document.getElementById('subtitle');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const helper = document.getElementById('helper');
const modal = document.getElementById('modal');

function closeModal() {
    modal.classList.remove('active');
    renderChallenge();
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function renderChallenge() {
    const ch = challenges[currentChallenge];
    currentOrder = shuffle(ch.steps);
    subtitle.textContent = ch.title;
    counter.textContent = `Reto ${currentChallenge + 1}/3`;
    progress.style.width = `${(currentChallenge / 3) * 100}%`;
    helper.textContent = "Usa ↑↓ o arrastra para reordenar";
    cta.textContent = "Confirmar orden";
    cta.onclick = confirmOrder;
    cta.disabled = false;
    renderCards();
    ensureFits();
}

function renderCards() {
    main.innerHTML = `<div class="cards" id="cards">${currentOrder.map((step, i) => `
        <div class="card" data-idx="${i}" draggable="true">
            <span class="card-num">${i + 1}</span>
            <span class="card-text">${step.text}</span>
            <div class="card-controls">
                <button class="btn-ghost" aria-label="Subir" onclick="moveUp(${i})">↑</button>
                <button class="btn-ghost" aria-label="Bajar" onclick="moveDown(${i})">↓</button>
            </div>
        </div>
    `).join('')}</div>`;
    setupDragDrop();
}

function moveUp(idx) {
    if (idx === 0) return;
    [currentOrder[idx], currentOrder[idx - 1]] = [currentOrder[idx - 1], currentOrder[idx]];
    renderCards();
    animateCard(idx - 1);
}

function moveDown(idx) {
    if (idx === currentOrder.length - 1) return;
    [currentOrder[idx], currentOrder[idx + 1]] = [currentOrder[idx + 1], currentOrder[idx]];
    renderCards();
    animateCard(idx + 1);
}

function animateCard(idx) {
    const cards = document.querySelectorAll('.card');
    if (cards[idx]) {
        cards[idx].classList.add('dragging');
        setTimeout(() => cards[idx].classList.remove('dragging'), 200);
    }
}

function setupDragDrop() {
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('touchstart', handleTouchStart, {passive: false});
        card.addEventListener('touchmove', handleTouchMove, {passive: false});
        card.addEventListener('touchend', handleTouchEnd);
    });
}

function handleDragStart(e) {
    draggedItem = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd() {
    this.classList.remove('dragging');
    draggedItem = null;
}

function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
}

function handleDrop(e) {
    e.preventDefault();
    if (draggedItem === this) return;
    const fromIdx = parseInt(draggedItem.dataset.idx);
    const toIdx = parseInt(this.dataset.idx);
    const item = currentOrder.splice(fromIdx, 1)[0];
    currentOrder.splice(toIdx, 0, item);
    renderCards();
    animateCard(toIdx);
}

let touchStartY = 0;
let touchCard = null;

function handleTouchStart(e) {
    touchCard = this;
    touchStartY = e.touches[0].clientY;
    this.classList.add('dragging');
}

function handleTouchMove(e) {
    e.preventDefault();
}

function handleTouchEnd(e) {
    if (!touchCard) return;
    touchCard.classList.remove('dragging');
    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchEndY - touchStartY;
    const idx = parseInt(touchCard.dataset.idx);
    if (Math.abs(diff) > 30) {
        if (diff < 0) moveUp(idx);
        else moveDown(idx);
    }
    touchCard = null;
}

function confirmOrder() {
    const ch = challenges[currentChallenge];
    const userOrder = currentOrder.map(s => s.id);
    const isCorrect = JSON.stringify(userOrder) === JSON.stringify(ch.correct);
    userAnswers.push({
        title: ch.title,
        userOrder: currentOrder.map(s => s.text),
        correctOrder: ch.steps.filter(s => ch.correct.includes(s.id)).sort((a,b) => ch.correct.indexOf(a.id) - ch.correct.indexOf(b.id)).map(s => s.text),
        isCorrect,
        tip: ch.tip
    });
    showFeedback();
}

function showFeedback() {
    const ans = userAnswers[userAnswers.length - 1];
    const isLast = currentChallenge === challenges.length - 1;
    
    main.innerHTML = `
        <div class="feedback-box">
            <div class="feedback-header ${ans.isCorrect ? 'correct' : 'incorrect'}">
                ${ans.isCorrect ? '✅ ¡Orden correcto!' : '❌ Orden incorrecto'}
            </div>
            ${!ans.isCorrect ? `
                <div class="feedback-section">
                    <div class="feedback-label">Tu orden:</div>
                    ${ans.userOrder.map((t, i) => `<div class="feedback-step">${i + 1}. ${t}</div>`).join('')}
                </div>
            ` : ''}
            <div class="feedback-section">
                <div class="feedback-label">${ans.isCorrect ? 'Secuencia:' : '✅ Orden correcto:'}</div>
                ${ans.correctOrder.map((t, i) => `<div class="feedback-step ok">${i + 1}. ${t}</div>`).join('')}
            </div>
            <div class="feedback-tip">💡 ${ans.tip}</div>
        </div>
    `;
    
    helper.textContent = ans.isCorrect ? "¡Excelente trabajo!" : "Revisa la secuencia correcta";
    cta.textContent = isLast ? "Ver resultados" : "Siguiente reto";
    cta.onclick = isLast ? showResults : nextChallenge;
    
    animateCard(0);
    ensureFits();
}

function nextChallenge() {
    currentChallenge++;
    renderChallenge();
}

function showResults() {
    setTimeout(() => {
        document.documentElement.classList.replace('gameplay', 'results');
        scene.classList.replace('gameplay', 'results');
        const correctCount = userAnswers.filter(a => a.isCorrect).length;
        
        scene.innerHTML = `
            <div class="results-scroll">
                <div class="results-header">
                    <div class="results-title">🔧 ¡Evaluación completada!</div>
                    <div class="results-score">${correctCount}/3</div>
                    <div class="results-subtitle">Procedimientos correctos</div>
                </div>
                <div class="results-list">
                    ${userAnswers.map((a, i) => `
                        <div class="result-item ${a.isCorrect ? 'correct' : 'incorrect'}">
                            <div class="result-question">Reto ${i + 1}: ${a.title}</div>
                            <div class="result-answer">${a.isCorrect ? '✓ Orden correcto' : '✗ Orden incorrecto'}</div>
                            <div class="result-explanation">💡 ${a.tip}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="footer">
                    <button class="cta" onclick="completeTask()">Ver mi recompensa</button>
                </div>
            </div>
        `;
    }, 500);
}

function completeTask() {
    if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({action: 'TASK_COMPLETED'}));
    }
}

function ensureFits() {
    scene.classList.remove('compact', 'compact-xs');
    document.documentElement.style.setProperty('--ui-scale', 1);
    if (scene.scrollHeight > scene.clientHeight) scene.classList.add('compact');
    if (scene.scrollHeight > scene.clientHeight) scene.classList.add('compact-xs');
    if (scene.scrollHeight > scene.clientHeight) {
        const scale = Math.max(0.88, scene.clientHeight / scene.scrollHeight);
        document.documentElement.style.setProperty('--ui-scale', scale);
    }
}

window.addEventListener('load', () => {
    modal.classList.add('active');
    ensureFits();
});
window.addEventListener('resize', ensureFits);
window.addEventListener('orientationchange', () => setTimeout(ensureFits, 100));
</script>
</body>
</html>

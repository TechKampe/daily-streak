
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Ordena y trabaja seguro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena y trabaja seguro</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Usa ↑↓ o arrastra para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Bienvenido, técnico</div>
<div class="modal-body">Tu supervisor te evalúa. Ordena cada procedimiento de forma segura y lógica.</div>
<div class="modal-actions">
<button class="cta" onclick="closeModal()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const sequences=[
{title:"Preparar zona con herramientas eléctricas",steps:[
{id:1,text:"Inspeccionar estado de herramientas",order:1},
{id:2,text:"Despejar y señalizar el área",order:2},
{id:3,text:"Verificar conexión a tierra",order:3},
{id:4,text:"Colocarse EPIs adecuados",order:4},
{id:5,text:"Iniciar el trabajo",order:5}
],explanation:"Primero revisas herramientas, luego preparas el área, verificas tierra, te proteges y trabajas.",tip:"Nunca uses herramientas dañadas. Revísalas antes de cada uso."},
{title:"Actuar ante derrame de aceite",steps:[
{id:1,text:"Alertar a compañeros cercanos",order:1},
{id:2,text:"Señalizar la zona del derrame",order:2},
{id:3,text:"Colocarse guantes de protección",order:3},
{id:4,text:"Aplicar absorbente sobre el aceite",order:4},
{id:5,text:"Recoger residuos en contenedor",order:5}
],explanation:"Alertas, señalizas, te proteges, absorbes y recoges. Orden lógico para evitar accidentes.",tip:"Los derrames no atendidos causan resbalones. Actúa rápido y seguro."},
{title:"Recepcionar material en almacén",steps:[
{id:1,text:"Verificar albarán con el pedido",order:1},
{id:2,text:"Inspeccionar estado del material",order:2},
{id:3,text:"Firmar conformidad de recepción",order:3},
{id:4,text:"Etiquetar y ubicar en estantería",order:4}
],explanation:"Compruebas documentación, inspeccionas, firmas conforme y almacenas ordenadamente.",tip:"Nunca firmes sin verificar. Reclamar después es más difícil."}
];

let currentSeq=0,userOrders=[],draggedEl=null,draggedIdx=-1,startY=0,startTime=0;
const scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),cta=document.getElementById('cta'),subtitle=document.getElementById('subtitle'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderSequence(){
const seq=sequences[currentSeq];
subtitle.textContent=seq.title;
counter.textContent=`Reto ${currentSeq+1}/3`;
progress.style.width=((currentSeq)/3*100)+'%';
helper.textContent="Usa ↑↓ o arrastra para ordenar";
cta.textContent="Confirmar orden";
cta.disabled=false;
cta.onclick=confirmOrder;

const shuffled=shuffle(seq.steps);
cardsEl.innerHTML=shuffled.map((s,i)=>`<div class="card" data-id="${s.id}" draggable="true">
<span class="card-num">${i+1}</span>
<span class="card-text">${s.text}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveCard(${i},-1)">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveCard(${i},1)">↓</button>
</div>
</div>`).join('');

setupDrag();
ensureFits();
}

function moveCard(idx,dir){
const cards=[...cardsEl.children];
const newIdx=idx+dir;
if(newIdx<0||newIdx>=cards.length)return;
const card=cards[idx];
card.style.transition='transform 0.2s';
card.style.transform=`translateY(${dir*60}px)`;
setTimeout(()=>{
card.style.transition='';
card.style.transform='';
if(dir<0)cardsEl.insertBefore(card,cards[newIdx]);
else cardsEl.insertBefore(cards[newIdx],card);
updateNumbers();
},150);
}

function updateNumbers(){
[...cardsEl.children].forEach((c,i)=>c.querySelector('.card-num').textContent=i+1);
}

function setupDrag(){
const cards=[...cardsEl.children];
cards.forEach((card,i)=>{
card.addEventListener('pointerdown',e=>{
if(e.target.closest('.btn-ghost'))return;
draggedEl=card;draggedIdx=i;startY=e.clientY;startTime=Date.now();
card.classList.add('dragging');
card.setPointerCapture(e.pointerId);
});
card.addEventListener('pointermove',e=>{
if(!draggedEl||draggedEl!==card)return;
const dy=e.clientY-startY;
card.style.transform=`translateY(${dy}px)`;
card.style.zIndex=10;
});
card.addEventListener('pointerup',e=>{
if(!draggedEl||draggedEl!==card)return;
const dy=e.clientY-startY;
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(dy)/elapsed;
const threshold=40,velThreshold=0.4;
const cards=[...cardsEl.children];
const idx=cards.indexOf(card);
card.classList.remove('dragging');
card.style.transform='';
card.style.zIndex='';

if(dy<0&&(Math.abs(dy)>threshold||velocity>velThreshold)&&idx>0){
cardsEl.insertBefore(card,cards[idx-1]);
}else if(dy>0&&(Math.abs(dy)>threshold||velocity>velThreshold)&&idx<cards.length-1){
cardsEl.insertBefore(cards[idx+1],card);
}
updateNumbers();
draggedEl=null;draggedIdx=-1;
});
card.addEventListener('pointercancel',()=>{
if(draggedEl===card){
card.classList.remove('dragging');
card.style.transform='';
card.style.zIndex='';
draggedEl=null;
}
});
});
}

function confirmOrder(){
const seq=sequences[currentSeq];
const userOrder=[...cardsEl.children].map(c=>parseInt(c.dataset.id));
const correctOrder=seq.steps.slice().sort((a,b)=>a.order-b.order).map(s=>s.id);
const isCorrect=JSON.stringify(userOrder)===JSON.stringify(correctOrder);

userOrders.push({
title:seq.title,
userOrder:userOrder.map(id=>seq.steps.find(s=>s.id===id).text),
correctOrder:correctOrder.map(id=>seq.steps.find(s=>s.id===id).text),
isCorrect,
explanation:seq.explanation,
tip:seq.tip
});

showFeedback(isCorrect,seq,userOrder,correctOrder);
}

function showFeedback(isCorrect,seq,userOrder,correctOrder){
cta.disabled=true;
const cards=[...cardsEl.children];

if(isCorrect){
cards.forEach(c=>c.classList.add('correct'));
helper.innerHTML="✅ ¡Orden correcto!";
}else{
cards.forEach((c,i)=>{
const userId=parseInt(c.dataset.id);
const correctId=correctOrder[i];
if(userId===correctId)c.classList.add('correct');
else c.classList.add('incorrect');
});
helper.innerHTML="❌ Orden incorrecto";
}

setTimeout(()=>{
currentSeq++;
if(currentSeq<3){
cards.forEach(c=>{c.classList.remove('correct','incorrect');});
renderSequence();
}else{
showResults();
}
},1500);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');

const correctCount=userOrders.filter(o=>o.isCorrect).length;

scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔧 ¡Evaluación completada!</div>
<div class="results-score">${correctCount}/3</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${userOrders.map((o,i)=>`<div class="result-item ${o.isCorrect?'correct':'incorrect'}">
<div class="result-question">${i+1}. ${o.title}</div>
${o.isCorrect?`<div class="result-answer">✅ ¡Orden correcto!</div>
<div class="result-explanation"><strong>Secuencia:</strong><br>${o.correctOrder.map((t,j)=>`${j+1}. ${t}`).join('<br>')}</div>`
:`<div class="result-answer">❌ Tu orden:</div>
<div class="result-explanation">${o.userOrder.map((t,j)=>`${j+1}. ${t}`).join('<br>')}</div>
<div class="result-answer" style="margin-top:8px">✅ Orden correcto:</div>
<div class="result-explanation">${o.correctOrder.map((t,j)=>`${j+1}. ${t}`).join('<br>')}</div>`}
<div class="result-explanation"><em>${o.explanation}</em></div>
<div class="result-explanation"><strong>💡 Consejo:</strong> ${o.tip}</div>
</div>`).join('')}
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function closeModal(){modal.classList.remove('active');renderSequence();}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();modal.classList.add('active');});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

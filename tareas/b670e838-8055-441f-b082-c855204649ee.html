
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔌 Conecta los Conceptos Eléctricos - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
.memory-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%}
.mem-card{height:70px;width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform 0.2s ease;box-sizing:border-box;padding:4px}
.mem-card.covered{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700}
.mem-card.uncovered{background:#fff;border:2px solid #0B214A;color:#0B214A;font-size:12px;line-height:1.2}
.mem-card.matched{background:#d4edda;border:2px solid #28a745;color:#0B214A;font-size:12px;line-height:1.2}
.mem-card.shake{animation:shake 0.5s ease}
.mem-card.pop{animation:pop 0.2s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(0.95)}100%{transform:scale(1)}}
.stats-row{display:flex;justify-content:space-between;padding:0 16px;font-size:14px;color:#0B214A;margin-bottom:8px}
.pair-explanation{background:#f8f9fa;border-radius:8px;padding:12px;margin-bottom:8px}
.pair-explanation .pair-title{font-weight:700;color:#0B214A;margin-bottom:4px;font-size:14px}
.pair-explanation .pair-desc{color:#555;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔌 Conecta Conceptos</div>
<div class="subtitle">Encuentra las 4 parejas técnicas</div>
</div>
</div>
<div class="stats-row">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="main">
<div class="memory-board" id="board"></div>
</div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejar conceptos</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const pairs=[
{id:1,a:"Interruptor diferencial",b:"Protege contra contactos eléctricos",exp:"El diferencial detecta fugas de corriente y corta el suministro para evitar electrocuciones."},
{id:2,a:"Conductor de fase",b:"Cable que lleva corriente activa",exp:"La fase transporta la corriente desde la red hasta los receptores de la instalación."},
{id:3,a:"Toma de tierra",b:"Deriva corrientes de fuga al suelo",exp:"La toma de tierra conduce las corrientes peligrosas hacia el terreno, protegiendo personas y equipos."},
{id:4,a:"Magnetotérmico",b:"Corta el circuito por sobrecarga",exp:"El magnetotérmico protege contra sobrecargas y cortocircuitos desconectando automáticamente."}
];
let cards=[],firstCard=null,secondCard=null,locked=false,attempts=0,matched=0;
const maxAttempts=10,totalPairs=4;
const board=document.getElementById('board'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs'),scene=document.getElementById('scene');

function init(){
cards=[];
pairs.forEach(p=>{
cards.push({pairId:p.id,text:p.a,type:'a'});
cards.push({pairId:p.id,text:p.b,type:'b'});
});
shuffle(cards);
renderBoard();
ensureFits();
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}

function renderBoard(){
board.innerHTML='';
cards.forEach((c,i)=>{
const div=document.createElement('div');
div.className='mem-card covered';
div.dataset.index=i;
div.textContent='?';
div.onclick=()=>handleClick(i,div);
board.appendChild(div);
});
}

function handleClick(idx,el){
if(locked)return;
if(el.classList.contains('matched'))return;
if(el.classList.contains('uncovered'))return;
uncover(idx,el);
if(!firstCard){
firstCard={idx,el};
}else if(firstCard.idx!==idx){
secondCard={idx,el};
locked=true;
attempts++;
updateStats();
checkMatch();
}
}

function uncover(idx,el){
el.classList.remove('covered');
el.classList.add('uncovered','pop');
el.textContent=cards[idx].text;
}

function cover(el,idx){
el.classList.remove('uncovered','shake');
el.classList.add('covered');
el.textContent='?';
}

function checkMatch(){
const c1=cards[firstCard.idx],c2=cards[secondCard.idx];
if(c1.pairId===c2.pairId&&c1.type!==c2.type){
firstCard.el.classList.remove('uncovered');
firstCard.el.classList.add('matched');
secondCard.el.classList.remove('uncovered');
secondCard.el.classList.add('matched');
matched++;
updateStats();
resetTurn();
if(matched===totalPairs){endGame(true);}
}else{
firstCard.el.classList.add('shake');
secondCard.el.classList.add('shake');
setTimeout(()=>{
cover(firstCard.el,firstCard.idx);
cover(secondCard.el,secondCard.idx);
resetTurn();
if(attempts>=maxAttempts){endGame(false);}
},2000);
}
}

function resetTurn(){firstCard=null;secondCard=null;locked=false;}

function updateStats(){
attemptsEl.textContent=`Intento ${attempts}/${maxAttempts}`;
pairsEl.textContent=`${matched}/${totalPairs} parejas`;
}

function endGame(won){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const missing=pairs.filter(p=>!document.querySelector(`.mem-card.matched[data-index="${cards.findIndex(c=>c.pairId===p.id&&c.type==='a')}"]`));
scene.innerHTML=`
<div class="results-scroll">
<div class="results-header">
<div class="results-title">${won?'¡Felicidades! 🎉':'¡Sigue practicando! 💪'}</div>
<div class="results-score">${matched}/${totalPairs}</div>
<div class="results-subtitle">${won?'Has conectado todas las parejas':'Parejas encontradas'}</div>
</div>
<div class="results-list">
${pairs.map(p=>`
<div class="pair-explanation">
<div class="pair-title">${p.a} ↔ ${p.b}</div>
<div class="pair-desc">${p.exp}</div>
</div>
`).join('')}
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{init();ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
init();
</script>
</body>
</html>

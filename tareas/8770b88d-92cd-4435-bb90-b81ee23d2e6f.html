
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o Realidad? ⚡ Desafío Eléctrico - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o Realidad? ⚡</div>
<div class="subtitle">Tu supervisor evalúa tus conocimientos</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div id="statement-area"></div>
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">¿Verdadero o Falso? Elige tu respuesta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 2_low.png" alt="" loading="lazy">
<script>
const statements=[
{text:"El voltaje doméstico estándar en España es de 220-230V.",answer:true,exp:"Correcto. En España y Europa el voltaje doméstico es 230V (±10%), antes 220V."},
{text:"Los guantes de látex domésticos protegen contra descargas eléctricas.",answer:false,exp:"Falso. Solo los guantes dieléctricos certificados (clase 00 o superior) protegen contra electricidad."},
{text:"Siempre hay que desconectar el circuito antes de manipularlo.",answer:true,exp:"Correcto. Es la primera regla de seguridad: cortar alimentación antes de intervenir."},
{text:"La madera seca es un buen conductor de electricidad.",answer:false,exp:"Falso. La madera seca es aislante. Solo húmeda puede conducir algo de corriente."},
{text:"El cable azul es el neutro según normativa española.",answer:true,exp:"Correcto. Azul=neutro, marrón/negro/gris=fase, verde-amarillo=tierra (REBT)."},
{text:"Si el diferencial no salta, el circuito es seguro para trabajar.",answer:false,exp:"Falso. Siempre debes verificar ausencia de tensión con un comprobador homologado."},
{text:"Los EPI eléctricos deben revisarse visualmente antes de cada uso.",answer:true,exp:"Correcto. Revisar guantes, alfombras y herramientas aisladas antes de usarlos es obligatorio."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),stArea=document.getElementById('statement-area'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=statements.length){showResults();return}
const s=statements[idx];
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
stArea.innerHTML=`<div class="result-question" style="font-size:1.15rem;line-height:1.5;text-align:center;padding:1rem 0.5rem;">${s.text}</div>`;
opts.innerHTML=`<button class="btn-option" id="btn-true" onclick="choose(true)">✓ Verdadero</button><button class="btn-option" id="btn-false" onclick="choose(false)">✗ Falso</button>`;
ensureFits();
}

function choose(val){
const s=statements[idx];
const correct=val===s.answer;
const btnT=document.getElementById('btn-true'),btnF=document.getElementById('btn-false');
btnT.disabled=true;btnF.disabled=true;
if(val){btnT.classList.add(correct?'correct':'incorrect');}
else{btnF.classList.add(correct?'correct':'incorrect');}
answers.push({text:s.text,userAnswer:val,correct,exp:s.exp,realAnswer:s.answer});
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
const score=answers.filter(a=>a.correct).length;
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">${a.correct?'✓ Acertaste':'✗ Fallaste'} — Correcta: ${a.realAnswer?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item" style="background:var(--accent);color:#fff;margin-top:1rem;">
<div class="result-question">💡 Consejo del supervisor</div>
<div class="result-explanation">Antes de tocar cualquier cable, usa SIEMPRE un comprobador de tensión homologado. Nunca confíes solo en el interruptor o el diferencial.</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Conecta los Conceptos: EPIs Edition - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
.memory-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%;max-width:400px;margin:0 auto;}
.mem-card{height:70px;width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform 0.2s ease;font-family:'Baloo 2',sans-serif;box-sizing:border-box;padding:4px;}
.mem-card.tapada{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700;}
.mem-card.destapada{background:#fff;border:2px solid #0B214A;color:#0B214A;font-size:12px;line-height:1.2;}
.mem-card.matched{background:#d4edda;border:2px solid #28a745;color:#0B214A;font-size:12px;line-height:1.2;}
.mem-card.shake{animation:shake 0.5s ease-in-out;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.mem-card.pop{animation:pop 0.2s ease-out;}
@keyframes pop{0%{transform:scale(0.95)}100%{transform:scale(1)}}
.stats-row{display:flex;justify-content:space-between;padding:0 16px;font-size:14px;color:#0B214A;font-family:'Baloo 2',sans-serif;}
.stats-row span{background:rgba(255,255,255,0.9);padding:4px 12px;border-radius:12px;}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🧠 EPIs Edition</div>
<div class="subtitle">Empareja cada EPI con su protección</div>
</div>
</div>
<div class="stats-row">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="memory-board" id="board"></div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejarlas</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const pairs=[
{id:1,a:"Casco",b:"Protege cabeza"},
{id:2,a:"Gafas de seguridad",b:"Protege ojos"},
{id:3,a:"Arnés anticaídas",b:"Trabajos en altura"},
{id:4,a:"Tapones auditivos",b:"Protege oídos"}
];
const explanations={
1:"El casco es obligatorio en obra para proteger la cabeza de impactos y caída de objetos.",
2:"Las gafas protegen los ojos de proyecciones, polvo y salpicaduras químicas.",
3:"El arnés anticaídas es obligatorio en trabajos a más de 2 metros de altura.",
4:"Los tapones reducen el ruido y previenen daños auditivos en ambientes ruidosos."
};
let cards=[],firstCard=null,secondCard=null,attempts=0,matched=0,locked=false;
const maxAttempts=10,totalPairs=4;
const board=document.getElementById('board'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs'),scene=document.getElementById('scene');

function init(){
cards=[];
pairs.forEach(p=>{
cards.push({pairId:p.id,text:p.a,type:'a'});
cards.push({pairId:p.id,text:p.b,type:'b'});
});
shuffle(cards);
renderBoard();
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}

function renderBoard(){
board.innerHTML='';
cards.forEach((c,i)=>{
const div=document.createElement('div');
div.className='mem-card tapada';
div.textContent='?';
div.dataset.index=i;
div.onclick=()=>flipCard(i,div);
board.appendChild(div);
});
updateStats();
ensureFits();
}

function flipCard(index,el){
if(locked)return;
if(el.classList.contains('matched'))return;
if(el.classList.contains('destapada'))return;
if(firstCard&&firstCard.index===index)return;
el.classList.remove('tapada');
el.classList.add('destapada','pop');
el.textContent=cards[index].text;
if(!firstCard){
firstCard={index,el,pairId:cards[index].pairId};
}else{
secondCard={index,el,pairId:cards[index].pairId};
attempts++;
updateStats();
locked=true;
checkMatch();
}
}

function checkMatch(){
if(firstCard.pairId===secondCard.pairId){
setTimeout(()=>{
firstCard.el.classList.remove('destapada');
firstCard.el.classList.add('matched');
secondCard.el.classList.remove('destapada');
secondCard.el.classList.add('matched');
matched++;
updateStats();
resetSelection();
if(matched===totalPairs){
setTimeout(showResults,500);
}
},300);
}else{
setTimeout(()=>{
firstCard.el.classList.add('shake');
secondCard.el.classList.add('shake');
setTimeout(()=>{
firstCard.el.classList.remove('destapada','shake');
firstCard.el.classList.add('tapada');
firstCard.el.textContent='?';
secondCard.el.classList.remove('destapada','shake');
secondCard.el.classList.add('tapada');
secondCard.el.textContent='?';
resetSelection();
if(attempts>=maxAttempts&&matched<totalPairs){
setTimeout(showResults,500);
}
},500);
},1500);
}
}

function resetSelection(){firstCard=null;secondCard=null;locked=false;}
function updateStats(){
attemptsEl.textContent=`Intento ${attempts}/${maxAttempts}`;
pairsEl.textContent=`${matched}/${totalPairs} parejas`;
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const won=matched===totalPairs;
const missingPairs=pairs.filter(p=>!cards.some((c,i)=>c.pairId===p.id&&board.children[i].classList.contains('matched')));
let html=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${won?'¡Excelente trabajo!':'¡Sigue practicando!'}</div>
<div class="results-score">${matched}/${totalPairs}</div>
<div class="results-subtitle">${won?'Todas las parejas encontradas':`Encontraste ${matched} de ${totalPairs} parejas en ${attempts} intentos`}</div>
</div>
<div class="results-list">`;
pairs.forEach(p=>{
const wasMatched=won||!missingPairs.find(m=>m.id===p.id);
html+=`<div class="result-item ${wasMatched?'correct':'incorrect'}">
<div class="result-question">${p.a} → ${p.b}</div>
<div class="result-answer">${wasMatched?'✓ Emparejado':'✗ No encontrado'}</div>
<div class="result-explanation">${explanations[p.id]}</div>
</div>`;
});
html+=`</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
scene.innerHTML=html;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{init();ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Orden en el taller - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Orden en el taller</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main"><div class="board" id="board"></div></div>
<div class="footer">
<div class="helper" id="helper">Usa ↑↓ o arrastra para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Prueba de tu mentor</div>
<div class="modal-body">Eres el nuevo ayudante. Demuestra que conoces el orden correcto de los procedimientos básicos del taller.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Empezar!</button></div>
</div>
</div>
<script>
const challenges=[
{title:"Preparar herramientas para reparación eléctrica",steps:["Revisar orden de trabajo","Cortar suministro eléctrico","Verificar ausencia de tensión","Preparar herramientas necesarias","Iniciar la reparación"],correct:[0,1,2,3,4],tip:"Siempre verifica ausencia de tensión antes de tocar cualquier cable."},
{title:"Reportar incidencia al supervisor",steps:["Asegurar la zona afectada","Documentar la incidencia","Notificar al supervisor","Esperar instrucciones","Registrar en el parte diario"],correct:[0,1,2,3,4],tip:"Documenta siempre antes de notificar para dar información precisa."},
{title:"Dejar el puesto al finalizar la jornada",steps:["Guardar herramientas en su lugar","Limpiar el área de trabajo","Desconectar equipos eléctricos","Revisar que no queden materiales sueltos","Fichar salida"],correct:[0,1,2,3,4],tip:"Un puesto ordenado previene accidentes y ahorra tiempo mañana."}
];
let currentChallenge=0,userOrder=[],results=[],draggedIdx=null,startY=0,startTime=0;
const scene=document.getElementById('scene'),board=document.getElementById('board'),cta=document.getElementById('cta'),subtitle=document.getElementById('subtitle'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function closeModal(){modal.classList.remove('active');}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderChallenge(){
if(currentChallenge>=challenges.length){showResults();return;}
const ch=challenges[currentChallenge];
subtitle.textContent=ch.title;
counter.textContent=`Reto ${currentChallenge+1}/${challenges.length}`;
progress.style.width=`${(currentChallenge/challenges.length)*100}%`;
userOrder=shuffle([...Array(ch.steps.length).keys()]);
renderCards();
ensureFits();
}

function renderCards(){
const ch=challenges[currentChallenge];
board.innerHTML=userOrder.map((stepIdx,pos)=>`<div class="card" data-pos="${pos}" draggable="true">
<span class="card-num">${pos+1}</span>
<span class="card-text">${ch.steps[stepIdx]}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveUp(${pos})">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveDown(${pos})">↓</button>
</div>
</div>`).join('');
document.querySelectorAll('.card').forEach(card=>{
card.addEventListener('pointerdown',onDragStart);
card.addEventListener('pointermove',onDragMove);
card.addEventListener('pointerup',onDragEnd);
card.addEventListener('pointercancel',onDragEnd);
});
}

function moveUp(pos){if(pos>0){[userOrder[pos],userOrder[pos-1]]=[userOrder[pos-1],userOrder[pos]];renderCards();animateCard(pos-1);}}
function moveDown(pos){if(pos<userOrder.length-1){[userOrder[pos],userOrder[pos+1]]=[userOrder[pos+1],userOrder[pos]];renderCards();animateCard(pos+1);}}
function animateCard(pos){const card=board.children[pos];if(card){card.style.transform='scale(1.02)';setTimeout(()=>card.style.transform='',150);}}

function onDragStart(e){
draggedIdx=parseInt(e.currentTarget.dataset.pos);
startY=e.clientY;
startTime=Date.now();
e.currentTarget.classList.add('dragging');
e.currentTarget.setPointerCapture(e.pointerId);
}

function onDragMove(e){
if(draggedIdx===null)return;
const card=board.children[draggedIdx];
if(card)card.style.transform=`translateY(${e.clientY-startY}px)`;
}

function onDragEnd(e){
if(draggedIdx===null)return;
const card=board.children[draggedIdx];
const deltaY=e.clientY-startY;
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(deltaY)/elapsed;
const cardH=card?card.offsetHeight+8:60;
const passedDistance=Math.abs(deltaY)>cardH*0.5;
const passedVelocity=Math.abs(deltaY)>20&&velocity>0.4;
if(passedDistance||passedVelocity){
const direction=deltaY>0?1:-1;
const steps=Math.max(1,Math.round(Math.abs(deltaY)/cardH));
let newPos=draggedIdx+direction*steps;
newPos=Math.max(0,Math.min(userOrder.length-1,newPos));
if(newPos!==draggedIdx){
const item=userOrder.splice(draggedIdx,1)[0];
userOrder.splice(newPos,0,item);
renderCards();
animateCard(newPos);
}
}
if(card){card.classList.remove('dragging');card.style.transform='';}
draggedIdx=null;
}

cta.onclick=()=>{
const ch=challenges[currentChallenge];
const isCorrect=userOrder.every((v,i)=>v===ch.correct[i]);
results.push({title:ch.title,steps:ch.steps,userOrder:[...userOrder],correct:ch.correct,isCorrect,tip:ch.tip});
currentChallenge++;
renderChallenge();
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=results.filter(r=>r.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Prueba completada!</div>
<div class="results-score">${score}/${results.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${results.map((r,i)=>`<div class="result-item ${r.isCorrect?'correct':'incorrect'}">
<div class="result-question">${r.isCorrect?'✅':'❌'} ${r.title}</div>
<div class="result-answer"><strong>Tu orden:</strong><br>${r.userOrder.map((idx,p)=>`${p+1}. ${r.steps[idx]}`).join('<br>')}</div>
${!r.isCorrect?`<div class="result-answer" style="margin-top:8px"><strong>✅ Orden correcto:</strong><br>${r.correct.map((idx,p)=>`${p+1}. ${r.steps[idx]}`).join('<br>')}</div>`:''}
<div class="result-explanation">💡 ${r.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){const m=document.querySelector('.main,.content,.board')||scene;document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();modal.classList.add('active');});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
renderChallenge();
</script>
</body>
</html>

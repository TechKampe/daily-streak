
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔌 Conecta los Conceptos Eléctricos - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%;max-width:400px;margin:0 auto}
.memory-card{height:70px;width:100%;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box;transition:transform 0.2s,background 0.2s}
.memory-card.covered{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700}
.memory-card.revealed{background:#fff;border:2px solid #0B214A;color:#0B214A;font-size:12px;line-height:1.2}
.memory-card.matched{background:#d4edda;border:2px solid #28a745;color:#0B214A;font-size:12px;line-height:1.2}
.memory-card.shake{animation:shake 0.4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.game-stats{display:flex;justify-content:center;gap:16px;font-size:14px;color:#0B214A;margin:8px 0}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔌 Conecta los Conceptos</div>
<div class="subtitle">Encuentra las 4 parejas de términos</div>
</div>
</div>
<div class="main">
<div class="game-stats">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="memory-grid" id="grid"></div>
</div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejarlas</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const pairs=[
{id:1,a:"Polímetro",b:"Medir tensión",exp:"El polímetro es el instrumento básico para medir tensión, corriente y resistencia."},
{id:2,a:"Cable fase",b:"Color marrón",exp:"Por normativa, el cable de fase se identifica con color marrón (o negro/gris)."},
{id:3,a:"Diferencial",b:"Protección personas",exp:"El diferencial detecta fugas de corriente y protege a las personas de electrocución."},
{id:4,a:"Empalme",b:"Unir conductores",exp:"El empalme es la técnica para unir dos o más conductores de forma segura."}
];
let cards=[],firstCard=null,secondCard=null,locked=false,attempts=0,matched=0;
const maxAttempts=10,grid=document.getElementById('grid'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs');

function init(){
cards=[];
pairs.forEach(p=>{
cards.push({pairId:p.id,text:p.a,type:'a'});
cards.push({pairId:p.id,text:p.b,type:'b'});
});
shuffle(cards);
renderGrid();
ensureFits();
}

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function renderGrid(){
grid.innerHTML='';
cards.forEach((c,i)=>{
const el=document.createElement('div');
el.className='memory-card covered';
el.dataset.index=i;
el.textContent='?';
el.onclick=()=>flipCard(i,el);
grid.appendChild(el);
});
}

function flipCard(index,el){
if(locked||el.classList.contains('revealed')||el.classList.contains('matched'))return;
el.classList.remove('covered');
el.classList.add('revealed');
el.textContent=cards[index].text;
el.style.transform='scale(0.95)';
setTimeout(()=>el.style.transform='scale(1)',100);
if(!firstCard){
firstCard={index,el};
}else{
secondCard={index,el};
locked=true;
attempts++;
attemptsEl.textContent=`Intento ${attempts}/10`;
checkMatch();
}
}

function checkMatch(){
const c1=cards[firstCard.index],c2=cards[secondCard.index];
if(c1.pairId===c2.pairId&&c1.type!==c2.type){
firstCard.el.classList.remove('revealed');
firstCard.el.classList.add('matched');
secondCard.el.classList.remove('revealed');
secondCard.el.classList.add('matched');
matched++;
pairsEl.textContent=`${matched}/4 parejas`;
resetTurn();
if(matched===4)endGame(true);
}else{
firstCard.el.classList.add('shake');
secondCard.el.classList.add('shake');
setTimeout(()=>{
firstCard.el.classList.remove('shake','revealed');
firstCard.el.classList.add('covered');
firstCard.el.textContent='?';
secondCard.el.classList.remove('shake','revealed');
secondCard.el.classList.add('covered');
secondCard.el.textContent='?';
resetTurn();
if(attempts>=maxAttempts)endGame(false);
},2000);
}
}

function resetTurn(){
firstCard=null;
secondCard=null;
locked=false;
}

function endGame(won){
setTimeout(()=>showResults(won),500);
}

function showResults(won){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const matchedPairs=pairs.filter((_,i)=>{
const cardA=document.querySelector(`.memory-card.matched[data-index]`);
return true;
});
const title=won?'¡Excelente trabajo!':'¡Buen intento!';
const subtitle=won?`Encontraste las 4 parejas en ${attempts} intentos`:`Encontraste ${matched}/4 parejas`;
let feedbackHTML=pairs.map(p=>{
const wasMatched=Array.from(grid.querySelectorAll('.matched')).some(el=>cards[el.dataset.index].pairId===p.id);
return `<div class="result-item ${wasMatched?'correct':'incorrect'}">
<div class="result-question">${p.a} ↔ ${p.b}</div>
<div class="result-answer">${wasMatched?'✓ Pareja encontrada':'✗ No encontrada'}</div>
<div class="result-explanation">${p.exp}</div>
</div>`;
}).join('');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${title}</div>
<div class="results-score">${matched}/4</div>
<div class="results-subtitle">${subtitle}</div>
</div>
<div class="results-list">${feedbackHTML}</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{init();ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primera llamada de cliente enfadado - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.chat-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-history{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.chat-bubble.npc{background:#f0f0f0;color:#333;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.player{background:#333;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble .sender{font-weight:700;font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.chat-bubble .sender img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.chat-bubble.client .sender{color:#e74c3c}
.chat-bubble.mentor .sender{color:#3498db}
.options-panel{padding:12px 16px;background:#fff;border-top:1px solid #eee;display:flex;flex-direction:column;gap:8px}
.option-btn{background:#fff;border:2px solid #6c5ce7;color:#6c5ce7;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:all 0.2s}
.option-btn:active{background:#6c5ce7;color:#fff}
.option-btn.selected{background:#6c5ce7;color:#fff}
.option-btn.correct{background:#00b894;border-color:#00b894;color:#fff}
.option-btn.partial{background:#fdcb6e;border-color:#fdcb6e;color:#333}
.option-btn.incorrect{background:#e17055;border-color:#e17055;color:#fff}
.intro-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:24px;text-align:center}
.intro-screen h2{font-size:20px;margin-bottom:12px}
.intro-screen p{font-size:14px;color:#666;margin-bottom:24px;line-height:1.5}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Cliente Enfadado</div>
<div class="subtitle" id="subtitle">Gestiona la llamada</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Intro</span>
</div>
</div>
<div class="chat-container" id="chatContainer">
<div class="intro-screen" id="introScreen">
<h2>📞 Primera llamada difícil</h2>
<p>Es tu segunda semana como técnico de climatización. Un cliente llama furioso porque su aire acondicionado falló en plena ola de calor. Tu mentor escucha desde la furgoneta.</p>
<button class="cta" onclick="startChat()">Comenzar</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const turns=[
{messages:[
{sender:"Cliente",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png",text:"¡¿Hola?! ¡Llevo DOS HORAS esperando! ¡El aire no funciona y estamos a 40 grados! ¡Esto es INACEPTABLE!",type:"client"}
],options:[
{text:"Entiendo su frustración, el calor es insoportable. Vamos a solucionarlo.",score:"correct"},
{text:"Cálmese, señor. Gritando no arreglamos nada.",score:"incorrect"},
{text:"Lo siento mucho. ¿Puede decirme qué pasó exactamente?",score:"partial"}
]},
{messages:[
{sender:"Cliente",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png",text:"¡Pues que dejó de enfriar de golpe! ¡Y pagué una pasta por la instalación hace solo 3 meses!",type:"client"},
{sender:"Mentor (susurrando)",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png",text:"Bien, valida su emoción pero pide datos técnicos...",type:"mentor"}
],options:[
{text:"Comprendo, es muy reciente. ¿El equipo enciende o está completamente apagado?",score:"correct"},
{text:"3 meses no es tanto, a veces pasan cosas. ¿Qué quiere que haga?",score:"incorrect"},
{text:"Vaya, qué mala suerte. Voy a revisarlo cuando pueda.",score:"partial"}
]},
{messages:[
{sender:"Cliente",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png",text:"Enciende pero solo echa aire caliente. ¡Necesito que vengan YA! ¡Tengo un bebé en casa!",type:"client"}
],options:[
{text:"Un bebé con este calor es prioritario. Voy a reorganizar mi agenda para ir lo antes posible.",score:"correct"},
{text:"Tranquilo, en 10 minutos estoy ahí seguro.",score:"partial"},
{text:"Mire, tengo más clientes. Haré lo que pueda.",score:"incorrect"}
]},
{messages:[
{sender:"Cliente",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png",text:"¿Y cuánto me va a costar? Porque si es caro, llamo a otra empresa...",type:"client"},
{sender:"Mentor (susurrando)",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png",text:"No prometas precios sin ver el equipo...",type:"mentor"}
],options:[
{text:"Primero diagnostico gratis y le doy presupuesto antes de tocar nada. Sin sorpresas.",score:"correct"},
{text:"Depende de lo que sea, pero no creo que sea caro.",score:"partial"},
{text:"Si quiere llamar a otra empresa, adelante. Yo cobro lo justo.",score:"incorrect"}
]},
{messages:[
{sender:"Cliente",avatar:"https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png",text:"Vale... ¿entonces en cuánto tiempo puede estar aquí?",type:"client"}
],options:[
{text:"En máximo 45 minutos. Le aviso cuando salga y si hay cambios. ¿Le parece bien?",score:"correct"},
{text:"Pues cuando llegue, no puedo decirle exactamente.",score:"incorrect"},
{text:"Salgo ya mismo, en 20 minutos estoy.",score:"partial"}
]}
];

const feedback={
correct:{emoji:"✅",label:"Excelente",desc:"Respuesta empática y profesional."},
partial:{emoji:"⚠️",label:"Mejorable",desc:"Aceptable pero podría generar más confianza."},
incorrect:{emoji:"❌",label:"A evitar",desc:"Puede escalar el conflicto."}
};

let currentTurn=0,answers=[],chatHistory=[];

function startChat(){
document.getElementById('introScreen').style.display='none';
renderTurn();
}

function renderTurn(){
if(currentTurn>=turns.length){showResults();return}
const turn=turns[currentTurn];
const container=document.getElementById('chatContainer');
container.innerHTML=`
<div class="chat-history" id="chatHistory"></div>
<div class="options-panel" id="optionsPanel"></div>`;
const historyEl=document.getElementById('chatHistory');
chatHistory.forEach(msg=>{
historyEl.innerHTML+=createBubble(msg.sender,msg.avatar,msg.text,msg.type,msg.isPlayer);
});
turn.messages.forEach(msg=>{
chatHistory.push(msg);
historyEl.innerHTML+=createBubble(msg.sender,msg.avatar,msg.text,msg.type,false);
});
historyEl.scrollTop=historyEl.scrollHeight;
const optPanel=document.getElementById('optionsPanel');
turn.options.forEach((opt,i)=>{
optPanel.innerHTML+=`<button class="option-btn" onclick="selectOption(${i})">${opt.text}</button>`;
});
updateProgress();
ensureFits();
}

function createBubble(sender,avatar,text,type,isPlayer){
if(isPlayer){
return `<div class="chat-bubble player"><div class="sender">Tú</div>${text}</div>`;
}
return `<div class="chat-bubble npc ${type}"><div class="sender"><img src="${avatar}" alt="">${sender}</div>${text}</div>`;
}

function selectOption(idx){
const turn=turns[currentTurn];
const opt=turn.options[idx];
const btns=document.querySelectorAll('.option-btn');
btns.forEach((btn,i)=>{
btn.disabled=true;
if(i===idx){
btn.classList.add(opt.score);
}
});
chatHistory.push({sender:"Tú",text:opt.text,isPlayer:true});
answers.push({turn:currentTurn+1,text:opt.text,score:opt.score,question:turn.messages[0].text});
setTimeout(()=>{
currentTurn++;
renderTurn();
},800);
}

function updateProgress(){
const pct=((currentTurn)/turns.length)*100;
document.getElementById('progress').style.width=pct+'%';
document.getElementById('counter').textContent=`${currentTurn+1}/${turns.length}`;
document.getElementById('subtitle').textContent=`Turno ${currentTurn+1} de ${turns.length}`;
}

function showResults(){
setTimeout(()=>{
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const correctCount=answers.filter(a=>a.score==='correct').length;
const totalScore=answers.reduce((acc,a)=>acc+(a.score==='correct'?2:a.score==='partial'?1:0),0);
const maxScore=turns.length*2;
scene.innerHTML=`
<div class="results-scroll">
<div class="results-header">
<div class="results-title">📞 Llamada completada</div>
<div class="results-score">${correctCount}/${turns.length}</div>
<div class="results-subtitle">Respuestas óptimas</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`
<div class="result-item ${a.score==='correct'?'correct':a.score==='partial'?'partial':'incorrect'}">
<div class="result-question">Turno ${a.turn}: ${a.question.substring(0,50)}...</div>
<div class="result-answer">${feedback[a.score].emoji} ${feedback[a.score].label}</div>
<div class="result-explanation">${feedback[a.score].desc}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Ante un cliente enfadado: escucha sin interrumpir, valida su emoción ("entiendo su frustración"), y ofrece una solución concreta con plazos realistas. Nunca prometas lo que no puedes cumplir.</div>
</div>
</div>
<div class="footer" style="position:sticky;bottom:0;background:#fff;padding:16px;border-top:1px solid #eee">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.chat-container')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.chat-container')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

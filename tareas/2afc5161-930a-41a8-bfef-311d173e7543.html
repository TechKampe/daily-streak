
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Kit 🧰 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Kit 🧰</div>
<div class="subtitle" id="subtitle">Tu primer día como ayudante</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="cloze-text" style="font-size:1.1rem;text-align:center;padding:0 8px;margin-bottom:16px;line-height:1.5"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Selecciona la palabra correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">¡Bienvenido, ayudante! 👷</div>
<div class="modal-body">El oficial te pide preparar el material. Completa cada frase eligiendo la palabra correcta.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>

<script>
const clozes=[
{sentence:"Para comprobar si hay tensión en un enchufe, uso el ___.",blank:"buscapolos",opts:["buscapolos","pelacables","alicates"],exp:"El buscapolos detecta tensión; el pelacables retira aislante y los alicates sujetan o cortan."},
{sentence:"Antes de trabajar en el cuadro, debo desconectar el ___.",blank:"ICP",opts:["ICP","diferencial","enchufe"],exp:"El ICP (Interruptor de Control de Potencia) corta toda la instalación; el diferencial protege de fugas y el enchufe es solo un punto de consumo."},
{sentence:"Para unir dos cables de forma segura utilizo una ___.",blank:"regleta",opts:["regleta","cinta aislante","brida"],exp:"La regleta garantiza conexión mecánica y eléctrica; la cinta aísla pero no une, y la brida solo agrupa cables."},
{sentence:"El cable verde y amarillo siempre va conectado a ___.",blank:"tierra",opts:["tierra","fase","neutro"],exp:"Verde/amarillo es tierra por normativa; la fase es marrón/negro y el neutro es azul."},
{sentence:"Para medir la resistencia de un circuito uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","destornillador"],exp:"El multímetro mide tensión, corriente y resistencia; el buscapolos solo detecta tensión y el destornillador es herramienta manual."},
{sentence:"El cableado empotrado se protege con ___.",blank:"tubo corrugado",opts:["tubo corrugado","cinta aislante","manguera"],exp:"El tubo corrugado protege el cable en obra; la cinta aísla empalmes y la manguera es para agua."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),clozeText=document.getElementById('cloze-text'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=clozes.length){showResults();return}
const c=clozes[idx];
clozeText.innerHTML=c.sentence.replace("___","<u style='padding:0 4px;font-weight:700'>___</u>");
prog.style.width=(idx/clozes.length*100)+'%';
counter.textContent=(idx+1)+'/'+clozes.length;
opts.innerHTML=c.opts.map(o=>`<button class="btn-option" onclick="selectAnswer('${o}')">${o}</button>`).join('');
ensureFits();
}

function selectAnswer(ans){
const c=clozes[idx];
const correct=ans===c.blank;
answers.push({sentence:c.sentence,blank:c.blank,user:ans,correct,exp:c.exp,opts:c.opts});
opts.querySelectorAll('.btn-option').forEach(b=>{
if(b.textContent===ans)b.classList.add(correct?'correct':'incorrect');
if(b.textContent===c.blank&&!correct)b.classList.add('correct');
b.disabled=true;
});
clozeText.innerHTML=c.sentence.replace("___",`<u style="padding:0 4px;font-weight:700;color:${correct?'var(--ok)':'var(--err)'};">${ans}</u>`);
setTimeout(()=>{idx++;render();},900);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Kit preparado! 🧰</div>
<div class="results-score">${score}/${clozes.length}</div>
<div class="results-subtitle">Frases completadas correctamente</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace("___","<strong>"+a.blank+"</strong>")}</div>
<div class="result-answer">${a.correct?'✓ Correcto':'✗ Respondiste: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="results-tip" style="background:var(--surface);border-radius:12px;padding:16px;margin:16px 0;">
<strong>💡 Consejo:</strong> Dominar el vocabulario técnico te ayuda a comunicarte con tu equipo y evitar errores en obra. ¡Sigue practicando!
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

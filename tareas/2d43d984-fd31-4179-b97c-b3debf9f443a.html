
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o Realidad? ⚡ Seguridad Eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o Realidad? ⚡</div>
<div class="subtitle">Seguridad Eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<div class="statement-text" id="statement"></div>
</div>
</div>
<div class="footer">
<div class="helper">¿Esta afirmación es verdadera o falsa?</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">✓ Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">✗ Falso</button>
</div>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔌 Primera semana en obra</div>
<div class="modal-body">Tu supervisor quiere comprobar si distingues los mitos de los hechos sobre seguridad eléctrica. ¿Preparado?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Comenzar!</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const statements=[
{text:"La madera siempre aísla la electricidad",correct:false,exp:"La madera húmeda conduce electricidad. Solo la madera completamente seca tiene propiedades aislantes."},
{text:"Los guantes de látex protegen igual que los dieléctricos",correct:false,exp:"Los guantes de látex NO son aislantes certificados. Solo los guantes dieléctricos homologados protegen contra descargas."},
{text:"Un circuito desconectado puede mantener carga residual",correct:true,exp:"Los condensadores pueden retener carga peligrosa incluso con el circuito desconectado. Siempre verifica ausencia de tensión."},
{text:"El diferencial protege contra todos los accidentes eléctricos",correct:false,exp:"El diferencial protege contra contactos indirectos, pero NO contra contactos directos entre fases o cortocircuitos."},
{text:"Trabajar con una sola mano reduce el riesgo de electrocución",correct:true,exp:"Evita que la corriente atraviese el corazón. Es una buena práctica mantener una mano en el bolsillo."},
{text:"La tensión de 230V doméstica puede ser mortal",correct:true,exp:"Corrientes de apenas 30mA atravesando el corazón pueden causar fibrilación ventricular y muerte."},
{text:"Si no hay chispas, el cable está sin tensión",correct:false,exp:"La ausencia de chispas NO garantiza ausencia de tensión. Siempre usa un verificador de tensión homologado."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),modal=document.getElementById('modal'),statement=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnTrue=document.getElementById('btnTrue'),btnFalse=document.getElementById('btnFalse');

function startGame(){modal.classList.remove('active');render();}
function render(){
if(idx>=statements.length){showResults();return}
const s=statements[idx];
statement.textContent=s.text;
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
btnTrue.disabled=false;btnFalse.disabled=false;
btnTrue.classList.remove('correct','incorrect');
btnFalse.classList.remove('correct','incorrect');
ensureFits();
}

function answer(userAnswer){
btnTrue.disabled=true;btnFalse.disabled=true;
const s=statements[idx];
const isCorrect=userAnswer===s.correct;
answers.push({text:s.text,userAnswer,correctAnswer:s.correct,isCorrect,exp:s.exp});
if(userAnswer){
btnTrue.classList.add(isCorrect?'correct':'incorrect');
}else{
btnFalse.classList.add(isCorrect?'correct':'incorrect');
}
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">⚡ ¡Evaluación completada!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">"${a.text}"</div>
<div class="result-answer">Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} ${a.isCorrect?'✓':'✗'} · Correcto: ${a.correctAnswer?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Antes de tocar cualquier conductor, usa SIEMPRE un verificador de ausencia de tensión (VAT) homologado. Comprueba que funciona antes y después de cada uso.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{modal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

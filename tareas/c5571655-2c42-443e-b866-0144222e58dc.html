
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ Primero lo primero: ordena y no te electrocutes - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">⚡ Ordena y no te electrocutes</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Usa ↑↓ o arrastra para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">👷 ¡Bienvenido, aprendiz!</div>
<div class="modal-body">Tu mentor quiere ver que conoces los protocolos. Ordena cada secuencia de pasos correctamente.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Empezar!</button></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const challenges=[
{title:"Trabajar en cuadro eléctrico",steps:["Cortar suministro eléctrico","Verificar ausencia de tensión","Señalizar zona de trabajo","Realizar la intervención","Rearmar el sistema"],tip:"Nunca trabajes sin verificar ausencia de tensión con un detector homologado."},
{title:"Cambiar un enchufe",steps:["Desconectar el diferencial","Comprobar con detector de tensión","Desmontar el enchufe viejo","Conectar el nuevo enchufe","Restablecer corriente"],tip:"Siempre comprueba dos veces: corte real y ausencia de tensión."},
{title:"Reparar luminaria averiada",steps:["Apagar interruptor y diferencial","Usar detector sin contacto","Retirar luminaria defectuosa","Instalar luminaria nueva","Verificar funcionamiento"],tip:"Las luminarias pueden tener condensadores cargados. Espera antes de manipular."}
];
let idx=0,userOrders=[],currentOrder=[],dragIdx=-1,startY=0,startTime=0;
const scene=document.getElementById('scene'),cards=document.getElementById('cards'),cta=document.getElementById('cta'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function closeModal(){modal.classList.remove('active');render();}
modal.classList.add('active');

function render(){
if(idx>=challenges.length){showResults();return;}
const c=challenges[idx];
currentOrder=shuffle(c.steps);
subtitle.textContent=c.title;
prog.style.width=((idx)/challenges.length*100)+'%';
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
helper.textContent='Usa ↑↓ o arrastra para ordenar';
renderCards();
ensureFits();
}

function renderCards(){
cards.innerHTML=currentOrder.map((s,i)=>`<div class="card" data-idx="${i}" draggable="false">
<span class="card-num">${i+1}</span>
<span class="card-text">${s}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveUp(${i})">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveDown(${i})">↓</button>
</div>
</div>`).join('');
document.querySelectorAll('.card').forEach(c=>{
c.addEventListener('pointerdown',onDragStart);
c.addEventListener('pointermove',onDragMove);
c.addEventListener('pointerup',onDragEnd);
c.addEventListener('pointercancel',onDragEnd);
});
}

function moveUp(i){if(i===0)return;[currentOrder[i],currentOrder[i-1]]=[currentOrder[i-1],currentOrder[i]];animateSwap(i,i-1);renderCards();}
function moveDown(i){if(i===currentOrder.length-1)return;[currentOrder[i],currentOrder[i+1]]=[currentOrder[i+1],currentOrder[i]];animateSwap(i,i+1);renderCards();}

function animateSwap(a,b){
const cardEls=document.querySelectorAll('.card');
if(cardEls[a])cardEls[a].style.transform='scale(1.02)';
setTimeout(()=>{if(cardEls[a])cardEls[a].style.transform='';},150);
}

let dragEl=null,dragStartIdx=-1,dragCurrentY=0;
function onDragStart(e){
dragEl=e.currentTarget;
dragStartIdx=parseInt(dragEl.dataset.idx);
startY=e.clientY;
startTime=Date.now();
dragEl.classList.add('dragging');
dragEl.setPointerCapture(e.pointerId);
}
function onDragMove(e){
if(!dragEl)return;
dragCurrentY=e.clientY-startY;
dragEl.style.transform=`translateY(${dragCurrentY}px)`;
dragEl.style.zIndex='10';
}
function onDragEnd(e){
if(!dragEl)return;
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(dragCurrentY)/elapsed;
const cardH=dragEl.offsetHeight+8;
const moved=Math.round(dragCurrentY/cardH);
const passedDist=Math.abs(dragCurrentY)>cardH*0.4;
const passedVel=Math.abs(dragCurrentY)>20&&velocity>0.3;
if((passedDist||passedVel)&&moved!==0){
let newIdx=dragStartIdx+moved;
newIdx=Math.max(0,Math.min(currentOrder.length-1,newIdx));
if(newIdx!==dragStartIdx){
const item=currentOrder.splice(dragStartIdx,1)[0];
currentOrder.splice(newIdx,0,item);
}
}
dragEl.classList.remove('dragging');
dragEl.style.transform='';
dragEl.style.zIndex='';
dragEl=null;
renderCards();
}

cta.onclick=()=>{
const c=challenges[idx];
const correct=currentOrder.every((s,i)=>s===c.steps[i]);
userOrders.push({challenge:c,userOrder:[...currentOrder],correct});
idx++;
render();
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=userOrders.filter(o=>o.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${challenges.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${userOrders.map((o,i)=>`<div class="result-item ${o.correct?'correct':'incorrect'}">
<div class="result-question">${o.correct?'✅':'❌'} ${o.challenge.title}</div>
${o.correct?`<div class="result-answer">✓ Orden correcto</div>`:`<div class="result-answer"><strong>Tu orden:</strong><br>${o.userOrder.map((s,j)=>`${j+1}. ${s}`).join('<br>')}</div>
<div class="result-answer"><strong>✅ Orden correcto:</strong><br>${o.challenge.steps.map((s,j)=>`${j+1}. ${s}`).join('<br>')}</div>`}
<div class="result-explanation">💡 ${o.challenge.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

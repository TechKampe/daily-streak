
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Ordena como un pro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena como un pro</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Arrastra o usa las flechas ↑↓</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Taller Mecánico</div>
<div class="modal-body">Tu supervisor quiere comprobar si conoces los protocolos. Ordena cada secuencia de pasos correctamente.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Empezar!</button></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const challenges=[
{title:"Bloqueo/Etiquetado (LOTO)",steps:["Cortar suministro eléctrico","Verificar ausencia de tensión","Bloquear y etiquetar el equipo","Realizar el trabajo","Rearmar el sistema"],tip:"Nunca trabajes sin verificar ausencia de tensión con un detector homologado."},
{title:"Atención al cliente con avería",steps:["Saludar y escuchar al cliente","Diagnosticar la avería visualmente","Informar presupuesto y tiempo","Realizar la reparación","Entregar y explicar el trabajo"],tip:"Una buena comunicación genera confianza y fideliza clientes."},
{title:"Cierre del puesto de trabajo",steps:["Apagar equipos y herramientas","Limpiar el área de trabajo","Guardar herramientas en su lugar","Revisar que no queden residuos","Cerrar con llave y fichar salida"],tip:"Un puesto ordenado reduce accidentes y mejora la productividad."}
];
let idx=0,answers=[],draggedIdx=null,startY=0,currentY=0,isDragging=false,startTime=0;
const scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),cta=document.getElementById('cta'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let currentOrder=[];

function render(){
if(idx>=challenges.length){showResults();return;}
const c=challenges[idx];
currentOrder=shuffle(c.steps);
subtitle.textContent=c.title;
prog.style.width=((idx)/challenges.length*100)+'%';
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
helper.textContent="Arrastra o usa las flechas ↑↓";
renderCards();
ensureFits();
}

function renderCards(){
cardsEl.innerHTML=currentOrder.map((s,i)=>`<div class="card" data-idx="${i}">
<span class="card-num">${i+1}</span>
<span class="card-text">${s}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveUp(${i})">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveDown(${i})">↓</button>
</div>
</div>`).join('');
attachDragListeners();
}

function moveUp(i){if(i>0){[currentOrder[i],currentOrder[i-1]]=[currentOrder[i-1],currentOrder[i]];renderCards();animateSwap(i-1);}}
function moveDown(i){if(i<currentOrder.length-1){[currentOrder[i],currentOrder[i+1]]=[currentOrder[i+1],currentOrder[i]];renderCards();animateSwap(i+1);}}

function animateSwap(targetIdx){
const cards=cardsEl.querySelectorAll('.card');
if(cards[targetIdx]){cards[targetIdx].style.transform='scale(1.02)';setTimeout(()=>{cards[targetIdx].style.transform='';},150);}
}

function attachDragListeners(){
const cards=cardsEl.querySelectorAll('.card');
cards.forEach(card=>{
card.addEventListener('pointerdown',onDragStart);
card.addEventListener('pointermove',onDragMove);
card.addEventListener('pointerup',onDragEnd);
card.addEventListener('pointercancel',onDragEnd);
});
}

function onDragStart(e){
if(e.target.closest('.card-controls'))return;
isDragging=true;
draggedIdx=parseInt(e.currentTarget.dataset.idx);
startY=e.clientY;
currentY=0;
startTime=Date.now();
e.currentTarget.classList.add('dragging');
e.currentTarget.setPointerCapture(e.pointerId);
}

function onDragMove(e){
if(!isDragging||draggedIdx===null)return;
currentY=e.clientY-startY;
const card=cardsEl.querySelector(`[data-idx="${draggedIdx}"]`);
if(card)card.style.transform=`translateY(${currentY}px)`;
}

function onDragEnd(e){
if(!isDragging||draggedIdx===null)return;
isDragging=false;
const card=cardsEl.querySelector(`[data-idx="${draggedIdx}"]`);
if(card){card.classList.remove('dragging');card.style.transform='';}
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(currentY)/elapsed;
const cardHeight=card?card.offsetHeight+8:60;
const passedDistance=Math.abs(currentY)>cardHeight*0.5;
const passedVelocity=Math.abs(currentY)>20&&velocity>0.4;
if(currentY<0&&(passedDistance||passedVelocity)&&draggedIdx>0){
[currentOrder[draggedIdx],currentOrder[draggedIdx-1]]=[currentOrder[draggedIdx-1],currentOrder[draggedIdx]];
renderCards();animateSwap(draggedIdx-1);
}else if(currentY>0&&(passedDistance||passedVelocity)&&draggedIdx<currentOrder.length-1){
[currentOrder[draggedIdx],currentOrder[draggedIdx+1]]=[currentOrder[draggedIdx+1],currentOrder[draggedIdx]];
renderCards();animateSwap(draggedIdx+1);
}
draggedIdx=null;currentY=0;
}

cta.onclick=()=>{
const c=challenges[idx];
const correct=currentOrder.every((s,i)=>s===c.steps[i]);
answers.push({title:c.title,userOrder:[...currentOrder],correctOrder:[...c.steps],correct,tip:c.tip});
idx++;
render();
};

function closeModal(){modal.classList.remove('active');}
modal.classList.add('active');

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${answers.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.correct?'✅':'❌'} ${a.title}</div>
${a.correct?`<div class="result-answer">Tu orden fue correcto:</div>
<div class="result-explanation">${a.correctOrder.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>`
:`<div class="result-answer">Tu orden:</div>
<div class="result-explanation">${a.userOrder.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>
<div class="result-answer" style="margin-top:8px">✅ Orden correcto:</div>
<div class="result-explanation">${a.correctOrder.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>`}
<div class="result-answer" style="margin-top:8px">💡 Consejo:</div>
<div class="result-explanation">${a.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();render();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

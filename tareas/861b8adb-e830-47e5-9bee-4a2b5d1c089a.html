
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Herramienta o EPI? Clasifica rápido 🛠️ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Herramienta o EPI? 🛠️</div>
<div class="subtitle" id="subtitle">Clasifica cada ítem en su categoría</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress-bar" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main" id="main">
<div class="results-title" id="current-item" style="font-size:1.5rem;margin:1rem 0;text-align:center;"></div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca la categoría correcta para clasificar</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const items=[
{name:"Casco",category:"EPI",exp:"El casco protege la cabeza de impactos y caídas de objetos."},
{name:"Destornillador",category:"Herramienta",exp:"Sirve para apretar o aflojar tornillos."},
{name:"Guantes anticorte",category:"EPI",exp:"Protegen las manos de cortes y abrasiones."},
{name:"Nivel de burbuja",category:"Herramienta",exp:"Se usa para verificar que una superficie está nivelada."},
{name:"Gafas de seguridad",category:"EPI",exp:"Protegen los ojos de partículas y salpicaduras."},
{name:"Taladro",category:"Herramienta",exp:"Herramienta eléctrica para hacer agujeros."},
{name:"Chaleco reflectante",category:"EPI",exp:"Aumenta la visibilidad del trabajador."},
{name:"Llave inglesa",category:"Herramienta",exp:"Se usa para apretar o aflojar tuercas y tornillos."},
{name:"Mascarilla FFP2",category:"EPI",exp:"Protege las vías respiratorias de polvo y partículas."},
{name:"Flexómetro",category:"Herramienta",exp:"Cinta métrica para medir distancias."}
];
const categories=["Herramienta","EPI"];
let idx=0,answers=[];
const scene=document.getElementById('scene'),main=document.getElementById('main'),currentItem=document.getElementById('current-item'),categoriesDiv=document.getElementById('categories'),progressBar=document.getElementById('progress-bar'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),subtitle=document.getElementById('subtitle');

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
currentItem.textContent=item.name;
progressBar.style.width=(idx/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
categoriesDiv.innerHTML=categories.map(c=>`<button class="btn-option" onclick="classify('${c}')">${c}</button>`).join('');
ensureFits();
}

function classify(selected){
const item=items[idx];
const correct=selected===item.category;
answers.push({name:item.name,selected,correct,correctCat:item.category,exp:item.exp});
const btns=categoriesDiv.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent===item.category)b.classList.add('correct');
else if(b.textContent===selected&&!correct)b.classList.add('incorrect');
});
currentItem.classList.add(correct?'correct':'incorrect');
setTimeout(()=>{
currentItem.classList.remove('correct','incorrect');
idx++;
render();
},600);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`
<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Clasificación completada!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Ítems bien clasificados</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.correctCat:'✗ Pusiste: '+a.selected+' → Correcto: '+a.correctCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">Antes de empezar cualquier tarea, separa mentalmente lo que te protege (EPI) de lo que usas para trabajar (herramientas). Así nunca olvidarás ponerte la protección adecuada.</div>
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{ensureFits();render();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

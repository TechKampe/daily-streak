
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔍 Caza el Fallo: Obra en Marcha - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔍 Caza el Fallo</div>
<div class="subtitle" id="sceneText">Cargando escena...</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca el elemento con el error</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%203_low.png" alt="" loading="lazy">
<script>
const scenes=[
{text:"Un compañero sube al andamio con herramientas sueltas en la mano.",items:["Casco puesto","Arnés enganchado","Herramientas sueltas","Botas de seguridad"],error:2,exp:"Las herramientas deben subirse en cinturón o cubo. Sueltas pueden caer y causar accidentes graves."},
{text:"Mezclan mortero: 1 parte cemento, 1 parte arena y mucha agua.",items:["Cemento Portland","Proporción 1:1 cemento-arena","Agua en exceso","Cubo limpio"],error:2,exp:"El exceso de agua debilita el mortero. La proporción correcta es 1:3 o 1:4 (cemento:arena) con agua justa."},
{text:"Zona de excavación abierta junto al paso de peatones sin señalizar.",items:["Excavación correcta","Profundidad adecuada","Sin señalización","Tierra apilada lejos"],error:2,exp:"Toda excavación debe señalizarse y vallarse. Es obligatorio por PRL para evitar caídas de terceros."},
{text:"Operario levanta sacos de 25kg doblando la espalda, piernas rectas.",items:["Guantes de trabajo","Saco de 25kg estándar","Postura incorrecta","Calzado cerrado"],error:2,exp:"Se debe levantar peso flexionando rodillas, espalda recta. Evita lesiones lumbares graves."},
{text:"Cortan ladrillo con radial sin gafas, solo con guantes y mascarilla.",items:["Mascarilla antipolvo","Guantes anticorte","Sin gafas protectoras","Radial con disco"],error:2,exp:"Las gafas son EPI obligatorio al cortar. Las partículas pueden causar lesiones oculares irreversibles."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),sceneText=document.getElementById('sceneText'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper');

function render(){
if(idx>=scenes.length){showResults();return}
const s=scenes[idx];
sceneText.textContent=s.text;
prog.style.width=(idx/scenes.length*100)+'%';
counter.textContent=(idx+1)+'/'+scenes.length;
helper.textContent='Toca el elemento con el error';
opts.innerHTML=s.items.map((item,i)=>`<button class="btn-option" onclick="selectItem(${i})">${item}</button>`).join('');
ensureFits();
}

function selectItem(i){
const s=scenes[idx];
const correct=i===s.error;
answers.push({scene:s.text,selected:s.items[i],correctItem:s.items[s.error],correct,exp:s.exp});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add(correct?'correct':'incorrect');if(j===s.error&&!correct)b.classList.add('correct');});
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const aciertos=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔍 Inspección completada</div>
<div class="results-score">${aciertos}/${scenes.length}</div>
<div class="results-subtitle">Errores detectados correctamente</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">Escena ${i+1}</div>
<div class="result-answer">${a.correct?'✓ '+a.selected:'✗ Elegiste: '+a.selected}</div>
${!a.correct?`<div class="result-answer">→ Correcto: ${a.correctItem}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">En obra, para antes de actuar y observa. Un ojo crítico entrenado previene accidentes y mejora la calidad del trabajo. La seguridad es responsabilidad de todos.</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🗂️ ¿Dónde va esto? Clasifica como un pro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🗂️ ¿Dónde va esto?</div>
<div class="subtitle" id="subtitle">Clasifica cada ítem en su categoría</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<div class="item-display" id="itemDisplay"></div>
<div class="options" id="categories"></div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca la categoría correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">📦 Organiza el almacén</div>
<div class="modal-body">Es tu primera semana como ayudante. El encargado te pide clasificar el material antes de salir a obra. ¿EPIs, Herramientas o Materiales?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>
<script>
const items=[
{name:"Guantes dieléctricos",cat:"EPIs",exp:"Protegen de descargas eléctricas. Son equipo de protección personal obligatorio."},
{name:"Destornillador buscapolos",cat:"Herramientas",exp:"Sirve para detectar tensión. Es una herramienta de diagnóstico."},
{name:"Cable de 2,5mm²",cat:"Materiales",exp:"Es un consumible que se instala en la obra. Material de instalación."},
{name:"Casco de seguridad",cat:"EPIs",exp:"Protege la cabeza de golpes e impactos. Equipo de protección obligatorio."},
{name:"Alicates de corte",cat:"Herramientas",exp:"Sirven para cortar cables. Herramienta reutilizable del electricista."},
{name:"Cinta aislante",cat:"Materiales",exp:"Se consume en cada instalación para aislar empalmes. Es material fungible."},
{name:"Gafas de seguridad",cat:"EPIs",exp:"Protegen los ojos de partículas y chispas. Equipo de protección personal."},
{name:"Tubo corrugado",cat:"Materiales",exp:"Canalización donde van los cables. Material que queda instalado en obra."},
{name:"Multímetro",cat:"Herramientas",exp:"Instrumento de medición. Herramienta que el electricista lleva siempre."},
{name:"Botas aislantes",cat:"EPIs",exp:"Protegen de descargas por el suelo. Equipo de protección para trabajos eléctricos."}
];
const categories=["EPIs","Herramientas","Materiales"];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),content=document.getElementById('content'),itemDisplay=document.getElementById('itemDisplay'),catsEl=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
itemDisplay.innerHTML=`<div class="item-name">${item.name}</div>`;
catsEl.innerHTML=categories.map(c=>`<button class="btn-option" onclick="selectCategory('${c}')">${c}</button>`).join('');
helper.textContent='¿A qué categoría pertenece?';
ensureFits();
}

function selectCategory(cat){
const item=items[idx];
const correct=cat===item.cat;
if(correct)score++;
answers.push({name:item.name,userCat:cat,correctCat:item.cat,correct,exp:item.exp});
const btns=catsEl.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent===item.cat)b.classList.add('correct');
if(b.textContent===cat&&!correct)b.classList.add('incorrect');
});
itemDisplay.querySelector('.item-name').classList.add(correct?'drop-correct':'drop-incorrect');
helper.textContent=correct?'✓ ¡Correcto!':'✗ Era: '+item.cat;
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🗂️ ¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.correctCat:'✗ Pusiste: '+a.userCat+' → Era: '+a.correctCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="results-tip">
<div class="tip-title">💡 Consejo profesional</div>
<div class="tip-text">Antes de cada jornada, repasa mentalmente: lo que me protege (EPIs), lo que uso (Herramientas) y lo que instalo (Materiales). Ganarás tiempo y seguridad.</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

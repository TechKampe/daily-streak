
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Herramienta o EPI? 🛠️ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Herramienta o EPI? 🛠️</div>
<div class="subtitle" id="subtitle">Organiza el material en los estantes</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="item-display" id="itemDisplay"></div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca la categoría correcta</div>
</div>
</div>
<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">📦 Primer día en el almacén</div>
<div class="modal-body">El encargado te pide organizar el material nuevo. Clasifica cada elemento como Herramienta o EPI.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const items=[
{name:"Destornillador aislado",cat:"Herramienta",exp:"Herramienta manual para apretar/aflojar tornillos, con mango aislante."},
{name:"Casco de seguridad",cat:"EPI",exp:"Protege la cabeza de impactos y caídas de objetos."},
{name:"Guantes dieléctricos",cat:"EPI",exp:"EPI que aísla las manos de descargas eléctricas."},
{name:"Polímetro",cat:"Herramienta",exp:"Instrumento para medir tensión, corriente y resistencia."},
{name:"Gafas de seguridad",cat:"EPI",exp:"Protegen los ojos de partículas y proyecciones."},
{name:"Alicates pelacables",cat:"Herramienta",exp:"Herramienta para cortar y pelar cables eléctricos."},
{name:"Arnés anticaídas",cat:"EPI",exp:"EPI que previene caídas en trabajos en altura."},
{name:"Buscapolos",cat:"Herramienta",exp:"Herramienta para detectar presencia de tensión."},
{name:"Botas dieléctricas",cat:"EPI",exp:"Calzado que aísla de corrientes eléctricas."},
{name:"Cinta aislante",cat:"Herramienta",exp:"Material para aislar empalmes y conexiones."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),itemDisplay=document.getElementById('itemDisplay'),cats=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
itemDisplay.innerHTML=`<div class="item-name">${item.name}</div>`;
cats.innerHTML=`<button class="btn-option" onclick="classify('Herramienta')">🔧 Herramienta</button><button class="btn-option" onclick="classify('EPI')">🦺 EPI</button>`;
helper.textContent='Toca la categoría correcta';
ensureFits();
}

function classify(cat){
const item=items[idx];
const correct=cat===item.cat;
const btns=cats.querySelectorAll('.btn-option');
btns.forEach(b=>{
if(b.textContent.includes(cat)){
b.classList.add(correct?'correct':'incorrect');
b.classList.add('selected');
}
if(b.textContent.includes(item.cat)&&!correct){
b.classList.add('correct');
}
b.disabled=true;
});
answers.push({name:item.name,user:cat,correct:item.cat,ok:correct,exp:item.exp});
helper.textContent=correct?'✓ ¡Correcto!':'✗ Era '+item.cat;
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.ok).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.ok?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.ok?'✓ '+a.correct:'✗ Dijiste '+a.user+' → Era '+a.correct}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Antes de empezar cualquier trabajo, separa mentalmente qué te protege y qué usas para trabajar; así nunca olvidarás tu equipo de seguridad.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

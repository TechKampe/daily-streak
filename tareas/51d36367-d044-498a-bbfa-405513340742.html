
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Dónde va esto? 🔧 Clasifica como un pro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Dónde va esto? 🔧</div>
<div class="subtitle" id="itemDisplay">Cargando...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper">Toca la categoría correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Organiza el almacén</div>
<div class="modal-body">Es tu primer día en un taller de climatización. Clasifica cada elemento en su categoría: Herramientas, EPIs o Documentación.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const items=[
{name:"Llave inglesa",cat:"Herramientas",exp:"Es una herramienta manual para apretar o aflojar tuercas."},
{name:"Casco de seguridad",cat:"EPIs",exp:"Protege la cabeza de impactos y caídas de objetos."},
{name:"Albarán de entrega",cat:"Documentación",exp:"Documento que acredita la recepción de materiales."},
{name:"Multímetro",cat:"Herramientas",exp:"Instrumento de medición eléctrica esencial en el taller."},
{name:"Gafas protectoras",cat:"EPIs",exp:"Protegen los ojos de partículas y salpicaduras."},
{name:"Manual de instalación",cat:"Documentación",exp:"Guía técnica con instrucciones del fabricante."},
{name:"Taladro",cat:"Herramientas",exp:"Herramienta eléctrica para perforar materiales."},
{name:"Mascarilla FFP2",cat:"EPIs",exp:"Protege las vías respiratorias de partículas y polvo."},
{name:"Factura cliente",cat:"Documentación",exp:"Documento fiscal que registra la transacción comercial."},
{name:"Nivel láser",cat:"Herramientas",exp:"Herramienta de precisión para nivelar instalaciones."}
];
const categories=["Herramientas","EPIs","Documentación"];
let idx=0,answers=[];
const scene=document.getElementById('scene'),catEl=document.getElementById('categories'),itemEl=document.getElementById('itemDisplay'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
itemEl.textContent=item.name;
prog.style.width=(idx/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
catEl.innerHTML=categories.map(c=>`<button class="btn-option" onclick="selectCat('${c}')">${c}</button>`).join('');
ensureFits();
}

function selectCat(cat){
const item=items[idx];
const correct=cat===item.cat;
const btns=catEl.querySelectorAll('.btn-option');
btns.forEach(b=>{
if(b.textContent===cat)b.classList.add(correct?'correct':'incorrect');
if(b.textContent===item.cat&&!correct)b.classList.add('correct');
b.disabled=true;
});
answers.push({name:item.name,user:cat,correct,rightCat:item.cat,exp:item.exp});
setTimeout(()=>{idx++;render();},600);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.rightCat:'✗ Dijiste: '+a.user+' → Correcto: '+a.rightCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">En obra, organiza mentalmente: las herramientas van en el cinturón o caja, los EPIs siempre puestos antes de empezar, y la documentación en una carpeta accesible. Así ganas eficiencia y seguridad.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

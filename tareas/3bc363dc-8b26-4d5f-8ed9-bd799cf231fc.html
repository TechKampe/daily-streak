
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual 🔧</div>
<div class="subtitle" id="instruction">Selecciona la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div id="clozeArea">
<p id="sentenceText" style="font-size:1.1rem;text-align:center;margin:0 0 1.5rem 0;line-height:1.5"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper">Tu primer día: demuestra que dominas el vocabulario</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">📋 Manual del Ayudante</div>
<div class="modal-body">Es tu primer día y el supervisor quiere comprobar que conoces la terminología básica. Completa cada frase con la palabra correcta.</div>
<div class="modal-actions"><button class="cta" onclick="startGame()">Comenzar</button></div>
</div>
</div>
<script>
const data=[
{sentence:"Para medir la tensión de un enchufe, uso el ___.",blank:"___",opts:["Multímetro","Buscapolos","Nivel láser"],ans:0,exp:"El multímetro mide tensión, corriente y resistencia. El buscapolos solo detecta presencia de fase y el nivel láser es para alineación."},
{sentence:"Antes de trabajar en el cuadro eléctrico, debo ___ la corriente.",blank:"___",opts:["Cortar","Aumentar","Medir"],ans:0,exp:"Siempre se corta la corriente antes de manipular el cuadro para evitar electrocución. Medir es posterior y aumentar no tiene sentido."},
{sentence:"Para sellar roscas en tuberías de agua uso cinta de ___.",blank:"___",opts:["Teflón","Cobre","PVC"],ans:0,exp:"La cinta de teflón sella roscas evitando fugas. El cobre y PVC son materiales de tubería, no selladores."},
{sentence:"Al soldar tuberías de cobre necesito un ___ de gas.",blank:"___",opts:["Soplete","Destornillador","Alicate"],ans:0,exp:"El soplete aplica calor para fundir el estaño. Destornillador y alicate son herramientas de montaje, no de soldadura."},
{sentence:"Para protegerme las manos de descargas uso guantes ___.",blank:"___",opts:["Aislantes","De látex","De cuero"],ans:0,exp:"Los guantes aislantes están homologados para riesgo eléctrico. Los de látex o cuero no protegen de descargas."},
{sentence:"Si un radiador no calienta bien, lo primero es ___ para sacar el aire.",blank:"___",opts:["Purgarlo","Pintarlo","Desmontarlo"],ans:0,exp:"Purgar elimina bolsas de aire que impiden la circulación de agua caliente. Pintar o desmontar no resuelven el problema."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),sentenceEl=document.getElementById('sentenceText'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
prog.style.width=((idx)/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
const parts=d.sentence.split(d.blank);
sentenceEl.innerHTML=parts[0]+'<span style="border-bottom:2px dashed var(--accent);padding:0 0.5rem;color:var(--accent);font-weight:700">______</span>'+parts[1];
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" onclick="selectOpt(${i})">${o}</button>`).join('');
ensureFits();
}

function selectOpt(i){
const d=data[idx];
const correct=i===d.ans;
if(correct)score++;
answers.push({sentence:d.sentence.replace(d.blank,'<strong>'+d.opts[d.ans]+'</strong>'),user:d.opts[i],correctAns:d.opts[d.ans],correct,exp:d.exp});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{b.disabled=true;if(j===d.ans)b.classList.add('correct');else if(j===i&&!correct)b.classList.add('incorrect');});
setTimeout(()=>{idx++;render();},600);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">📋 Manual Completado</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Elegiste: '+a.user+' → Correcta: '+a.correctAns}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface2);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo Final</div>
<div class="result-explanation">Usar la terminología correcta evita malentendidos con el equipo y errores costosos en obra. Repasa estos términos hasta que te salgan de forma natural.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){const m=document.querySelector('.main,.content,.board')||scene;document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

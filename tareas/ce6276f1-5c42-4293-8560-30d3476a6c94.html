
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu primera satisfacción de cliente 🗣️ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.chat-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.chat-bubble.npc{background:#f0f0f0;color:#333;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.user{background:#1a1a2e;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble .sender{font-weight:700;font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.chat-bubble .sender img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.chat-bubble.mentor{background:#e8f5e9;border-left:3px solid #4caf50}
.chat-options{padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:#fff;border-top:1px solid #eee}
.chat-options button{width:100%;padding:12px 16px;border:2px solid #1a1a2e;border-radius:12px;background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all 0.2s}
.chat-options button:active{background:#1a1a2e;color:#fff}
.chat-options button:disabled{opacity:0.5;cursor:not-allowed}
.intro-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;height:100%}
.intro-screen h2{font-size:20px;margin-bottom:12px}
.intro-screen p{font-size:14px;color:#666;margin-bottom:24px;max-width:280px}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Tu primera satisfacción de cliente 🗣️</div>
<div class="subtitle" id="subtitle">Aprende a comunicarte con tus clientes</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Intro</span>
</div>
</div>
<div id="content"></div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const AVATARS={
mentor:'https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png',
client:'https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png'
};
const NAMES={mentor:'Carlos (Mentor)',client:'Sr. García (Cliente)'};

const turns=[
{
messages:[
{from:'client',text:'Oye, antes de que te vayas... ¿me puedes explicar por qué el presupuesto ha subido respecto a lo que me dijiste al principio?'}
],
mentorTip:'Recuerda: transparencia y calma. Explica los imprevistos sin ponerte a la defensiva.',
options:[
{text:'Tuve que cambiar más piezas de las previstas. Le explico el detalle si quiere.',correct:true},
{text:'Es que estas cosas pasan, los materiales están muy caros.',correct:'partial'},
{text:'Bueno, es lo que hay. El fontanero anterior lo dejó fatal.',correct:false}
]
},
{
messages:[
{from:'client',text:'Vale, entiendo. Pero, ¿qué es exactamente lo que has reparado? Es que no entiendo mucho de esto...'}
],
mentorTip:'Usa palabras sencillas. El cliente no tiene por qué saber de sifones o juntas tóricas.',
options:[
{text:'He cambiado la pieza que conecta el tubo con el desagüe, que estaba rota y causaba la fuga.',correct:true},
{text:'He sustituido el sifón y la junta tórica del manguito de PVC.',correct:false},
{text:'Lo de abajo del fregadero, eso que goteaba.',correct:'partial'}
]
},
{
messages:[
{from:'client',text:'Por cierto, ¿por qué has tardado casi dos horas? Pensé que sería más rápido.'}
],
mentorTip:'Justifica tu tiempo con el trabajo bien hecho, no con excusas.',
options:[
{text:'He preferido revisar todo el sistema para asegurarme de que no haya más fugas ocultas.',correct:true},
{text:'Es que el acceso era complicado y tuve que desmontar varias cosas.',correct:'partial'},
{text:'Dos horas es lo normal, hay fontaneros que tardan más.',correct:false}
]
},
{
messages:[
{from:'client',text:'Una cosa más... he visto que ha quedado algo de suciedad en el suelo del baño.'}
],
mentorTip:'Acepta la crítica con profesionalidad. Un detalle así puede marcar la diferencia.',
options:[
{text:'Tiene razón, lo limpio ahora mismo. Disculpe el descuido.',correct:true},
{text:'Ah, sí, es que se me ha debido escapar. Bueno, tampoco es mucho.',correct:'partial'},
{text:'Eso ya estaba antes, yo no he tocado esa zona.',correct:false}
]
},
{
messages:[
{from:'client',text:'Bueno, pues muchas gracias. Si surge algo, ¿puedo contactarte?'}
],
mentorTip:'La despedida es tu oportunidad de fidelizar. Deja siempre una vía de contacto.',
options:[
{text:'Claro, le dejo mi tarjeta. Si tiene cualquier problema en los próximos días, me llama sin compromiso.',correct:true},
{text:'Sí, búscame en internet, ahí está mi teléfono.',correct:'partial'},
{text:'Sí, claro. Hasta luego.',correct:false}
]
}
];

const feedback={
correct:{
0:'Explicar los imprevistos con detalle genera confianza y muestra profesionalidad.',
1:'Usar lenguaje sencillo ayuda al cliente a entender el valor de tu trabajo.',
2:'Justificar el tiempo con el trabajo bien hecho refuerza tu imagen profesional.',
3:'Reconocer un error y solucionarlo demuestra responsabilidad y respeto.',
4:'Dejar tarjeta y ofrecer garantía verbal fideliza clientes para el futuro.'
},
partial:{
0:'Mencionar los precios no explica el motivo del cambio. Mejor detalla qué pasó.',
1:'Es demasiado vago. El cliente sigue sin entender qué has arreglado.',
2:'Justificar con dificultades suena a excusa. Mejor enfoca en el beneficio.',
3:'Minimizar la queja puede molestar. Mejor asumir y solucionar rápido.',
4:'Dificultar el contacto reduce las posibilidades de que te vuelvan a llamar.'
},
incorrect:{
0:'Culpar a otros suena a excusa y genera desconfianza.',
1:'El tecnicismo confunde y aleja al cliente. Simplifica siempre.',
2:'Compararte con otros no justifica tu tiempo. Enfócate en tu valor.',
3:'Negar la evidencia rompe la confianza inmediatamente.',
4:'Una despedida fría pierde oportunidades de trabajo futuro.'
}
};

let currentTurn=0,chatHistory=[],answers=[];
const content=document.getElementById('content'),progress=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle');

function renderIntro(){
content.innerHTML=`<div class="intro-screen">
<h2>🔧 Situación</h2>
<p>Acabas de terminar una reparación de fontanería. El cliente tiene algunas dudas sobre el trabajo y el presupuesto.</p>
<button class="cta" onclick="startChat()">Comenzar conversación</button>
</div>`;
ensureFits();
}

function startChat(){
chatHistory=[{from:'mentor',text:'¡Ánimo! Recuerda: escucha, explica con claridad y mantén la calma.'}];
renderTurn();
}

function renderTurn(){
if(currentTurn>=turns.length){showResults();return}
const t=turns[currentTurn];
t.messages.forEach(m=>chatHistory.push(m));
progress.style.width=((currentTurn+1)/turns.length*100)+'%';
counter.textContent=(currentTurn+1)+'/'+turns.length;
subtitle.textContent='Elige tu respuesta';
content.innerHTML=`<div class="chat-container">
<div class="chat-messages" id="chatArea">${renderMessages()}</div>
<div class="chat-options" id="optionsArea">
<div class="chat-bubble mentor"><div class="sender"><img src="${AVATARS.mentor}" alt="">${NAMES.mentor}</div>${t.mentorTip}</div>
${t.options.map((o,i)=>`<button onclick="selectOption(${i})">${o.text}</button>`).join('')}
</div>
</div>`;
const chatArea=document.getElementById('chatArea');
chatArea.scrollTop=chatArea.scrollHeight;
ensureFits();
}

function renderMessages(){
return chatHistory.map(m=>{
if(m.from==='user')return`<div class="chat-bubble user">${m.text}</div>`;
if(m.from==='mentor')return`<div class="chat-bubble mentor"><div class="sender"><img src="${AVATARS.mentor}" alt="">${NAMES.mentor}</div>${m.text}</div>`;
return`<div class="chat-bubble npc"><div class="sender"><img src="${AVATARS[m.from]}" alt="">${NAMES[m.from]}</div>${m.text}</div>`;
}).join('');
}

function selectOption(idx){
const t=turns[currentTurn],opt=t.options[idx];
chatHistory.push({from:'user',text:opt.text});
let reaction='';
if(opt.correct===true){reaction='Perfecto, buena respuesta.';answers.push({turn:currentTurn,result:'correct',text:opt.text})}
else if(opt.correct==='partial'){reaction='No está mal, pero podrías mejorar.';answers.push({turn:currentTurn,result:'partial',text:opt.text})}
else{reaction='Cuidado, eso puede generar desconfianza.';answers.push({turn:currentTurn,result:'incorrect',text:opt.text})}
chatHistory.push({from:'mentor',text:reaction});
currentTurn++;
setTimeout(renderTurn,600);
}

function showResults(){
setTimeout(()=>{
document.getElementById('scene').classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
document.getElementById('scene').classList.replace('gameplay','results');
const score=answers.filter(a=>a.result==='correct').length;
document.getElementById('scene').innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Conversación completada!</div>
<div class="results-score">${score}/${turns.length}</div>
<div class="results-subtitle">Respuestas óptimas</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.result==='correct'?'correct':'incorrect'}">
<div class="result-question">Turno ${i+1}</div>
<div class="result-answer">${a.result==='correct'?'✓ Óptima':a.result==='partial'?'◐ Mejorable':'✗ Inadecuada'}: ${a.text.substring(0,40)}...</div>
<div class="result-explanation">${feedback[a.result][i]}</div>
</div>`).join('')}
<div class="result-item" style="background:#fffde7;border-left:3px solid #ffc107">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">La fidelización en oficios técnicos se basa en confianza: explica tu trabajo con claridad, admite errores y deja siempre una vía de contacto. Un cliente satisfecho te recomendará a otros.</div>
</div>
</div>
<div class="footer" style="position:sticky;bottom:0;background:#fff;padding:16px;border-top:1px solid #eee">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}))}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*')}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.')}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.chat-container')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.chat-container')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{renderIntro();ensureFits()});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

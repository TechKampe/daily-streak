
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: herramientas de fontanería - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="task">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Selecciona la herramienta correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const tasks=[
{task:"Cortar un tubo de cobre de 22mm",opts:["Cortatubos","Sierra de arco","Alicates"],ans:0,icons:["","",""],explain:"El cortatubos hace cortes limpios y perpendiculares en cobre. La sierra deja rebabas y los alicates aplastan el tubo.",tip:"Usa cortatubos para cobre/plástico; sierra solo si no cabe la herramienta."},
{task:"Apretar una tuerca de conexión flexible",opts:["Llave inglesa","Llave fija","Destornillador"],ans:0,icons:["🔧","",""],explain:"La llave inglesa se ajusta a cualquier medida. La fija necesita tamaño exacto y el destornillador no sirve para tuercas.",tip:"Llave inglesa para tuercas variadas; fija cuando conoces la medida exacta."},
{task:"Desatascar un sifón de lavabo",opts:["Desatascador de ventosa","Sonda flexible","Martillo"],ans:0,icons:["🪠","","🔨"],explain:"La ventosa crea presión para empujar el tapón. La sonda es para obstrucciones profundas y el martillo dañaría la tubería.",tip:"Empieza con ventosa; usa sonda solo si la obstrucción está lejos del sifón."},
{task:"Sellar la rosca de un racor metálico",opts:["Cinta de teflón","Silicona","Masilla de fontanero"],ans:0,icons:["","",""],explain:"El teflón sella roscas metálicas sin endurecerse. La silicona es para juntas fijas y la masilla para emergencias.",tip:"Teflón en roscas desmontables; silicona en uniones permanentes."},
{task:"Comprobar que un tubo está horizontal",opts:["Nivel de burbuja","Metro","Escuadra"],ans:0,icons:["","📏","📐"],explain:"El nivel indica horizontalidad con la burbuja centrada. El metro mide longitud y la escuadra ángulos de 90°.",tip:"Nivel para pendientes; metro para distancias; escuadra para esquinas."},
{task:"Soldar un codo de cobre con estaño",opts:["Soplete de gas","Pistola de calor","Mechero"],ans:0,icons:["🔥","",""],explain:"El soplete alcanza temperatura para fundir estaño sobre cobre. La pistola no llega y el mechero es inestable y débil.",tip:"Soplete para soldadura de cobre; pistola solo para termorretráctiles."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),optsEl=document.getElementById('options'),taskEl=document.getElementById('task'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=tasks.length){showResults();return}
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=(idx/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
optsEl.innerHTML=t.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${t.icons[i]?t.icons[i]+' ':''}${o}</button>`).join('');
ensureFits();
}

function select(i){
const t=tasks[idx];
const correct=i===t.ans;
if(correct)score++;
answers.push({task:t.task,user:t.opts[i],correctTool:t.opts[t.ans],correct,explain:t.explain,tip:t.tip});
const btns=optsEl.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
if(j===i)b.classList.add(correct?'correct':'incorrect');
b.disabled=true;
});
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔧 ¡Prueba completada!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Herramientas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Elegiste: '+a.user+' → Correcta: '+a.correctTool}</div>
<div class="result-explanation">${a.explain}</div>
<div class="result-explanation"><strong>Consejo:</strong> ${a.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

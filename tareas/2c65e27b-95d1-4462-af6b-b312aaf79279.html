
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o realidad? ⚡ Seguridad eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o realidad? ⚡</div>
<div class="subtitle">Seguridad eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div id="statement-area"></div>
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">¿Es verdadero o falso? Toca para responder</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const statements=[
{text:"La madera siempre aísla la electricidad",answer:false,exp:"Falso. La madera húmeda conduce electricidad. Solo la madera completamente seca tiene propiedades aislantes limitadas."},
{text:"12 voltios no pueden producir ningún daño",answer:false,exp:"Falso. Aunque 12V es baja tensión, en condiciones de humedad o con piel mojada puede causar daños, especialmente en corriente continua de alta intensidad."},
{text:"Antes de trabajar en un circuito hay que desconectar y verificar ausencia de tensión",answer:true,exp:"Verdadero. Es el procedimiento básico de seguridad: cortar suministro, bloquear, verificar con detector y señalizar."},
{text:"Los guantes de látex sirven como protección eléctrica",answer:false,exp:"Falso. Los guantes de látex médicos NO son aislantes. Solo los guantes dieléctricos homologados protegen contra contactos eléctricos."},
{text:"Un diferencial protege contra todos los contactos eléctricos",answer:false,exp:"Falso. El diferencial protege contra contactos indirectos, pero NO contra contactos directos entre fases o fase-neutro."},
{text:"Trabajar en tensión está prohibido salvo casos excepcionales y con formación específica",answer:true,exp:"Verdadero. El RD 614/2001 establece que los trabajos en tensión requieren autorización especial y formación certificada."}
];
let idx=0,score=0,answers=[],processing=false;
const scene=document.getElementById('scene'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),stArea=document.getElementById('statement-area');

function render(){
if(idx>=statements.length){showResults();return}
processing=false;
const s=statements[idx];
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
stArea.innerHTML=`<div class="result-question" style="font-size:1.15rem;text-align:center;padding:1.5rem 0.5rem;line-height:1.5">${s.text}</div>`;
opts.innerHTML=`<button class="btn-option" id="btn-true" onclick="choose(true)">✓ Verdadero</button><button class="btn-option" id="btn-false" onclick="choose(false)">✗ Falso</button>`;
ensureFits();
}

function choose(val){
if(processing)return;
processing=true;
const s=statements[idx];
const correct=val===s.answer;
if(correct)score++;
answers.push({text:s.text,userAnswer:val,correctAnswer:s.answer,correct,exp:s.exp});
const btnT=document.getElementById('btn-true'),btnF=document.getElementById('btn-false');
if(val===true){
btnT.classList.add(correct?'correct':'incorrect');
}else{
btnF.classList.add(correct?'correct':'incorrect');
}
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Reto completado!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">${a.correct?'✓ Acertaste':'✗ Fallaste'} — Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} | Correcta: ${a.correctAnswer?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item" style="background:var(--accent);margin-top:1rem">
<div class="result-question" style="color:#000">💡 Consejo práctico</div>
<div class="result-explanation" style="color:#000">Siempre usa un detector de tensión homologado antes de tocar cualquier conductor. Nunca confíes solo en que "el interruptor está bajado".</div>
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

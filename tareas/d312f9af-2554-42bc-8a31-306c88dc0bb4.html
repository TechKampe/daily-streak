
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Hueco: Herramientas del Electricista ⚡ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Hueco ⚡</div>
<div class="subtitle">Selecciona la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div id="clozeArea">
<p id="sentenceText"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper">Primer día en el almacén. ¡Demuestra tu vocabulario!</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const data=[
{sentence:"Para medir tensión en un enchufe, uso el ___.",opts:["multímetro","buscapolos"],ans:0,exp:"El multímetro mide tensión con precisión. El buscapolos solo detecta presencia de fase."},
{sentence:"Antes de conectar cables, debo ___ los extremos.",opts:["pelar","empalmar"],ans:0,exp:"Pelar retira el aislante. Empalmar es unir cables ya pelados."},
{sentence:"Para unir dos cables uso una ___.",opts:["regleta","canaleta"],ans:0,exp:"La regleta conecta cables eléctricamente. La canaleta es un conducto decorativo."},
{sentence:"El cable va protegido dentro del ___.",opts:["tubo corrugado","pelacables"],ans:0,exp:"El tubo corrugado protege el cableado. El pelacables es una herramienta."},
{sentence:"Para quitar aislante uso el ___.",opts:["pelacables","destornillador"],ans:0,exp:"El pelacables retira aislante sin dañar el cobre. El destornillador no sirve para eso."},
{sentence:"Para detectar fase sin medir, uso el ___.",opts:["buscapolos","multímetro"],ans:0,exp:"El buscapolos indica presencia de fase visualmente. El multímetro mide valores exactos."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),sentenceEl=document.getElementById('sentenceText'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
prog.style.width=(idx/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
sentenceEl.innerHTML=d.sentence.replace('___','<u class="gap">______</u>');
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${o}</button>`).join('');
ensureFits();
}

function select(i){
const d=data[idx];
const correct=i===d.ans;
if(correct)score++;
answers.push({sentence:d.sentence,correct,user:d.opts[i],correctAns:d.opts[d.ans],exp:d.exp});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{b.disabled=true;b.classList.add(j===d.ans?'correct':(j===i?'incorrect':''));});
sentenceEl.innerHTML=d.sentence.replace('___',`<u class="gap" style="text-decoration:none;background:#e8f5e9;padding:2px 6px;border-radius:4px">${d.opts[d.ans]}</u>`);
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Vocabulario completado!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.correctAns+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto':'✗ Tu respuesta: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:#fff3e0;border-left:4px solid #ff9800">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Usar los términos correctos evita confusiones en obra y mejora la comunicación con el equipo. ¡Sigue practicando!</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

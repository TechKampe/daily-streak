
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: herramientas del taller - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="task">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Selecciona la herramienta adecuada</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const tasks=[
{task:"Apretar un tornillo de cabeza Phillips en una tapa eléctrica",opts:["Destornillador Phillips","Llave inglesa","Alicates"],ans:0,exp:"El destornillador Phillips encaja perfectamente en la cabeza del tornillo. La llave inglesa es para tuercas y los alicates dañarían la cabeza.",tip:"Usa destornillador Phillips para tornillos en cruz, plano para ranura simple."},
{task:"Cortar un cable eléctrico de 2.5mm²",opts:["Sierra de mano","Tijeras de electricista","Cúter"],ans:1,exp:"Las tijeras de electricista cortan cables con precisión y seguridad. La sierra es para materiales duros y el cúter puede resbalar.",tip:"Las tijeras de electricista también pelan cables. Invierte en unas buenas."},
{task:"Medir la longitud de una tubería de 3 metros",opts:["Flexómetro","Nivel de burbuja","Escuadra"],ans:0,exp:"El flexómetro mide longitudes. El nivel comprueba horizontalidad y la escuadra mide ángulos de 90°.",tip:"Usa flexómetros de 5m para trabajos generales de taller."},
{task:"Comprobar si una estantería está horizontal",opts:["Flexómetro","Nivel de burbuja","Escuadra"],ans:1,exp:"El nivel de burbuja indica si una superficie está horizontal. El flexómetro mide distancias y la escuadra ángulos.",tip:"El nivel también sirve para verificar verticales en paredes."},
{task:"Golpear un azulejo sin romperlo para ajustarlo",opts:["Martillo metálico","Mazo de goma","Cincel"],ans:1,exp:"El mazo de goma transmite fuerza sin dañar superficies. El martillo metálico rompería el azulejo y el cincel es para picar.",tip:"El mazo de goma es imprescindible para colocar baldosas y ajustes delicados."},
{task:"Aflojar una tuerca hexagonal oxidada",opts:["Destornillador plano","Llave inglesa","Alicates"],ans:1,exp:"La llave inglesa ajusta su apertura a tuercas hexagonales. El destornillador no agarra tuercas y los alicates redondean las aristas.",tip:"Aplica aceite penetrante y espera 10 min antes de forzar tuercas oxidadas."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),optsEl=document.getElementById('options'),taskEl=document.getElementById('task'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=tasks.length){showResults();return}
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=(idx/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
optsEl.innerHTML=t.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${o}</button>`).join('');
ensureFits();
}

function select(i){
const btns=optsEl.querySelectorAll('.btn-option');
btns.forEach(b=>b.style.pointerEvents='none');
const correct=i===tasks[idx].ans;
if(correct){score++;btns[i].classList.add('correct');btns[i].innerHTML+=' ✓';}
else{btns[i].classList.add('incorrect');btns[i].innerHTML+=' ✗';btns[tasks[idx].ans].classList.add('correct');}
answers.push({task:tasks[idx].task,user:tasks[idx].opts[i],correct:tasks[idx].opts[tasks[idx].ans],ok:correct,exp:tasks[idx].exp,tip:tasks[idx].tip});
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Prueba completada!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Herramientas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.ok?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.ok?'✓ '+a.correct:'✗ Elegiste: '+a.user+' → Correcta: '+a.correct}</div>
<div class="result-explanation">${a.exp}</div>
<div class="result-explanation"><strong>Consejo:</strong> ${a.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',()=>{render();ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

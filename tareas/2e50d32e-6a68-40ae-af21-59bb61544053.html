
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Ordena como un pro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena como un pro</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Arrastra o usa ↑↓ para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title" id="modalTitle">🔧 Taller Industrial</div>
<div class="modal-body" id="modalBody">Eres el nuevo técnico. Tu supervisor evalúa si conoces los procedimientos. Ordena cada secuencia correctamente.</div>
<div class="modal-actions"><button class="cta" id="modalBtn">Comenzar</button></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const challenges=[
{title:"Cambiar un enchufe doméstico",steps:["Cortar el suministro eléctrico","Verificar ausencia de tensión","Desmontar el enchufe antiguo","Conectar el nuevo enchufe","Restablecer el suministro"],correct:[0,1,2,3,4],tip:"Siempre verifica ausencia de tensión antes de manipular cables."},
{title:"Antes de usar herramienta eléctrica",steps:["Inspeccionar el cable y clavija","Comprobar que el interruptor funciona","Verificar el estado del disco o broca","Conectar a la corriente","Hacer prueba en vacío"],correct:[0,1,2,3,4],tip:"Una herramienta dañada puede causar accidentes graves."},
{title:"Reportar un incidente menor",steps:["Asegurar la zona afectada","Atender al compañero si hay lesión","Avisar al encargado de obra","Documentar qué ocurrió","Registrar en el parte de incidencias"],correct:[0,1,2,3,4],tip:"Reportar incidentes menores previene accidentes mayores."}
];
let idx=0,order=[],results=[],dragIdx=null,startY=0,startTime=0;
const scene=document.getElementById('scene'),cards=document.getElementById('cards'),cta=document.getElementById('cta'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),helper=document.getElementById('helper'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),modalBtn=document.getElementById('modalBtn');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
if(idx>=challenges.length){showResults();return;}
const c=challenges[idx];
order=shuffle(c.steps.map((_,i)=>i));
subtitle.textContent=c.title;
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
prog.style.width=((idx)/challenges.length*100)+'%';
helper.textContent="Arrastra o usa ↑↓ para ordenar";
renderCards();
ensureFits();
}

function renderCards(){
const c=challenges[idx];
cards.innerHTML=order.map((stepIdx,pos)=>`<div class="card" data-pos="${pos}" draggable="true">
<span class="card-num">${pos+1}</span>
<span class="card-text">${c.steps[stepIdx]}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveUp(${pos})">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveDown(${pos})">↓</button>
</div>
</div>`).join('');
addDragListeners();
}

function moveUp(pos){if(pos>0){[order[pos],order[pos-1]]=[order[pos-1],order[pos]];renderCards();animateSwap(pos-1);}}
function moveDown(pos){if(pos<order.length-1){[order[pos],order[pos+1]]=[order[pos+1],order[pos]];renderCards();animateSwap(pos+1);}}

function animateSwap(pos){
const card=cards.children[pos];
if(card){card.style.transform='scale(1.03)';setTimeout(()=>card.style.transform='',150);}
}

function addDragListeners(){
const cardEls=cards.querySelectorAll('.card');
cardEls.forEach((card,i)=>{
card.addEventListener('pointerdown',e=>onDragStart(e,i));
card.addEventListener('pointermove',onDragMove);
card.addEventListener('pointerup',onDragEnd);
card.addEventListener('pointercancel',onDragEnd);
});
}

function onDragStart(e,i){
dragIdx=i;startY=e.clientY;startTime=Date.now();
const card=cards.children[i];
card.classList.add('dragging');
card.setPointerCapture(e.pointerId);
}

function onDragMove(e){
if(dragIdx===null)return;
const card=cards.children[dragIdx];
const dy=e.clientY-startY;
card.style.transform=`translateY(${dy}px)`;
}

function onDragEnd(e){
if(dragIdx===null)return;
const card=cards.children[dragIdx];
card.classList.remove('dragging');
const dy=e.clientY-startY;
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(dy)/elapsed;
const passedDist=Math.abs(dy)>40;
const passedVel=Math.abs(dy)>20&&velocity>0.3;
if(dy<0&&(passedDist||passedVel)&&dragIdx>0){
[order[dragIdx],order[dragIdx-1]]=[order[dragIdx-1],order[dragIdx]];
renderCards();animateSwap(dragIdx-1);
}else if(dy>0&&(passedDist||passedVel)&&dragIdx<order.length-1){
[order[dragIdx],order[dragIdx+1]]=[order[dragIdx+1],order[dragIdx]];
renderCards();animateSwap(dragIdx+1);
}else{
card.style.transform='';
}
dragIdx=null;
}

cta.onclick=()=>{
const c=challenges[idx];
const userOrder=order.slice();
const correctOrder=c.correct;
const isCorrect=userOrder.every((v,i)=>v===correctOrder[i]);
results.push({title:c.title,steps:c.steps,userOrder,correctOrder,isCorrect,tip:c.tip});
idx++;
render();
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=results.filter(r=>r.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${results.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${results.map(r=>`<div class="result-item ${r.isCorrect?'correct':'incorrect'}">
<div class="result-question">${r.isCorrect?'✅':'❌'} ${r.title}</div>
${!r.isCorrect?`<div class="result-answer"><strong>Tu orden:</strong><br>${r.userOrder.map((s,i)=>`${i+1}. ${r.steps[s]}`).join('<br>')}</div>`:''}
<div class="result-explanation"><strong>${r.isCorrect?'Orden correcto:':'✅ Orden correcto:'}</strong><br>${r.correctOrder.map((s,i)=>`${i+1}. ${r.steps[s]}`).join('<br>')}</div>
<div class="result-explanation">💡 ${r.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

modal.classList.add('active');
modalBtn.onclick=()=>{modal.classList.remove('active');render();};

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual 📋 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual 📋</div>
<div class="subtitle" id="instruction">Selecciona la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div id="cloze-container">
<p id="cloze-text"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper">Es tu primer día. ¡Demuestra que conoces el vocabulario!</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const clozes=[
{sentence:"Para medir tensión en un enchufe, uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","pinza amperimétrica"],exp:"El multímetro mide tensión. El buscapolos solo detecta fase y la pinza mide corriente."},
{sentence:"Para saber si un cable tiene fase sin tocarlo, uso el ___.",blank:"buscapolos",opts:["buscapolos","multímetro","pelacables"],exp:"El buscapolos detecta presencia de fase. El multímetro requiere contacto y el pelacables corta."},
{sentence:"El cable ___ se usa en instalaciones fijas dentro de tubos.",blank:"rígido",opts:["rígido","flexible","apantallado"],exp:"El cable rígido va en tubos fijos. El flexible es para aparatos móviles."},
{sentence:"El dispositivo que corta el circuito ante una fuga a tierra es el ___.",blank:"diferencial",opts:["diferencial","magnetotérmico","fusible"],exp:"El diferencial detecta fugas a tierra. El magnetotérmico protege contra sobrecargas."},
{sentence:"Para pelar el aislante de un cable sin dañar el cobre, uso el ___.",blank:"pelacables",opts:["pelacables","alicates","destornillador"],exp:"El pelacables tiene muescas calibradas. Los alicates pueden cortar los hilos."},
{sentence:"La unión de varios cables en una caja se llama ___.",blank:"empalme",opts:["empalme","derivación","acometida"],exp:"El empalme une cables. La derivación es una salida y la acometida es la entrada general."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),clozeText=document.getElementById('cloze-text'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),instruction=document.getElementById('instruction');

function render(){
if(idx>=clozes.length){showResults();return}
const c=clozes[idx];
prog.style.width=((idx)/clozes.length*100)+'%';
counter.textContent=(idx+1)+'/'+clozes.length;
const parts=c.sentence.split('___');
clozeText.innerHTML=parts[0]+'<span class="cloze-blank">______</span>'+(parts[1]||'');
opts.innerHTML=c.opts.map(o=>`<button class="btn-option" onclick="selectOpt('${o}')">${o}</button>`).join('');
ensureFits();
}

function selectOpt(chosen){
const c=clozes[idx];
const correct=chosen===c.blank;
const blank=document.querySelector('.cloze-blank');
if(blank){
blank.textContent=chosen;
blank.classList.add(correct?'correct':'incorrect');
}
opts.querySelectorAll('.btn-option').forEach(b=>{
b.disabled=true;
if(b.textContent===chosen)b.classList.add(correct?'correct':'incorrect');
if(b.textContent===c.blank&&!correct)b.classList.add('correct');
});
answers.push({sentence:c.sentence,blank:c.blank,user:chosen,correct,exp:c.exp,opts:c.opts});
setTimeout(()=>{idx++;render();},900);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual Completado!</div>
<div class="results-score">${score}/${clozes.length}</div>
<div class="results-subtitle">Frases correctas</div>
</div>
<div class="results-list">
${answers.map(a=>{
const wrongOpts=a.opts.filter(o=>o!==a.blank).map(o=>`"${o}"`).join(' y ');
return `<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.blank+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto':'✗ Respondiste: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`;}).join('')}
</div>
<div class="results-tip">
<strong>💡 Consejo:</strong> Dominar el vocabulario técnico te permite comunicarte con claridad con compañeros y clientes. ¡Sigue practicando!
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

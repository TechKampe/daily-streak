
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ Conexiones Seguras: ¿Dominas lo Básico? - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">⚡ Conexiones Seguras</div>
<div class="subtitle" id="subtitle">Tu mentor te evalúa antes del tajo</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca la respuesta correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">⚡ Repaso de Seguridad</div>
<div class="modal-body">Primera semana como aprendiz. Tu mentor comprueba si conoces lo básico de seguridad eléctrica.</div>
<div class="modal-actions">
<button class="cta" onclick="startQuiz()">¡Empezar!</button>
</div>
</div>
</div>
<script>
const data=[
{q:"¿Qué EPI es obligatorio en trabajos eléctricos?",opts:["Guantes aislantes","Gafas de sol","Botas de agua"],ans:0,exp:"Los guantes aislantes protegen del contacto eléctrico directo."},
{q:"¿De qué color es el cable de tierra?",opts:["Azul","Amarillo-verde","Marrón"],ans:1,exp:"El cable amarillo-verde siempre es tierra según normativa."},
{q:"Antes de manipular, ¿qué debes hacer?",opts:["Avisar al jefe","Cortar corriente y verificar","Ponerte casco"],ans:1,exp:"Siempre corta y verifica ausencia de tensión antes de tocar."},
{q:"Este símbolo ⚠️⚡ indica...",opts:["Zona wifi","Riesgo eléctrico","Salida emergencia"],ans:1,exp:"La señal triangular con rayo advierte de peligro eléctrico."},
{q:"Si un compañero se electrocuta, ¿qué haces primero?",opts:["Tocarlo para apartarlo","Cortar la corriente","Echarle agua"],ans:1,exp:"Nunca toques a la víctima. Corta la corriente primero."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),subtitle=document.getElementById('subtitle'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function startQuiz(){modal.classList.remove('active');render();}

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
subtitle.textContent=d.q;
prog.style.width=(idx/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" aria-label="${o}" onclick="select(${i})">${o}</button>`).join('');
opts.style.opacity='0';
setTimeout(()=>{opts.style.transition='opacity 0.3s';opts.style.opacity='1';},50);
ensureFits();
}

function select(i){
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>b.disabled=true);
const correct=i===data[idx].ans;
btns[i].classList.add(correct?'correct':'incorrect');
if(!correct)btns[data[idx].ans].classList.add('correct');
if(correct)score++;
answers.push({q:data[idx].q,correct,exp:data[idx].exp,user:data[idx].opts[i],correctAns:data[idx].opts[data[idx].ans]});
helper.textContent=correct?'¡Correcto! 👍':'Incorrecto 😕';
setTimeout(()=>{idx++;helper.textContent='Toca la respuesta correcta';render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">⚡ ¡Repaso completado!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">${score>=4?'¡Buen trabajo, aprendiz!':'Repasa antes de entrar al tajo'}</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${i+1}. ${a.q}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Tu respuesta: '+a.user}</div>
${!a.correct?`<div class="result-answer" style="color:var(--ok)">✓ Correcta: ${a.correctAns}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="border-left-color:var(--accent)">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Antes de manipular cualquier instalación, verifica SIEMPRE la ausencia de tensión con un detector homologado.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

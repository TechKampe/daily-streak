
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o Realidad? ⚡ Seguridad Eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o Realidad? ⚡</div>
<div class="subtitle">Seguridad Eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div id="statement-container">
<p id="statement"></p>
</div>
<div class="options" id="options">
<button class="btn-option" id="btn-true" onclick="answer(true)">✓ Verdadero</button>
<button class="btn-option" id="btn-false" onclick="answer(false)">✗ Falso</button>
</div>
</div>
<div class="footer">
<div class="helper">¿Esta afirmación es verdadera o falsa?</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const statements=[
{text:"La madera siempre aísla la electricidad",correct:false,exp:"La madera húmeda conduce electricidad. Solo la madera completamente seca tiene propiedades aislantes limitadas."},
{text:"Los guantes de látex protegen igual que los dieléctricos",correct:false,exp:"Los guantes de látex NO son aislantes certificados. Solo los guantes dieléctricos homologados protegen contra descargas."},
{text:"Un circuito desconectado puede mantener carga residual",correct:true,exp:"Los condensadores pueden almacenar carga peligrosa incluso con el circuito desconectado. Siempre verifica ausencia de tensión."},
{text:"El diferencial protege contra todos los accidentes eléctricos",correct:false,exp:"El diferencial protege contra contactos indirectos, pero NO contra contactos directos entre fases o cortocircuitos."},
{text:"Trabajar con una sola mano reduce el riesgo de electrocución",correct:true,exp:"Evita que la corriente atraviese el corazón. Es una práctica de seguridad recomendada al manipular circuitos."},
{text:"Un cable pelado sin tocar nada no representa peligro",correct:false,exp:"Un cable con tensión puede provocar arcos eléctricos o contactos accidentales. Siempre debe estar aislado o desconectado."},
{text:"Antes de trabajar hay que verificar ausencia de tensión",correct:true,exp:"Es obligatorio usar un detector de tensión homologado antes de cualquier intervención. Las 5 reglas de oro lo exigen."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),stEl=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnTrue=document.getElementById('btn-true'),btnFalse=document.getElementById('btn-false');

function render(){
if(idx>=statements.length){showResults();return}
const s=statements[idx];
stEl.textContent=s.text;
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
btnTrue.disabled=false;btnFalse.disabled=false;
btnTrue.classList.remove('correct','incorrect','selected');
btnFalse.classList.remove('correct','incorrect','selected');
ensureFits();
}

function answer(userAnswer){
btnTrue.disabled=true;btnFalse.disabled=true;
const s=statements[idx];
const isCorrect=userAnswer===s.correct;
if(isCorrect)score++;
answers.push({text:s.text,userAnswer,correct:s.correct,isCorrect,exp:s.exp});
const clickedBtn=userAnswer?btnTrue:btnFalse;
clickedBtn.classList.add(isCorrect?'correct':'incorrect');
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`
<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`
<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} ${a.isCorrect?'✓':'✗'} | Correcta: ${a.correct?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>
`).join('')}
</div>
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Antes de intervenir en cualquier instalación, aplica siempre las 5 reglas de oro: desconectar, bloquear, verificar ausencia de tensión, poner a tierra y señalizar. Usa un detector de tensión homologado, nunca confíes solo en que "está desconectado".</div>
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

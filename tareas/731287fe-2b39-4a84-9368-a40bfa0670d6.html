
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 ¿Herramienta o EPI? Clasifica rápido - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 ¿Herramienta o EPI?</div>
<div class="subtitle" id="subtitle">Clasifica cada elemento</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="content" id="gameArea">
<div class="item-display" id="itemDisplay"></div>
<div class="options" id="categories"></div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca la categoría correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">📦 ¡Organiza el almacén!</div>
<div class="modal-body">Es tu primer día. Clasifica cada elemento en EPI (te protege) o Herramienta (para trabajar).</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const items=[
{name:"Guantes dieléctricos",cat:"EPI",exp:"Protegen de descargas eléctricas hasta 1000V."},
{name:"Destornillador aislado",cat:"Herramienta",exp:"Herramienta para apretar/aflojar tornillos con aislamiento."},
{name:"Casco de seguridad",cat:"EPI",exp:"Protege la cabeza de golpes y caída de objetos."},
{name:"Polímetro",cat:"Herramienta",exp:"Instrumento para medir tensión, corriente y resistencia."},
{name:"Gafas de protección",cat:"EPI",exp:"Protegen los ojos de partículas y salpicaduras."},
{name:"Alicates de corte",cat:"Herramienta",exp:"Herramienta para cortar cables y alambres."},
{name:"Arnés anticaídas",cat:"EPI",exp:"Sistema de sujeción que evita caídas en altura."},
{name:"Nivel láser",cat:"Herramienta",exp:"Proyecta líneas para nivelar instalaciones."},
{name:"Botas dieléctricas",cat:"EPI",exp:"Calzado aislante que protege de contactos eléctricos."},
{name:"Pelacables",cat:"Herramienta",exp:"Herramienta para retirar el aislamiento de cables."}
];

const categories=["EPI","Herramienta"];
let idx=0,answers=[];
const scene=document.getElementById('scene'),modal=document.getElementById('modal'),itemDisplay=document.getElementById('itemDisplay'),catsEl=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper');

modal.classList.add('active');

function startGame(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
itemDisplay.innerHTML=`<div class="current-item">${item.name}</div>`;
catsEl.innerHTML=categories.map(c=>`<button class="btn-option cat-btn" onclick="selectCat('${c}')">${c==='EPI'?'🛡️ EPI':'🔧 Herramienta'}</button>`).join('');
ensureFits();
}

function selectCat(cat){
const item=items[idx];
const correct=cat===item.cat;
answers.push({name:item.name,user:cat,correct:item.cat,ok:correct,exp:item.exp});

const btns=catsEl.querySelectorAll('.btn-option');
btns.forEach(b=>{
if(b.textContent.includes(cat)){
b.classList.add(correct?'correct':'incorrect');
}
if(b.textContent.includes(item.cat)&&!correct){
b.classList.add('correct');
}
b.disabled=true;
});

itemDisplay.querySelector('.current-item').classList.add(correct?'drop-ok':'drop-err');

setTimeout(()=>{
idx++;
render();
},600);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');

const score=answers.filter(a=>a.ok).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🎉 ¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Elementos bien clasificados</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.ok?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.ok?'✓ Correcto':'✗ Dijiste: '+a.user+' → Era: '+a.correct}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="results-tip">
<strong>💡 Consejo:</strong> Antes de empezar cualquier tarea, separa mentalmente lo que te protege de lo que usas para trabajar. ¡La seguridad siempre primero!
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o realidad? ⚡ Seguridad eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o realidad? ⚡</div>
<div class="subtitle">Seguridad eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="statement"></p>
</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">✓ Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">✗ Falso</button>
</div>
</div>
<div class="footer">
<div class="helper">¿Es verdad o es un mito peligroso?</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">Tu primera semana ⚡</div>
<div class="modal-body">El oficial te suelta frases sobre seguridad eléctrica. ¿Cuáles son ciertas y cuáles son bulos peligrosos?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>
<script>
const statements=[
{text:"Con 12 voltios no pasa nada, puedes tocarlo sin problema.",correct:false,exp:"Depende del contexto. 12V DC en seco es seguro, pero en condiciones húmedas o con alta corriente puede ser peligroso. Siempre verifica."},
{text:"Antes de trabajar en un circuito, hay que cortar la corriente y verificar ausencia de tensión.",correct:true,exp:"Correcto. Es la regla de oro: cortar, bloquear, verificar con buscapolos o multímetro, y señalizar."},
{text:"Los guantes de trabajo normales protegen de descargas eléctricas.",correct:false,exp:"Falso. Solo los guantes dieléctricos homologados (clase 00 a 4) protegen. Los de trabajo común no aíslan."},
{text:"La madera seca no conduce electricidad, así que es seguro usarla como aislante.",correct:false,exp:"Mito peligroso. La madera puede tener humedad o impurezas que la hacen conductora. Usa solo herramientas aisladas homologadas."},
{text:"Un cuadro eléctrico intervenido debe señalizarse con cartel de 'Trabajos en curso'.",correct:true,exp:"Correcto. La señalización evita que alguien reconecte mientras trabajas. Es obligatorio por normativa PRL."},
{text:"El buscapolos solo detecta fase, no garantiza ausencia total de tensión.",correct:true,exp:"Correcto. El buscapolos indica presencia de fase, pero para verificar ausencia total usa un multímetro o detector de tensión."},
{text:"Si saltan los diferenciales, puedes volver a subirlos sin revisar nada.",correct:false,exp:"Falso. El diferencial salta por una razón: fuga a tierra o cortocircuito. Hay que identificar y solucionar la causa antes de rearmar."}
];
let idx=0,answers=[],score=0,canAnswer=true;
const scene=document.getElementById('scene'),content=document.getElementById('content'),statement=document.getElementById('statement'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal'),btnTrue=document.getElementById('btnTrue'),btnFalse=document.getElementById('btnFalse');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=statements.length){showResults();return}
canAnswer=true;
btnTrue.classList.remove('correct','incorrect','selected');
btnFalse.classList.remove('correct','incorrect','selected');
btnTrue.disabled=false;btnFalse.disabled=false;
statement.textContent=statements[idx].text;
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
ensureFits();
}

function answer(val){
if(!canAnswer)return;
canAnswer=false;
const s=statements[idx];
const correct=val===s.correct;
if(correct)score++;
answers.push({text:s.text,userAnswer:val,correct:correct,correctAnswer:s.correct,exp:s.exp});
const btn=val?btnTrue:btnFalse;
btn.classList.add(correct?'correct':'incorrect');
btnTrue.disabled=true;btnFalse.disabled=true;
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} ${a.correct?'✓':'✗'} | Correcta: ${a.correctAnswer?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">Antes de tocar cualquier conductor, usa siempre el VAT (Verificador de Ausencia de Tensión): comprobar-verificar-comprobar. Primero verifica que tu detector funciona, luego mide el circuito, y después vuelve a verificar el detector.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();modal.classList.add('active');});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o realidad? ⚡ Seguridad eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o realidad? ⚡</div>
<div class="subtitle">Seguridad eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="statement" style="font-size:1.15rem;line-height:1.5;text-align:center;padding:1rem 0.5rem;margin:0"></p>
</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">✓ Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">✗ Falso</button>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">¿Es verdadero o falso?</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔌 Primera semana en obra</div>
<div class="modal-body">El oficial te suelta frases sobre seguridad eléctrica. ¿Sabes distinguir los hechos de los mitos?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Empezar</button>
</div>
</div>
</div>
<script>
const statements=[
{text:"La corriente de 220V es peligrosa, pero la de 12V nunca puede hacerte daño.",ans:false,exp:"Aunque 12V es menos peligroso, en condiciones de humedad o contacto directo con el corazón puede ser mortal. Toda tensión requiere precaución."},
{text:"Antes de trabajar en un circuito, siempre hay que cortar la corriente y verificar ausencia de tensión.",ans:true,exp:"Es la regla de oro de seguridad eléctrica. Cortar no basta: hay que comprobar con un verificador que no hay tensión residual."},
{text:"Los guantes de trabajo de cuero protegen igual que los guantes aislantes contra descargas eléctricas.",ans:false,exp:"Solo los guantes dieléctricos homologados protegen contra electricidad. El cuero no aísla y puede estar húmedo."},
{text:"Si una escalera de madera está seca, puedo usarla con seguridad cerca de cables con tensión.",ans:false,exp:"La madera no es un aislante fiable: absorbe humedad y tiene impurezas. Solo equipos dieléctricos certificados son seguros."},
{text:"El bloqueo y etiquetado (LOTO) es obligatorio antes de intervenir en instalaciones eléctricas.",ans:true,exp:"El procedimiento LOTO evita que alguien reconecte mientras trabajas. Es obligatorio por normativa de PRL."},
{text:"Las herramientas con mango de plástico siempre están aisladas para trabajos eléctricos.",ans:false,exp:"Solo las herramientas con certificación VDE/1000V garantizan aislamiento. Un mango de plástico común no protege."},
{text:"Señalizar la zona de trabajo eléctrico es tan importante como cortar la corriente.",ans:true,exp:"La señalización avisa a otros trabajadores del riesgo y evita reconexiones accidentales. Es parte del protocolo de seguridad."}
];
let idx=0,answers=[],blocked=false;
const scene=document.getElementById('scene'),stmt=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnT=document.getElementById('btnTrue'),btnF=document.getElementById('btnFalse'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=statements.length){showResults();return}
blocked=false;
btnT.className='btn-option';btnF.className='btn-option';
btnT.disabled=false;btnF.disabled=false;
stmt.textContent='"'+statements[idx].text+'"';
prog.style.width=(idx/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
helper.textContent='¿Es verdadero o falso?';
ensureFits();
}

function answer(val){
if(blocked)return;
blocked=true;
const correct=val===statements[idx].ans;
answers.push({text:statements[idx].text,userAns:val,correctAns:statements[idx].ans,correct,exp:statements[idx].exp});
if(val){btnT.classList.add(correct?'correct':'incorrect');btnF.disabled=true;}
else{btnF.classList.add(correct?'correct':'incorrect');btnT.disabled=true;}
helper.textContent=correct?'¡Correcto!':'Incorrecto';
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">"${a.text}"</div>
<div class="result-answer">Tu respuesta: ${a.userAns?'Verdadero':'Falso'} ${a.correct?'✓':'✗'} · Correcta: ${a.correctAns?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="border-left-color:#f59e0b">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Recuerda la regla de oro: siempre verifica ausencia de tensión con un comprobador homologado antes de tocar cualquier conductor. Cortar el interruptor no es suficiente.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔍 Caza el Fallo: Obra en Marcha - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔍 Caza el Fallo</div>
<div class="subtitle" id="sceneTitle">Cargando escena...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Toca el elemento con el error</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="introModal">
<div class="modal">
<div class="modal-title">🔍 Caza el Fallo</div>
<div class="modal-body">Eres el nuevo ayudante en obra. Revisa cada escena y toca el elemento que tenga un error.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const scenes=[
{title:"Montaje de andamio",desc:"El equipo monta un andamio para trabajar en altura.",items:["Plataforma con barandilla","Zapatas sobre terreno firme","Operario sin casco","Anclaje a fachada"],error:2,exp:"Siempre hay que usar casco en obra, especialmente en trabajos en altura."},
{title:"Mezcla de cemento",desc:"Un compañero prepara mortero para el revestimiento.",items:["Cemento en bolsa cerrada","Proporción 1:6 cemento-arena","Agua limpia","Arena de río lavada"],error:1,exp:"La proporción correcta es 1:4 o 1:5. Con 1:6 el mortero queda débil."},
{title:"Uso de radial",desc:"Van a cortar una varilla metálica con la radial.",items:["Disco de corte metal","Operario con gafas","Pieza sujeta con el pie","Zona despejada"],error:2,exp:"La pieza debe fijarse con mordaza o tornillo, nunca sujetarla con el pie."},
{title:"Señalización de zona",desc:"Hoy se abre una zanja en la entrada del edificio.",items:["Zanja de 60cm de fondo","Valla perimetral naranja","Acceso sin cartel de aviso","Pasarela para peatones"],error:2,exp:"Toda zona de riesgo debe tener cartel de advertencia visible."},
{title:"Almacenaje de material",desc:"Al final del día se guardan los materiales.",items:["Sacos de yeso en tarima","Sacos de cemento al aire libre","Herramientas en caja","Zona cubierta"],error:1,exp:"El cemento absorbe humedad y se endurece. Debe guardarse en lugar seco y cubierto."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),titleEl=document.getElementById('sceneTitle'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),introModal=document.getElementById('introModal');

function startGame(){introModal.classList.remove('active');render();}

function render(){
if(idx>=scenes.length){showResults();return}
const s=scenes[idx];
titleEl.textContent=s.desc;
prog.style.width=(idx/scenes.length*100)+'%';
counter.textContent=(idx+1)+'/'+scenes.length;
helper.textContent='Toca el elemento con el error';
opts.innerHTML=s.items.map((item,i)=>`<button class="btn-option" onclick="selectItem(${i})">${item}</button>`).join('');
ensureFits();
}

function selectItem(i){
const s=scenes[idx];
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>b.disabled=true);
const correct=i===s.error;
btns[i].classList.add(correct?'correct':'incorrect');
if(!correct)btns[s.error].classList.add('correct');
answers.push({scene:s.title,desc:s.desc,chosen:s.items[i],correctItem:s.items[s.error],correct,exp:s.exp});
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔍 ¡Revisión completada!</div>
<div class="results-score">${score}/${scenes.length}</div>
<div class="results-subtitle">Errores detectados correctamente</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question"><strong>Escena ${i+1}:</strong> ${a.scene}</div>
<div class="result-answer">${a.correct?'✓ Detectaste: '+a.chosen:'✗ Elegiste: '+a.chosen}</div>
${!a.correct?`<div class="result-answer">Error real: ${a.correctItem}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question"><strong>💡 Consejo del encargado</strong></div>
<div class="result-explanation">La atención al detalle previene accidentes y evita retrabajos costosos. Antes de empezar cualquier tarea, dedica un minuto a revisar equipos, materiales y zona de trabajo.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{introModal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el manual 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el manual 🔧</div>
<div class="subtitle">Rellena el hueco con la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<p id="sentence"></p>
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Selecciona la opción correcta para completar la frase</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 2_low.png" alt="" loading="lazy">
<script>
const data=[
{sentence:"Para medir tensión eléctrica, uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","nivel de burbuja"],exp:{wrong:["El buscapolos detecta presencia de corriente, no mide tensión.","El nivel de burbuja es para comprobar horizontalidad."]}},
{sentence:"Para cortar tubería de cobre, necesito una ___.",blank:"cortatubos",opts:["cortatubos","sierra de calar","amoladora"],exp:{wrong:["La sierra de calar es para madera y plástico.","La amoladora es excesiva y peligrosa para cobre fino."]}},
{sentence:"Antes de trabajar en altura, debo ponerme el ___.",blank:"arnés de seguridad",opts:["arnés de seguridad","casco","chaleco reflectante"],exp:{wrong:["El casco protege la cabeza pero no evita caídas.","El chaleco da visibilidad pero no protege de caídas."]}},
{sentence:"Para apretar tuercas hexagonales uso una ___.",blank:"llave inglesa",opts:["llave inglesa","destornillador","alicates"],exp:{wrong:["El destornillador es para tornillos con ranura.","Los alicates pueden dañar las tuercas."]}},
{sentence:"El material aislante más común en cables es el ___.",blank:"PVC",opts:["PVC","cobre","aluminio"],exp:{wrong:["El cobre es conductor, no aislante.","El aluminio también es conductor eléctrico."]}},
{sentence:"Para hacer agujeros en hormigón uso un ___.",blank:"taladro percutor",opts:["taladro percutor","atornillador","berbiquí"],exp:{wrong:["El atornillador no tiene potencia para hormigón.","El berbiquí es manual y para madera."]}}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),optsEl=document.getElementById('options'),sentenceEl=document.getElementById('sentence'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
prog.style.width=((idx)/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
sentenceEl.innerHTML=d.sentence.replace('___','<u>&nbsp;&nbsp;&nbsp;___&nbsp;&nbsp;&nbsp;</u>');
optsEl.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" onclick="selectOpt(${i})">${o}</button>`).join('');
ensureFits();
}

function selectOpt(i){
const d=data[idx];
const correct=d.opts[i]===d.blank;
const wrongIdx=d.opts.filter(o=>o!==d.blank).indexOf(d.opts[i]);
answers.push({sentence:d.sentence,blank:d.blank,user:d.opts[i],correct,expWrong:d.exp.wrong});
const btns=optsEl.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(d.opts[j]===d.blank)b.classList.add('correct');
else if(j===i)b.classList.add('incorrect');
});
sentenceEl.innerHTML=d.sentence.replace('___',`<u><strong>${d.blank}</strong></u>`);
setTimeout(()=>{idx++;render();},900);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual completado!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.blank+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto: '+a.user:'✗ Tu respuesta: '+a.user}</div>
<div class="result-explanation">${a.correct?'¡Perfecto! Palabra correcta.':a.expWrong.join(' ')}</div>
</div>`).join('')}
</div>
<div class="tip-box">
<strong>Consejo:</strong> Dominar el vocabulario técnico te ayudará a comunicarte con tu equipo y entender manuales e instrucciones en obra.
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

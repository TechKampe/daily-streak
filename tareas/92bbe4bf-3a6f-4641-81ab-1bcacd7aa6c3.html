
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o realidad? ⚡ Seguridad eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o realidad? ⚡</div>
<div class="subtitle">Seguridad eléctrica básica</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<div class="statement-box" id="statement"></div>
</div>
</div>
<div class="footer">
<div class="helper">¿Es verdadero o falso?</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">Falso</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">Tu primera semana ⚡</div>
<div class="modal-body">Tu supervisor te lanza afirmaciones sobre seguridad. ¿Sabes distinguir los mitos de la realidad?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>
<script>
const statements=[
{text:"Los guantes de látex comunes protegen contra descargas eléctricas.",correct:false,exp:"Solo los guantes dieléctricos certificados protegen. El látex común no aísla voltajes peligrosos."},
{text:"Antes de trabajar en un circuito, siempre hay que cortar el suministro en el cuadro.",correct:true,exp:"Es la primera regla de oro: desconectar y bloquear antes de intervenir."},
{text:"La corriente continua (DC) es menos peligrosa que la alterna (AC) a igual voltaje.",correct:false,exp:"Ambas son peligrosas. La DC puede causar contracciones musculares sostenidas que impiden soltar el cable."},
{text:"12 voltios no pueden hacerte daño nunca.",correct:false,exp:"En condiciones de humedad o con piel mojada, incluso 12V pueden ser peligrosos."},
{text:"Los cuadros eléctricos deben estar señalizados con el símbolo de riesgo eléctrico.",correct:true,exp:"La señalización es obligatoria por normativa para advertir del peligro."},
{text:"Verificar ausencia de tensión con un polímetro es opcional si ya has cortado el diferencial.",correct:false,exp:"Siempre hay que verificar con un detector de tensión. Puede haber errores de etiquetado o derivaciones."},
{text:"El procedimiento de bloqueo y etiquetado (LOTO) evita que alguien reconecte mientras trabajas.",correct:true,exp:"LOTO es esencial: bloquear el interruptor y poner tu candado personal evita reconexiones accidentales."}
];
let idx=0,answers=[],canAnswer=true;
const scene=document.getElementById('scene'),stEl=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnT=document.getElementById('btnTrue'),btnF=document.getElementById('btnFalse'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=statements.length){showResults();return}
canAnswer=true;
btnT.className='btn-option';btnF.className='btn-option';
btnT.disabled=false;btnF.disabled=false;
stEl.textContent=statements[idx].text;
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
ensureFits();
}

function answer(val){
if(!canAnswer)return;
canAnswer=false;
btnT.disabled=true;btnF.disabled=true;
const correct=val===statements[idx].correct;
answers.push({text:statements[idx].text,userAnswer:val,correctAnswer:statements[idx].correct,correct,exp:statements[idx].exp});
if(val){btnT.classList.add(correct?'correct':'incorrect');}
else{btnF.classList.add(correct?'correct':'incorrect');}
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">Tu respuesta: ${a.userAnswer?'Verdadero':'Falso'} ${a.correct?'✓':'✗'} | Correcta: ${a.correctAnswer?'Verdadero':'Falso'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="results-tip">
<strong>💡 Consejo práctico:</strong> Aplica siempre las 5 reglas de oro: desconectar, bloquear, verificar ausencia de tensión, poner a tierra y señalizar. Nunca te fíes solo de haber bajado el diferencial.
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Paso a Paso: Maestro del Protocolo - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Maestro del Protocolo</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Usa ↑↓ o arrastra para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Evaluación de Protocolo</div>
<div class="modal-body">Tu supervisor observa cómo organizas los procedimientos. Ordena cada secuencia de pasos correctamente.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Comenzar!</button></div>
</div>
</div>

<script>
const challenges=[
{title:"Preparación de herramienta eléctrica",
steps:["Revisar estado del cable","Conectar a la toma","Verificar funcionamiento","Usar la herramienta"],
correct:[0,1,2,3],
tip:"Siempre revisa el cable antes de conectar para evitar electrocuciones."},
{title:"Protocolo ante derrame de aceite",
steps:["Señalizar la zona","Contener el derrame","Limpiar el aceite","Reportar el incidente","Reponer absorbente"],
correct:[0,1,2,3,4],
tip:"Señalizar primero evita que otros resbalen mientras actúas."},
{title:"Inicio de jornada en taller",
steps:["Fichar entrada","Colocarse el EPI","Revisar zona de trabajo","Comenzar la tarea"],
correct:[0,1,2,3],
tip:"El EPI siempre antes de cualquier actividad en el taller."}
];

let idx=0,results=[],draggedIdx=null,startY=0,startTime=0;
const scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),cta=document.getElementById('cta'),subtitle=document.getElementById('subtitle'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
if(idx>=challenges.length){showResults();return;}
const ch=challenges[idx];
subtitle.textContent=ch.title;
prog.style.width=((idx)/challenges.length*100)+'%';
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
const shuffled=shuffle(ch.steps.map((s,i)=>({text:s,origIdx:i})));
cardsEl.innerHTML=shuffled.map((s,i)=>`<div class="card" data-idx="${i}" data-orig="${s.origIdx}">
<span class="card-num">${i+1}</span>
<span class="card-text">${s.text}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveCard(${i},-1)">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveCard(${i},1)">↓</button>
</div>
</div>`).join('');
attachDrag();
ensureFits();
}

function moveCard(i,dir){
const cards=[...cardsEl.children];
const newIdx=i+dir;
if(newIdx<0||newIdx>=cards.length)return;
const card=cards[i];
card.style.transform='scale(1.03)';
setTimeout(()=>card.style.transform='',150);
if(dir<0)cardsEl.insertBefore(card,cards[newIdx]);
else cardsEl.insertBefore(cards[newIdx],card);
updateNums();
}

function updateNums(){
[...cardsEl.children].forEach((c,i)=>{
c.dataset.idx=i;
c.querySelector('.card-num').textContent=i+1;
const btns=c.querySelectorAll('.btn-ghost');
btns[0].onclick=()=>moveCard(i,-1);
btns[1].onclick=()=>moveCard(i,1);
});
attachDrag();
}

function attachDrag(){
[...cardsEl.children].forEach((card,i)=>{
card.onpointerdown=e=>{
if(e.target.closest('.btn-ghost'))return;
draggedIdx=i;startY=e.clientY;startTime=Date.now();
card.classList.add('dragging');
card.setPointerCapture(e.pointerId);
};
card.onpointermove=e=>{
if(draggedIdx!==i)return;
const dy=e.clientY-startY;
card.style.transform=`translateY(${dy}px)`;
card.style.zIndex=10;
};
card.onpointerup=e=>{
if(draggedIdx!==i)return;
card.classList.remove('dragging');
card.style.transform='';
card.style.zIndex='';
const dy=e.clientY-startY;
const elapsed=Math.max(Date.now()-startTime,1);
const velocity=Math.abs(dy)/elapsed;
const passedDist=Math.abs(dy)>40;
const passedVel=Math.abs(dy)>20&&velocity>0.4;
if(passedDist||passedVel){
const dir=dy>0?1:-1;
const cards=[...cardsEl.children];
let target=i+dir;
while(target>=0&&target<cards.length&&Math.abs(target-i)*50<Math.abs(dy))target+=dir;
target=Math.max(0,Math.min(cards.length-1,target-dir+dir));
if(target!==i){
if(dir>0&&target<cards.length-1)cardsEl.insertBefore(card,cards[target+1]);
else if(dir>0)cardsEl.appendChild(card);
else cardsEl.insertBefore(card,cards[target]);
updateNums();
}
}
draggedIdx=null;
};
card.onpointercancel=()=>{
card.classList.remove('dragging');
card.style.transform='';
card.style.zIndex='';
draggedIdx=null;
};
});
}

cta.onclick=()=>{
const ch=challenges[idx];
const userOrder=[...cardsEl.children].map(c=>parseInt(c.dataset.orig));
const correct=userOrder.every((v,i)=>v===ch.correct[i]);
results.push({
title:ch.title,
userOrder:userOrder.map(i=>ch.steps[i]),
correctOrder:ch.correct.map(i=>ch.steps[i]),
correct,
tip:ch.tip
});
idx++;
render();
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=results.filter(r=>r.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${results.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${results.map(r=>`<div class="result-item ${r.correct?'correct':'incorrect'}">
<div class="result-question">${r.correct?'✅':'❌'} ${r.title}</div>
${r.correct?`<div class="result-answer">¡Orden correcto!</div>
<div class="result-explanation">${r.correctOrder.map((s,i)=>`${i+1}. ${s}`).join(' → ')}</div>`
:`<div class="result-answer"><strong>Tu orden:</strong><br>${r.userOrder.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>
<div class="result-explanation"><strong>✅ Orden correcto:</strong><br>${r.correctOrder.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>`}
<div class="result-explanation">💡 ${r.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function closeModal(){modal.classList.remove('active');render();}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();modal.classList.add('active');});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

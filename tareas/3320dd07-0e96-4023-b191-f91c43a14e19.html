
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Herramienta o EPI? 🛠️ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Herramienta o EPI? 🛠️</div>
<div class="subtitle" id="instruction">Clasifica cada elemento</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="item-display" id="itemDisplay"></div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper">Toca la categoría correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">📦 Ordena el almacén</div>
<div class="modal-body">Es tu primer día en el taller. Separa los elementos entre Herramientas y Equipos de Protección (EPI).</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>
<script>
const items=[
{name:"Multímetro",cat:"Herramienta",exp:"Instrumento para medir tensión, corriente y resistencia eléctrica."},
{name:"Guantes dieléctricos",cat:"EPI",exp:"Protegen contra descargas eléctricas. Obligatorios en trabajos con tensión."},
{name:"Destornillador buscapolos",cat:"Herramienta",exp:"Detecta presencia de tensión en conductores y enchufes."},
{name:"Casco de seguridad",cat:"EPI",exp:"Protege la cabeza de impactos y caída de objetos. Norma EN 397."},
{name:"Alicates pelacables",cat:"Herramienta",exp:"Sirven para pelar y cortar cables de diferentes secciones."},
{name:"Gafas de protección",cat:"EPI",exp:"Protegen los ojos de partículas, chispas y salpicaduras."},
{name:"Martillo",cat:"Herramienta",exp:"Herramienta de golpeo para clavar, ajustar o romper materiales."},
{name:"Botas con puntera",cat:"EPI",exp:"Calzado de seguridad que protege de aplastamientos y perforaciones."},
{name:"Llave inglesa",cat:"Herramienta",exp:"Llave ajustable para apretar o aflojar tuercas de varios tamaños."},
{name:"Chaleco reflectante",cat:"EPI",exp:"Aumenta la visibilidad del trabajador en zonas de tráfico o poca luz."}
];
let idx=0,score=0,answers=[],isAnimating=false;
const scene=document.getElementById('scene'),itemDisplay=document.getElementById('itemDisplay'),cats=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal'),instruction=document.getElementById('instruction');

function startGame(){modal.classList.remove('active');render();}
function render(){
if(idx>=items.length){showResults();return}
const it=items[idx];
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
instruction.textContent='¿Dónde va este elemento?';
itemDisplay.innerHTML=`<div class="item-card">${it.name}</div>`;
cats.innerHTML=`<button class="btn-option" onclick="classify('Herramienta')">🔧 Herramienta</button><button class="btn-option" onclick="classify('EPI')">🦺 EPI</button>`;
ensureFits();
}
function classify(choice){
if(isAnimating)return;
isAnimating=true;
const it=items[idx],correct=choice===it.cat;
if(correct)score++;
answers.push({name:it.name,correct,userChoice:choice,correctCat:it.cat,exp:it.exp});
const btns=cats.querySelectorAll('.btn-option');
btns.forEach(b=>{
if(b.textContent.includes(choice))b.classList.add(correct?'correct':'incorrect');
if(b.textContent.includes(it.cat)&&!correct)b.classList.add('correct');
});
const card=itemDisplay.querySelector('.item-card');
card.classList.add(correct?'drop-correct':'drop-incorrect');
setTimeout(()=>{idx++;isAnimating=false;render();},600);
}
function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Almacén ordenado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.correctCat:'✗ Dijiste '+a.userChoice+' → Era '+a.correctCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">Antes de empezar cualquier trabajo, separa mentalmente lo que usas para trabajar de lo que te protege. Ambos son igual de importantes.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}
function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}
function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}
function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}
window.addEventListener('load',()=>{modal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

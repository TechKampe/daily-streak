
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Mito o Realidad? ⚡ Seguridad Eléctrica - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Mito o Realidad? ⚡</div>
<div class="subtitle">Seguridad Eléctrica</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/7</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="statement" style="font-size:1.15rem;line-height:1.5;text-align:center;padding:0 8px;margin:0"></p>
</div>
<div class="options" id="options">
<button class="btn-option" id="btnTrue" onclick="answer(true)">✓ Verdadero</button>
<button class="btn-option" id="btnFalse" onclick="answer(false)">✗ Falso</button>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">¿Es verdadero o falso? Elige tu respuesta</div>
</div>
</div>
<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">Tu primera semana 🔧</div>
<div class="modal-body">Tu supervisor quiere comprobar cuánto sabes sobre seguridad eléctrica. ¿Mito o realidad?</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const statements=[
{text:"La corriente doméstica de 230V no puede matar a una persona.",ans:false,exp:"FALSO. 230V pueden ser letales. Corrientes de apenas 30mA atravesando el corazón pueden causar fibrilación ventricular."},
{text:"Antes de trabajar en una instalación, hay que verificar la ausencia de tensión con un buscapolos o multímetro.",ans:true,exp:"VERDADERO. Las 5 reglas de oro incluyen verificar ausencia de tensión. Nunca confíes solo en que el interruptor está bajado."},
{text:"Los guantes de trabajo normales protegen contra descargas eléctricas.",ans:false,exp:"FALSO. Solo los guantes dieléctricos homologados protegen. Los guantes de obra comunes no aíslan la electricidad."},
{text:"Trabajar con las manos mojadas aumenta el riesgo de electrocución.",ans:true,exp:"VERDADERO. El agua reduce la resistencia de la piel, permitiendo que pase más corriente por el cuerpo."},
{text:"Si un cable está pelado pero no toco el cobre, no hay peligro.",ans:false,exp:"FALSO. Un cable pelado es siempre un riesgo. Puede haber contacto accidental o arco eléctrico con humedad."},
{text:"El cuadro eléctrico debe estar señalizado con el símbolo de riesgo eléctrico.",ans:true,exp:"VERDADERO. La señalización es obligatoria según normativa. Advierte del peligro a cualquier persona que se acerque."},
{text:"Si saltan los plomos frecuentemente, basta con poner uno de mayor amperaje.",ans:false,exp:"FALSO. Los magnetotérmicos protegen la instalación. Poner uno mayor puede causar sobrecalentamiento e incendios."}
];
let idx=0,score=0,answers=[],locked=false;
const scene=document.getElementById('scene'),stmt=document.getElementById('statement'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),btnT=document.getElementById('btnTrue'),btnF=document.getElementById('btnFalse'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=statements.length){showResults();return}
locked=false;
btnT.className='btn-option';btnF.className='btn-option';
btnT.disabled=false;btnF.disabled=false;
stmt.textContent=statements[idx].text;
prog.style.width=((idx)/statements.length*100)+'%';
counter.textContent=(idx+1)+'/'+statements.length;
helper.textContent='¿Es verdadero o falso? Elige tu respuesta';
ensureFits();
}

function answer(userAns){
if(locked)return;
locked=true;
const correct=userAns===statements[idx].ans;
if(correct)score++;
answers.push({text:statements[idx].text,userAns,correctAns:statements[idx].ans,correct,exp:statements[idx].exp});
if(userAns){
btnT.classList.add(correct?'correct':'incorrect');
}else{
btnF.classList.add(correct?'correct':'incorrect');
}
btnT.disabled=true;btnF.disabled=true;
helper.textContent=correct?'¡Correcto!':'Incorrecto';
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${score}/${statements.length}</div>
<div class="results-subtitle">${score>=5?'¡Excelente! Estás listo para trabajar seguro':'Repasa estos conceptos antes de empezar'}</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">Tu respuesta: ${a.userAns?'Verdadero':'Falso'} ${a.correct?'✓':'✗'}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-2)">
<div class="result-question">💡 Consejo del supervisor</div>
<div class="result-explanation">Antes de tocar cualquier cable, usa siempre un verificador de ausencia de tensión. "Yo pensaba que estaba cortada" es la frase más peligrosa en este oficio.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual 🔧</div>
<div class="subtitle" id="instruction">Rellena el hueco con la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<p id="sentence"></p>
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Selecciona la opción correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 2_low.png" alt="" loading="lazy">
<script>
const data=[
{sentence:"Para detectar fugas de gas refrigerante utilizo el ___.",blank:"detector de fugas",opts:["detector de fugas","manómetro","termómetro"],ans:0,exp:"El manómetro mide presión y el termómetro temperatura; solo el detector identifica escapes de gas."},
{sentence:"Antes de cargar refrigerante debo ___ el sistema.",blank:"evacuar",opts:["presurizar","evacuar"],ans:1,exp:"Presurizar sirve para pruebas de estanqueidad; evacuar elimina aire y humedad antes de la carga."},
{sentence:"El componente que comprime el gas refrigerante es el ___.",blank:"compresor",opts:["evaporador","compresor","condensador"],ans:1,exp:"El evaporador absorbe calor y el condensador lo libera; el compresor eleva la presión del gas."},
{sentence:"Para medir el vacío del circuito uso el ___.",blank:"vacuómetro",opts:["vacuómetro","manifold"],ans:0,exp:"El manifold conecta mangueras y manómetros; el vacuómetro mide niveles de vacío con precisión."},
{sentence:"El gas refrigerante más común en equipos nuevos es el ___.",blank:"R-410A",opts:["R-22","R-410A","R-32"],ans:1,exp:"El R-22 está prohibido por dañar la capa de ozono; el R-32 es alternativo pero el R-410A sigue siendo el estándar."},
{sentence:"El ___ es donde el refrigerante absorbe calor del ambiente.",blank:"evaporador",opts:["condensador","evaporador"],ans:1,exp:"El condensador libera calor hacia el exterior; el evaporador lo absorbe del espacio a enfriar."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),sentenceEl=document.getElementById('sentence'),optsEl=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
prog.style.width=(idx/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
sentenceEl.innerHTML=d.sentence.replace('___','<u>___</u>');
optsEl.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" onclick="choose(${i})">${o}</button>`).join('');
ensureFits();
}

function choose(i){
const d=data[idx];
const correct=i===d.ans;
answers.push({sentence:d.sentence,blank:d.blank,user:d.opts[i],correct,exp:d.exp});
const btns=optsEl.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{b.disabled=true;if(j===d.ans)b.classList.add('correct');else if(j===i)b.classList.add('incorrect');});
sentenceEl.innerHTML=d.sentence.replace('___',`<u>${d.blank}</u>`);
setTimeout(()=>{idx++;render();},700);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual completado!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.blank+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto: '+a.user:'✗ Tu respuesta: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="tip-box">
<strong>💡 Consejo final:</strong> Dominar la terminología técnica te permite comunicarte con claridad con tu equipo y clientes, evitando errores y ganando confianza profesional.
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

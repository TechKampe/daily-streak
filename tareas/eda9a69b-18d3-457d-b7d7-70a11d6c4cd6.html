
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔍 Caza el Fallo: Errores que Cuestan Caro - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔍 Caza el Fallo</div>
<div class="subtitle" id="subtitle">Encuentra el error en cada escena</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="card" id="sceneCard">
<span class="card-text" id="sceneText">Cargando escena...</span>
</div>
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Toca el ítem que contiene el error</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔍 Supervisor de Calidad</div>
<div class="modal-body">Eres el nuevo supervisor. Revisa el trabajo de cada equipo y detecta el error antes de dar el visto bueno.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const scenes=[
{text:"Instalación eléctrica: cocina con horno de 5500W",items:["Cable de 1.5mm²","Diferencial 30mA","Toma de tierra"],error:0,correct:"Cable de 6mm²",exp:"Un horno de 5500W necesita cable de 6mm². Usar 1.5mm² causa sobrecalentamiento y riesgo de incendio."},
{text:"Trabajo en andamio a 6 metros de altura",items:["Casco de seguridad","Botas con puntera","Guantes de trabajo"],error:0,correct:"Arnés anticaídas",exp:"A más de 2m de altura es obligatorio el arnés anticaídas. El casco no evita la caída."},
{text:"Corte de tubería de cobre para fontanería",items:["Sierra de arco","Lija para rebarbar","Pasta decapante"],error:0,correct:"Cortatubos de cobre",exp:"La sierra de arco deja rebabas internas que causan turbulencias. El cortatubos da un corte limpio."},
{text:"Cliente llama para reclamar por una factura",items:["\"¿Qué quieres ahora?\"","Anotar los datos","Consultar el historial"],error:0,correct:"Saludo profesional",exp:"\"¿Qué quieres ahora?\" es inapropiado. Un saludo cordial es básico en atención al cliente."},
{text:"Purga del radiador que no calienta bien",items:["Abrir válvula de purga","Encender la caldera","Cerrar al salir agua"],error:1,correct:"Apagar caldera primero",exp:"Purgar con la caldera encendida puede introducir más aire. Primero se apaga y se espera."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),sceneText=document.getElementById('sceneText'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=scenes.length){showResults();return}
const s=scenes[idx];
prog.style.width=(idx/scenes.length*100)+'%';
counter.textContent=(idx+1)+'/'+scenes.length;
subtitle.textContent='Escena '+(idx+1)+': Encuentra el error';
sceneText.textContent=s.text;
opts.innerHTML=s.items.map((item,i)=>`<button class="btn-option" onclick="selectItem(${i})">${item}</button>`).join('');
ensureFits();
}

function selectItem(i){
const s=scenes[idx];
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===i)b.classList.add(j===s.error?'correct':'incorrect');
if(j===s.error&&j!==i)b.classList.add('correct');
});
answers.push({scene:s.text,chosen:s.items[i],correct:s.correct,exp:s.exp,wasCorrect:i===s.error});
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.wasCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔍 Revisión Completada</div>
<div class="results-score">${score}/${scenes.length}</div>
<div class="results-subtitle">Errores detectados correctamente</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.wasCorrect?'correct':'incorrect'}">
<div class="result-question">Escena ${i+1}: ${a.scene}</div>
<div class="result-answer">${a.wasCorrect?'✓ Detectaste: '+a.chosen:'✗ Elegiste: '+a.chosen}</div>
<div class="result-explanation"><strong>Error real:</strong> ${a.correct}<br>${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo del Supervisor</div>
<div class="result-explanation">Verifica dos veces antes de validar cualquier trabajo. Un error detectado a tiempo evita accidentes, reclamaciones y costes innecesarios.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

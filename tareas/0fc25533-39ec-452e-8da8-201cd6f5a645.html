
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Seguro o Peligro? ⚡ Desliza tu instinto - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Seguro o Peligro? ⚡</div>
<div class="subtitle" id="subtitle">Desliza tu instinto</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress-bar" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main" id="main">
<div class="tinder-container" id="tinder-container">
<div class="tinder-card" id="tinder-card">
<div class="tinder-card-content" id="card-content"></div>
<div class="tinder-indicators">
<span class="indicator-left">❌ INCORRECTO</span>
<span class="indicator-right">✅ CORRECTO</span>
</div>
</div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Desliza izquierda o derecha para responder</div>
<div class="tinder-buttons">
<button class="btn-option tinder-btn-left" id="btn-incorrect">❌ Incorrecto</button>
<button class="btn-option tinder-btn-right" id="btn-correct">✅ Correcto</button>
</div>
</div>
</div>
<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">🔌 Primer día en la obra</div>
<div class="modal-body">El oficial te pregunta: "¿Esto está bien o mal?" Desliza derecha si es CORRECTO, izquierda si es INCORRECTO.</div>
<div class="modal-actions">
<button class="cta" id="start-btn">¡Empezar!</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const cards=[
{text:"Trabajar con el cuadro sin desconectar",correct:false,exp:"Siempre hay que cortar la corriente antes de manipular el cuadro eléctrico."},
{text:"Usar guantes aislantes antes de tocar cables",correct:true,exp:"Los guantes aislantes son EPIs obligatorios para protegerte de descargas."},
{text:"Usar destornillador metálico sin aislar",correct:false,exp:"Las herramientas deben tener mango aislante para evitar electrocución."},
{text:"Señalizar el cuadro antes de trabajar",correct:true,exp:"La señalización avisa a otros trabajadores del riesgo y evita accidentes."},
{text:"Manipular cables cerca de charcos de agua",correct:false,exp:"El agua conduce electricidad. Nunca trabajes en zonas húmedas sin protección."},
{text:"Verificar ausencia de tensión con polímetro",correct:true,exp:"Comprobar que no hay corriente antes de trabajar es fundamental para tu seguridad."}
];
let idx=0,answers=[],startX=0,currentX=0,isDragging=false;
const scene=document.getElementById('scene'),modal=document.getElementById('modal'),card=document.getElementById('tinder-card'),cardContent=document.getElementById('card-content'),progressBar=document.getElementById('progress-bar'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),btnCorrect=document.getElementById('btn-correct'),btnIncorrect=document.getElementById('btn-incorrect'),container=document.getElementById('tinder-container');

document.getElementById('start-btn').onclick=()=>{modal.classList.remove('active');renderCard();};
btnCorrect.onclick=()=>answer(true);
btnIncorrect.onclick=()=>answer(false);

function renderCard(){
if(idx>=cards.length){showResults();return;}
cardContent.textContent=cards[idx].text;
progressBar.style.width=(idx/cards.length*100)+'%';
counter.textContent=(idx+1)+'/'+cards.length;
card.style.transform='translateX(0) rotate(0deg)';
card.style.opacity='1';
card.classList.remove('swipe-left','swipe-right');
ensureFits();
}

function answer(userAnswer){
const isCorrect=userAnswer===cards[idx].correct;
answers.push({text:cards[idx].text,userAnswer,correctAnswer:cards[idx].correct,isCorrect,exp:cards[idx].exp});
animateSwipe(userAnswer);
}

function animateSwipe(direction){
card.classList.add(direction?'swipe-right':'swipe-left');
setTimeout(()=>{idx++;renderCard();},300);
}

card.addEventListener('touchstart',e=>{if(idx>=cards.length)return;startX=e.touches[0].clientX;isDragging=true;},{passive:true});
card.addEventListener('touchmove',e=>{if(!isDragging)return;currentX=e.touches[0].clientX-startX;const rotate=currentX*0.1;card.style.transform=`translateX(${currentX}px) rotate(${rotate}deg)`;card.style.opacity=Math.max(0.5,1-Math.abs(currentX)/300);},{passive:true});
card.addEventListener('touchend',()=>{if(!isDragging)return;isDragging=false;if(Math.abs(currentX)>80){answer(currentX>0);}else{card.style.transform='translateX(0) rotate(0deg)';card.style.opacity='1';}currentX=0;});

card.addEventListener('mousedown',e=>{if(idx>=cards.length)return;startX=e.clientX;isDragging=true;e.preventDefault();});
document.addEventListener('mousemove',e=>{if(!isDragging)return;currentX=e.clientX-startX;const rotate=currentX*0.1;card.style.transform=`translateX(${currentX}px) rotate(${rotate}deg)`;card.style.opacity=Math.max(0.5,1-Math.abs(currentX)/300);});
document.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;if(Math.abs(currentX)>80){answer(currentX>0);}else{card.style.transform='translateX(0) rotate(0deg)';card.style.opacity='1';}currentX=0;});

function showResults(){
const score=answers.filter(a=>a.isCorrect).length;
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🎉 ¡Reto completado!</div>
<div class="results-score">${score}/${cards.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">${answers.map(a=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.text}</div>
<div class="result-answer">${a.isCorrect?'✓ Acertaste':'✗ Fallaste'} (Era: ${a.correctAnswer?'Correcto':'Incorrecto'})</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}</div>
<div class="results-message">${score>=4?'¡Excelente! Tienes buen ojo para la seguridad eléctrica.':'Repasa las normas de PRL. ¡La seguridad es lo primero!'}</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
<style>
.tinder-container{display:flex;justify-content:center;align-items:center;flex:1;padding:1rem;touch-action:none;}
.tinder-card{background:#fff;border:3px solid #00E6BC;border-radius:16px;padding:1.5rem;width:100%;max-width:300px;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:transform 0.15s ease,opacity 0.15s ease;cursor:grab;user-select:none;}
.tinder-card:active{cursor:grabbing;}
.tinder-card-content{font-size:1.25rem;font-weight:700;color:#1a1a2e;line-height:1.4;}
.tinder-indicators{display:flex;justify-content:space-between;width:100%;margin-top:1rem;font-size:0.75rem;font-weight:600;}
.indicator-left{color:#ff6b6b;}
.indicator-right{color:#00E6BC;}
.tinder-buttons{display:flex;gap:0.75rem;width:100%;}
.tinder-btn-left,.tinder-btn-right{flex:1;font-size:0.9rem;padding:0.75rem 0.5rem;}
.tinder-btn-left{border-color:#ff6b6b;color:#ff6b6b;}
.tinder-btn-left:hover{background:#ff6b6b;color:#fff;}
.tinder-btn-right{border-color:#00E6BC;color:#00E6BC;}
.tinder-btn-right:hover{background:#00E6BC;color:#fff;}
.swipe-left{transform:translateX(-150%) rotate(-30deg)!important;opacity:0!important;transition:transform 0.3s ease,opacity 0.3s ease!important;}
.swipe-right{transform:translateX(150%) rotate(30deg)!important;opacity:0!important;transition:transform 0.3s ease,opacity 0.3s ease!important;}
.results-message{text-align:center;padding:1rem;font-weight:600;color:#1a1a2e;}
</style>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: herramientas del oficio - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="task">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Tu mentor te evalúa. ¡Elige bien!</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const tasks=[
{task:"Apretar un tornillo con cabeza en cruz",tools:["Destornillador de estrella","Destornillador plano","Alicate universal"],ans:0,correct:"Destornillador de estrella",why:"El plano resbala en cruz y el alicate daña la cabeza."},
{task:"Cortar un tubo de PVC de 32mm",tools:["Sierra para metales","Cortatubos de PVC","Alicate de corte"],ans:1,correct:"Cortatubos de PVC",why:"Da corte limpio y recto. La sierra deja rebabas y el alicate aplasta."},
{task:"Pelar el extremo de un cable de 2.5mm²",tools:["Pelacables","Alicate universal","Tijeras"],ans:0,correct:"Pelacables",why:"Corta solo el aislante sin dañar el cobre. Los otros cortan hilos."},
{task:"Aflojar una tuerca hexagonal de 17mm",tools:["Llave fija del 17","Llave inglesa","Alicate universal"],ans:0,correct:"Llave fija del 17",why:"Ajuste exacto sin redondear aristas. La inglesa puede resbalar."},
{task:"Medir exactamente 2.4 metros en una pared",tools:["Flexómetro","Nivel de burbuja","Regla de 30cm"],ans:0,correct:"Flexómetro",why:"Mide distancias largas con precisión. El nivel no mide longitud."},
{task:"Comprobar que un estante está horizontal",tools:["Nivel de burbuja","Flexómetro","Escuadra"],ans:0,correct:"Nivel de burbuja",why:"Indica horizontalidad exacta. Flexómetro mide distancia, no inclinación."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),taskEl=document.getElementById('task'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=tasks.length){showResults();return}
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=(idx/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
opts.innerHTML=t.tools.map((tool,i)=>`<button class="btn-option" data-idx="${i}">${tool}</button>`).join('');
opts.querySelectorAll('.btn-option').forEach(btn=>{
btn.onclick=()=>select(parseInt(btn.dataset.idx));
});
ensureFits();
}

function select(i){
const t=tasks[idx];
const correct=i===t.ans;
if(correct)score++;
answers.push({task:t.task,user:t.tools[i],correct:t.correct,ok:correct,why:t.why});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===i){
b.classList.add(correct?'correct':'incorrect');
b.innerHTML=(correct?'✓ ':'✗ ')+b.textContent;
}
});
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const tips="Consejo: El destornillador correcto evita daños. Los cortatubos dan cortes limpios. Pelacables protege el cobre. Llaves fijas no redondean tuercas. Flexómetro para distancias, nivel para horizontalidad.";
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔧 ¡Evaluación completa!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Herramientas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.ok?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.ok?'✓':'✗'} Tu elección: ${a.user}</div>
<div class="result-explanation"><strong>Correcta:</strong> ${a.correct}. ${a.why}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">${tips}</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

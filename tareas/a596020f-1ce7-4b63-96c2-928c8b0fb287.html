
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Tu primera llamada de cliente - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.chat-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-history{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;animation:fadeIn 0.3s ease}
.chat-bubble.npc{background:#f0f0f0;color:#333;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.player{background:#1a1a1a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-sender{font-size:11px;font-weight:700;margin-bottom:4px;opacity:0.7}
.chat-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;flex-shrink:0}
.chat-row{display:flex;align-items:flex-start;gap:8px}
.chat-row.player{flex-direction:row-reverse}
.chat-row.player .chat-avatar{margin-right:0;margin-left:8px}
.options-container{padding:12px 16px;background:linear-gradient(to top,rgba(255,255,255,1) 80%,rgba(255,255,255,0));display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.chat-option{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all 0.2s}
.chat-option:active{transform:scale(0.98);background:#f5f5f5}
.chat-option.correct{border-color:#4CAF50;background:#E8F5E9}
.chat-option.partial{border-color:#FF9800;background:#FFF3E0}
.chat-option.incorrect{border-color:#f44336;background:#FFEBEE}
.reaction{font-size:12px;padding:6px 10px;border-radius:8px;margin-top:4px;display:inline-block}
.reaction.positive{background:#E8F5E9;color:#2E7D32}
.reaction.neutral{background:#FFF3E0;color:#E65100}
.reaction.negative{background:#FFEBEE;color:#C62828}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.intro-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.intro-card{background:#fff;border-radius:20px;padding:24px;max-width:320px;text-align:center}
.intro-title{font-size:20px;font-weight:700;margin-bottom:12px}
.intro-text{font-size:14px;color:#666;margin-bottom:20px;line-height:1.5}
.intro-btn{background:#FFD54F;color:#1a1a1a;border:none;padding:14px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Tu primera llamada</div>
<div class="subtitle" id="subtitle">Gestiona tu primer cliente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="chat-container">
<div class="chat-history" id="chatHistory"></div>
<div class="options-container" id="optionsContainer"></div>
</div>
<div class="intro-overlay" id="intro">
<div class="intro-card">
<div class="intro-title">🔧 Tu primera llamada</div>
<div class="intro-text">Eres aprendiz de fontanería. Un cliente llama por una fuga. Tu mentor te observa. ¡Demuestra profesionalidad!</div>
<button class="intro-btn" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const AVATARS={mentor:'https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png',cliente:'https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png'};
const turns=[
{messages:[{sender:'Cliente',avatar:AVATARS.cliente,text:'¡Hola! Tengo una fuga en la cocina, el agua no para de salir. ¿Pueden venir?'}],options:[{text:'Buenos días, soy del servicio técnico. ¿Puede describir la fuga?',type:'correct',reaction:'Muy profesional, gracias.',reactionType:'positive'},{text:'Sí claro, ahora vamos para allá.',type:'partial',reaction:'Vale... ¿no quiere saber más?',reactionType:'neutral'},{text:'Uf, otra fuga... ¿dónde es?',type:'incorrect',reaction:'Mmm, no parece muy profesional...',reactionType:'negative'}],feedback:'Un saludo profesional y preguntas iniciales generan confianza desde el primer momento.'},
{messages:[{sender:'Cliente',avatar:AVATARS.cliente,text:'Sale agua por debajo del fregadero. Creo que es la tubería, pero no sé...'}],options:[{text:'¿Ha cerrado la llave de paso? ¿El agua es limpia o sucia?',type:'correct',reaction:'Buena pregunta, déjeme ver...',reactionType:'positive'},{text:'Seguro es el sifón. Vamos para allá.',type:'partial',reaction:'¿No necesita más datos?',reactionType:'neutral'},{text:'Bueno, ya lo veremos cuando lleguemos.',type:'incorrect',reaction:'Me preocupa que no pregunten nada...',reactionType:'negative'}],feedback:'Hacer preguntas técnicas básicas ayuda a preparar herramientas y dar mejor servicio.'},
{messages:[{sender:'Cliente',avatar:AVATARS.cliente,text:'¿Cuánto tardarán en llegar? Es que tengo prisa...'}],options:[{text:'Llegaremos en 30-45 minutos según el tráfico.',type:'correct',reaction:'Perfecto, les espero.',reactionType:'positive'},{text:'En 15 minutos estamos ahí seguro.',type:'partial',reaction:'¿Seguro tan rápido?',reactionType:'neutral'},{text:'Pues cuando podamos, hay más clientes.',type:'incorrect',reaction:'Vaya, qué poca consideración...',reactionType:'negative'}],feedback:'Prometer tiempos realistas evita decepciones. Mejor sorprender llegando antes que fallar.'},
{messages:[{sender:'Mentor',avatar:AVATARS.mentor,text:'Ya llegamos. Recuerda presentarte bien al cliente.'}],options:[{text:'Buenos días, soy Marcos del servicio técnico. ¿Es usted quien llamó?',type:'correct',reaction:'¡Sí, pasen! Qué buena impresión.',reactionType:'positive'},{text:'Hola, venimos por la fuga.',type:'partial',reaction:'Ah, vale... pasen.',reactionType:'neutral'},{text:'¿Dónde está la fuga?',type:'incorrect',reaction:'Ni un saludo... qué maleducado.',reactionType:'negative'}],feedback:'Presentarse con nombre y empresa transmite profesionalidad y seguridad al cliente.'},
{messages:[{sender:'Mentor',avatar:AVATARS.mentor,text:'Buen trabajo arreglando el sifón. Ahora despídete correctamente.'}],options:[{text:'Listo. Revise la llave de paso mensualmente. Aquí tiene mi tarjeta por si necesita algo.',type:'correct',reaction:'¡Muchas gracias! Les recomendaré.',reactionType:'positive'},{text:'Ya está arreglado. Hasta luego.',type:'partial',reaction:'Vale, gracias.',reactionType:'neutral'},{text:'Son 50€. Adiós.',type:'incorrect',reaction:'Vaya, ni una explicación...',reactionType:'negative'}],feedback:'Un cierre con consejos de mantenimiento fideliza clientes y genera recomendaciones.'}
];
let currentTurn=0,answers=[],chatHistory=[];
const historyEl=document.getElementById('chatHistory'),optionsEl=document.getElementById('optionsContainer'),progressEl=document.getElementById('progress'),counterEl=document.getElementById('counter'),subtitleEl=document.getElementById('subtitle');

function startGame(){document.getElementById('intro').style.display='none';renderTurn();}

function addMessage(sender,avatar,text,isPlayer=false){
chatHistory.push({sender,avatar,text,isPlayer});
const row=document.createElement('div');
row.className='chat-row'+(isPlayer?' player':'');
if(!isPlayer&&avatar){const img=document.createElement('img');img.className='chat-avatar';img.src=avatar;img.alt=sender;row.appendChild(img);}
const bubble=document.createElement('div');
bubble.className='chat-bubble '+(isPlayer?'player':'npc');
if(!isPlayer){const senderEl=document.createElement('div');senderEl.className='chat-sender';senderEl.textContent=sender;bubble.appendChild(senderEl);}
const textEl=document.createElement('span');textEl.textContent=text;bubble.appendChild(textEl);
row.appendChild(bubble);
historyEl.appendChild(row);
historyEl.scrollTop=historyEl.scrollHeight;
}

function addReaction(text,type){
const row=document.createElement('div');
row.className='chat-row';
const reaction=document.createElement('div');
reaction.className='reaction '+type;
reaction.textContent=text;
row.appendChild(reaction);
historyEl.appendChild(row);
historyEl.scrollTop=historyEl.scrollHeight;
}

function renderTurn(){
if(currentTurn>=turns.length){showResults();return;}
const turn=turns[currentTurn];
progressEl.style.width=((currentTurn)/turns.length*100)+'%';
counterEl.textContent=(currentTurn+1)+'/'+turns.length;
subtitleEl.textContent='Turno '+(currentTurn+1)+': Elige tu respuesta';
turn.messages.forEach(m=>addMessage(m.sender,m.avatar,m.text));
optionsEl.innerHTML='';
turn.options.forEach((opt,i)=>{
const btn=document.createElement('button');
btn.className='chat-option';
btn.textContent=opt.text;
btn.onclick=()=>selectOption(i);
optionsEl.appendChild(btn);
});
ensureFits();
}

function selectOption(idx){
const turn=turns[currentTurn];
const opt=turn.options[idx];
const btns=optionsEl.querySelectorAll('.chat-option');
btns.forEach((b,i)=>{b.disabled=true;if(i===idx)b.classList.add(opt.type);});
addMessage('Tú',null,opt.text,true);
setTimeout(()=>{
addReaction(opt.reaction,opt.reactionType);
answers.push({turn:currentTurn+1,selected:opt.text,type:opt.type,feedback:turn.feedback});
setTimeout(()=>{currentTurn++;renderTurn();},800);
},500);
}

function showResults(){
setTimeout(()=>{
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const correct=answers.filter(a=>a.type==='correct').length;
const partial=answers.filter(a=>a.type==='partial').length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🎉 ¡Llamada completada!</div>
<div class="results-score">${correct}/5</div>
<div class="results-subtitle">Respuestas óptimas${partial>0?' (+'+partial+' parciales)':''}</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.type==='correct'?'correct':a.type==='partial'?'':'incorrect'}">
<div class="result-question">Turno ${a.turn}</div>
<div class="result-answer">${a.type==='correct'?'✓ Óptima':a.type==='partial'?'◐ Parcial':'✗ Mejorable'}: ${a.selected.substring(0,40)}...</div>
<div class="result-explanation">${a.feedback}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">La comunicación profesional con clientes es tan importante como la habilidad técnica. Un buen trato genera confianza, recomendaciones y clientes fieles.</div>
</div>
</div>
<div class="footer" style="position:sticky;bottom:0;background:#fff;padding:16px;"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){const m=document.querySelector('.main,.content,.board')||scene;document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

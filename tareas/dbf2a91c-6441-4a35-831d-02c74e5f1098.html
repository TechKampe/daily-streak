
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: Herramientas de fontanería - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="taskText">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main"><div class="options" id="options"></div></div>
<div class="footer">
<div class="helper">Elige la herramienta correcta para la tarea</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">🔧 Primer día de ayudante</div>
<div class="modal-body">Tu jefe te pone a prueba: 6 tareas reales de fontanería. Elige la herramienta correcta en cada una.</div>
<div class="modal-actions"><button class="cta" onclick="startGame()">¡Empezar!</button></div>
</div>
</div>

<script>
const tasks=[
{task:"Cortar un tubo de cobre de 15mm",opts:["Cortatubos","Sierra de arco","Alicates"],icons:["","",""],correct:0,why:"El cortatubos hace cortes limpios sin rebabas. La sierra deja virutas y los alicates aplastan el tubo."},
{task:"Apretar un racor de compresión",opts:["Llave inglesa","Llave de tubo","Destornillador"],icons:["🔧","",""],correct:0,why:"La llave inglesa ajusta al tamaño exacto. La de tubo puede marcar el cromado y el destornillador no sirve."},
{task:"Desatascar un sifón de lavabo",opts:["Desatascador","Llave stillson","Soplete"],icons:["🪠","",""],correct:0,why:"El desatascador genera presión para empujar el tapón. La stillson es para tubos y el soplete derretiría el plástico."},
{task:"Medir el diámetro interior de tubería",opts:["Calibre","Metro","Nivel"],icons:["","📏",""],correct:0,why:"El calibre mide diámetros con precisión. El metro mide longitud y el nivel comprueba horizontalidad."},
{task:"Sellar la rosca de un grifo",opts:["Cinta de teflón","Masilla","Silicona"],icons:["","",""],correct:0,why:"El teflón sella roscas metálicas sin dañarlas. La masilla es para desagües y la silicona no resiste presión."},
{task:"Soldar una unión de cobre",opts:["Soplete","Pistola de calor","Soldador eléctrico"],icons:["🔥","",""],correct:0,why:"El soplete alcanza temperatura para fundir estaño/plata. La pistola no llega y el soldador es para electrónica."}
];
let idx=0,score=0,answers=[],blocked=false;
const scene=document.getElementById('scene'),opts=document.getElementById('options'),taskEl=document.getElementById('taskText'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=tasks.length){showResults();return}
blocked=false;
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=(idx/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
opts.innerHTML=t.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${t.icons[i]?t.icons[i]+' ':''}${o}</button>`).join('');
ensureFits();
}

function select(i){
if(blocked)return;
blocked=true;
const t=tasks[idx],correct=i===t.correct;
if(correct)score++;
answers.push({task:t.task,user:t.opts[i],correctTool:t.opts[t.correct],correct,why:t.why});
const btns=opts.querySelectorAll('.btn-option');
btns[i].classList.add(correct?'correct':'incorrect');
btns[i].innerHTML=(correct?'✓ ':'✗ ')+btns[i].textContent;
if(!correct){btns[t.correct].classList.add('correct');btns[t.correct].innerHTML='✓ '+btns[t.correct].textContent;}
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const tips="Consejo: El cortatubos para cobre, llave inglesa para racores, calibre para medir diámetros y teflón para roscas son imprescindibles en tu cinturón.";
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔧 ¡Jornada terminada!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Herramientas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Elegiste: '+a.user+' → Correcta: '+a.correctTool}</div>
<div class="result-explanation">${a.why}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo práctico</div>
<div class="result-explanation">${tips}</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){const m=document.querySelector('.main,.content,.board')||scene;document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

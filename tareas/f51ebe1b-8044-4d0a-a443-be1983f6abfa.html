
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🗂️ ¿Dónde va cada cosa? - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🗂️ ¿Dónde va cada cosa?</div>
<div class="subtitle" id="instruction">Clasifica cada elemento en su categoría</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress-bar" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/8</span>
</div>
</div>
<div class="main">
<div id="item-display"></div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper">Toca la categoría correcta para clasificar</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 2_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="intro-modal">
<div class="modal">
<div class="modal-title">Tu primer día de ayudante</div>
<div class="modal-body">Organiza mentalmente las tareas según su naturaleza: Seguridad, Herramienta o Trato al cliente.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const items = [
{text: "Revisar EPI antes de entrar", category: "Seguridad", exp: "Verificar los Equipos de Protección Individual es obligatorio antes de cualquier trabajo."},
{text: "Llave inglesa", category: "Herramienta", exp: "Es una herramienta ajustable esencial para trabajos de fontanería y mecánica."},
{text: "Saludar al llegar a la obra", category: "Trato al cliente", exp: "La cortesía profesional genera confianza desde el primer momento."},
{text: "Casco de protección", category: "Seguridad", exp: "El casco protege de golpes y caída de objetos en obra."},
{text: "Explicar el presupuesto", category: "Trato al cliente", exp: "La transparencia en costes es clave para la relación profesional."},
{text: "Taladro percutor", category: "Herramienta", exp: "Herramienta eléctrica para perforar materiales duros como hormigón."},
{text: "Señalizar zona de trabajo", category: "Seguridad", exp: "Delimitar el área previene accidentes de terceros."},
{text: "Escuchar la queja del cliente", category: "Trato al cliente", exp: "La escucha activa permite resolver problemas y fidelizar clientes."}
];

const categories = ["Seguridad", "Herramienta", "Trato al cliente"];
let currentIndex = 0;
let answers = [];
let isAnimating = false;

const scene = document.getElementById('scene');
const itemDisplay = document.getElementById('item-display');
const categoriesDiv = document.getElementById('categories');
const progressBar = document.getElementById('progress-bar');
const counter = document.getElementById('counter');
const introModal = document.getElementById('intro-modal');

function startGame() {
    introModal.classList.remove('active');
    renderItem();
}

function renderItem() {
    if (currentIndex >= items.length) {
        showResults();
        return;
    }
    
    const item = items[currentIndex];
    progressBar.style.width = (currentIndex / items.length * 100) + '%';
    counter.textContent = (currentIndex + 1) + '/' + items.length;
    
    itemDisplay.innerHTML = `<div class="results-title" style="font-size:1.4rem;margin:1.5rem 0">${item.text}</div>`;
    
    categoriesDiv.innerHTML = categories.map(cat => 
        `<button class="btn-option" onclick="selectCategory('${cat}')">${cat}</button>`
    ).join('');
    
    ensureFits();
}

function selectCategory(selected) {
    if (isAnimating) return;
    isAnimating = true;
    
    const item = items[currentIndex];
    const isCorrect = selected === item.category;
    
    const buttons = categoriesDiv.querySelectorAll('.btn-option');
    buttons.forEach(btn => {
        if (btn.textContent === selected) {
            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
        }
        if (btn.textContent === item.category && !isCorrect) {
            btn.classList.add('correct');
        }
    });
    
    answers.push({
        text: item.text,
        selected: selected,
        correct: item.category,
        isCorrect: isCorrect,
        exp: item.exp
    });
    
    setTimeout(() => {
        currentIndex++;
        isAnimating = false;
        renderItem();
    }, 600);
}

function showResults() {
    setTimeout(() => {
        document.documentElement.classList.replace('gameplay', 'results');
        scene.classList.replace('gameplay', 'results');
        
        const correctCount = answers.filter(a => a.isCorrect).length;
        
        scene.innerHTML = `
            <div class="results-scroll">
                <div class="results-header">
                    <div class="results-title">¡Clasificación completada!</div>
                    <div class="results-score">${correctCount}/${items.length}</div>
                    <div class="results-subtitle">Elementos bien clasificados</div>
                </div>
                <div class="results-list">
                    ${answers.map(a => `
                        <div class="result-item ${a.isCorrect ? 'correct' : 'incorrect'}">
                            <div class="result-question">${a.text}</div>
                            <div class="result-answer">${a.isCorrect ? '✓ ' + a.correct : '✗ Dijiste: ' + a.selected + ' → ' + a.correct}</div>
                            <div class="result-explanation">${a.exp}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="result-item">
                    <div class="result-question">💡 Consejo profesional</div>
                    <div class="result-explanation">Antes de empezar, prioriza: 1º Seguridad, 2º Herramientas listas, 3º Comunicación clara. Así trabajarás con eficiencia y profesionalidad.</div>
                </div>
                <div class="footer">
                    <button class="cta" onclick="completeTask()">Ver mi recompensa</button>
                </div>
            </div>
        `;
    }, 500);
}

function completeTask() {
    if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
            action: 'TASK_COMPLETED'
        }));
    }
}

function ensureFits() {
    scene.classList.remove('compact', 'compact-xs');
    document.documentElement.style.setProperty('--ui-scale', 1);
    if (scene.scrollHeight > scene.clientHeight) scene.classList.add('compact');
    if (scene.scrollHeight > scene.clientHeight) scene.classList.add('compact-xs');
    if (scene.scrollHeight > scene.clientHeight) {
        document.documentElement.style.setProperty('--ui-scale', Math.max(0.88, scene.clientHeight / scene.scrollHeight));
    }
}

window.addEventListener('load', ensureFits);
window.addEventListener('resize', ensureFits);
window.addEventListener('orientationchange', () => setTimeout(ensureFits, 100));
</script>
</body>
</html>

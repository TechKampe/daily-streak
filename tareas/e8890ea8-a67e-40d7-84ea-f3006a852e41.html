
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Ordena y triunfa - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena y triunfa</div>
<div class="subtitle" id="subtitle">Ordena los pasos correctamente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Arrastra o usa ↑↓ para ordenar</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Tu primera intervención</div>
<div class="modal-body">Eres el nuevo técnico del taller. Ordena cada secuencia de pasos correctamente usando los controles o arrastrando.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Comenzar!</button></div>
</div>
</div>

<script>
const challenges=[
{title:"Bloqueo/Etiquetado (LOTO)",steps:["Cortar suministro eléctrico","Verificar ausencia de tensión","Bloquear el equipo con candado","Realizar el trabajo","Rearmar el sistema"],correct:[0,1,2,3,4],tip:"Nunca trabajes sin verificar ausencia de tensión con un detector homologado."},
{title:"Atención de reclamación",steps:["Escuchar al cliente sin interrumpir","Mostrar empatía y disculparse","Identificar el problema concreto","Proponer solución o alternativa","Confirmar satisfacción del cliente"],correct:[0,1,2,3,4],tip:"Escuchar primero genera confianza y facilita resolver el problema."},
{title:"Colocación de EPI en obra",steps:["Revisar estado del equipo","Colocar calzado de seguridad","Ponerse el arnés (si aplica)","Ajustar casco correctamente","Colocar gafas y guantes"],correct:[0,1,2,3,4],tip:"Un EPI mal colocado o dañado no te protege. Revisa siempre antes de usar."}
];

let idx=0,userAnswers=[],draggedIdx=null,touchStartY=0,touchCurrentY=0,draggedCard=null;
const scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),cta=document.getElementById('cta'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function closeModal(){modal.classList.remove('active');render();}

function render(){
if(idx>=challenges.length){showResults();return;}
const ch=challenges[idx];
const shuffled=shuffle(ch.steps.map((s,i)=>({text:s,origIdx:i})));
prog.style.width=((idx)/challenges.length*100)+'%';
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
subtitle.textContent=ch.title;
helper.textContent="Arrastra o usa ↑↓ para ordenar";
cta.disabled=false;
cta.textContent="Confirmar orden";
cardsEl.innerHTML=shuffled.map((s,i)=>`<div class="card" data-idx="${i}" data-orig="${s.origIdx}" draggable="true">
<span class="card-num">${i+1}</span>
<span class="card-text">${s.text}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveCard(${i},-1)">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveCard(${i},1)">↓</button>
</div>
</div>`).join('');
attachDragListeners();
ensureFits();
}

function moveCard(fromIdx,dir){
const cards=Array.from(cardsEl.children);
const toIdx=fromIdx+dir;
if(toIdx<0||toIdx>=cards.length)return;
const card=cards[fromIdx];
card.style.transition='transform 0.15s';
card.style.transform=`translateY(${dir*60}px)`;
setTimeout(()=>{
card.style.transition='';card.style.transform='';
if(dir<0)cardsEl.insertBefore(card,cards[toIdx]);
else cardsEl.insertBefore(cards[toIdx],card);
updateNumbers();
},150);
}

function updateNumbers(){
Array.from(cardsEl.children).forEach((c,i)=>{c.querySelector('.card-num').textContent=i+1;c.dataset.idx=i;});
}

function attachDragListeners(){
const cards=cardsEl.querySelectorAll('.card');
cards.forEach(card=>{
card.addEventListener('dragstart',onDragStart);
card.addEventListener('dragend',onDragEnd);
card.addEventListener('dragover',onDragOver);
card.addEventListener('drop',onDrop);
card.addEventListener('touchstart',onTouchStart,{passive:false});
card.addEventListener('touchmove',onTouchMove,{passive:false});
card.addEventListener('touchend',onTouchEnd);
});
}

function onDragStart(e){draggedIdx=parseInt(e.target.closest('.card').dataset.idx);e.target.closest('.card').classList.add('dragging');}
function onDragEnd(e){e.target.closest('.card').classList.remove('dragging');draggedIdx=null;}
function onDragOver(e){e.preventDefault();}
function onDrop(e){
e.preventDefault();
const target=e.target.closest('.card');
if(!target)return;
const toIdx=parseInt(target.dataset.idx);
if(draggedIdx===null||draggedIdx===toIdx)return;
const cards=Array.from(cardsEl.children);
const draggedCard=cards[draggedIdx];
if(draggedIdx<toIdx)cardsEl.insertBefore(draggedCard,cards[toIdx].nextSibling);
else cardsEl.insertBefore(draggedCard,cards[toIdx]);
updateNumbers();
}

function onTouchStart(e){
draggedCard=e.target.closest('.card');
if(!draggedCard)return;
draggedCard.classList.add('dragging');
touchStartY=e.touches[0].clientY;
touchCurrentY=touchStartY;
}

function onTouchMove(e){
if(!draggedCard)return;
e.preventDefault();
touchCurrentY=e.touches[0].clientY;
const diff=touchCurrentY-touchStartY;
draggedCard.style.transform=`translateY(${diff}px)`;
draggedCard.style.zIndex='100';
}

function onTouchEnd(e){
if(!draggedCard)return;
draggedCard.classList.remove('dragging');
draggedCard.style.transform='';
draggedCard.style.zIndex='';
const diff=touchCurrentY-touchStartY;
const cards=Array.from(cardsEl.children);
const fromIdx=cards.indexOf(draggedCard);
let toIdx=fromIdx;
if(Math.abs(diff)>40){
const moved=Math.round(diff/60);
toIdx=Math.max(0,Math.min(cards.length-1,fromIdx+moved));
}
if(toIdx!==fromIdx){
if(toIdx>fromIdx)cardsEl.insertBefore(draggedCard,cards[toIdx].nextSibling);
else cardsEl.insertBefore(draggedCard,cards[toIdx]);
updateNumbers();
}
draggedCard=null;touchStartY=0;touchCurrentY=0;
}

cta.onclick=()=>{
const cards=Array.from(cardsEl.querySelectorAll('.card'));
const userOrder=cards.map(c=>parseInt(c.dataset.orig));
const ch=challenges[idx];
const correct=ch.correct.every((v,i)=>v===userOrder[i]);
userAnswers.push({challenge:ch,userOrder,correct});
idx++;
render();
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=userAnswers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Completado!</div>
<div class="results-score">${score}/${challenges.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${userAnswers.map((a,i)=>{
const ch=a.challenge;
const userSteps=a.userOrder.map((oi,j)=>`${j+1}. ${ch.steps[oi]}`).join('<br>');
const correctSteps=ch.correct.map((oi,j)=>`${j+1}. ${ch.steps[oi]}`).join('<br>');
return `<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.correct?'✅':'❌'} ${ch.title}</div>
<div class="result-answer"><strong>Tu orden:</strong><br>${userSteps}</div>
${!a.correct?`<div class="result-answer" style="margin-top:8px;"><strong>✅ Orden correcto:</strong><br>${correctSteps}</div>`:''}
<div class="result-explanation">💡 ${ch.tip}</div>
</div>`;
}).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));}
else if(window.parent!==window){window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');}
else{alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){const m=document.querySelector('.main,.content,.board')||scene;document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();modal.classList.add('active');});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

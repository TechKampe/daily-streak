
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ Conexiones Seguras: ¿Eres un Pro? - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">⚡ Conexiones Seguras</div>
<div class="subtitle" id="question">Cargando...</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress"></i></div>
</div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Tu supervisor te pone a prueba. ¡Demuestra lo que sabes!</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const data=[
{q:"¿Qué color tiene el cable de tierra?",opts:["Azul","Verde/Amarillo","Marrón"],ans:1,exp:"El cable de tierra es verde/amarillo por normativa internacional (IEC 60446)."},
{q:"Antes de tocar un cuadro eléctrico, ¿qué debes hacer?",opts:["Avisar al jefe","Verificar ausencia de tensión","Ponerte casco"],ans:1,exp:"Siempre verifica ausencia de tensión con un detector antes de manipular."},
{q:"¿Qué EPI es básico para trabajos eléctricos?",opts:["Guantes aislantes","Rodilleras","Mascarilla"],ans:0,exp:"Los guantes aislantes protegen contra descargas. Son obligatorios en baja tensión."},
{q:"Si un compañero sufre descarga, ¿qué haces primero?",opts:["Tocarlo para apartarlo","Cortar la corriente","Echarle agua"],ans:1,exp:"Primero corta la corriente. Tocar a la víctima puede electrocutarte también."},
{q:"¿Qué herramienta usas para pelar cables?",opts:["Alicates de corte","Pelacables","Destornillador"],ans:1,exp:"El pelacables evita dañar el conductor. Los alicates pueden cortar hilos."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),qEl=document.getElementById('question'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),helper=document.getElementById('helper');

function render(){
if(idx>=data.length){showResults();return}
const d=data[idx];
qEl.textContent=d.q;
prog.style.width=((idx)/data.length*100)+'%';
counter.textContent=(idx+1)+'/'+data.length;
helper.textContent='Toca la respuesta correcta';
opts.innerHTML='';
opts.style.opacity='0';
setTimeout(()=>{
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})" aria-label="Opción: ${o}">${o}</button>`).join('');
opts.style.opacity='1';
opts.style.transition='opacity 0.3s ease';
ensureFits();
},50);
}

function select(i){
const d=data[idx];
const correct=i===d.ans;
if(correct)score++;
answers.push({q:d.q,correct,exp:d.exp,user:d.opts[i],correctAns:d.opts[d.ans]});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===i)b.classList.add(correct?'correct':'incorrect');
if(j===d.ans&&!correct)b.classList.add('correct');
});
helper.textContent=correct?'¡Correcto!':'Incorrecto';
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const pct=Math.round(score/data.length*100);
let msg='¡Excelente! Estás listo para trabajar.';
if(pct<60)msg='Repasa los conceptos básicos antes de empezar.';
else if(pct<100)msg='¡Buen trabajo! Sigue aprendiendo.';
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">⚡ ¡Prueba completada!</div>
<div class="results-score">${score}/${data.length}</div>
<div class="results-subtitle">${msg}</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${i+1}. ${a.q}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Tu respuesta: '+a.user}</div>
${!a.correct?`<div class="result-answer" style="opacity:0.8">→ Correcta: ${a.correctAns}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">Antes de cualquier trabajo, verifica SIEMPRE la ausencia de tensión. Un segundo de prevención puede salvarte la vida.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();render();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧠 Conecta los Cables: Memory de Seguridad - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:100%;max-width:400px;margin:0 auto}
.memory-card{height:70px;width:100%;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box;transition:transform 0.2s ease,background 0.2s ease}
.memory-card.covered{background:#00E6BC;color:#0B214A;font-size:15px;font-weight:700}
.memory-card.revealed{background:#fff;border:2px solid #0B414A;color:#0B214A;font-size:12px;font-weight:500;line-height:1.2}
.memory-card.matched{background:#d4edda;border:2px solid #28a745;color:#0B214A;font-size:12px;font-weight:500;line-height:1.2}
.memory-card.shake{animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.memory-card.pop{animation:pop 0.2s ease}
@keyframes pop{0%{transform:scale(0.95)}100%{transform:scale(1)}}
.stats-row{display:flex;justify-content:center;gap:16px;font-size:14px;color:#0B214A;margin:8px 0}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🧠 Memory de Seguridad</div>
<div class="subtitle">Empareja cada EPI con su riesgo</div>
</div>
</div>
<div class="stats-row">
<span id="attempts">Intento 0/10</span>
<span id="pairs">0/4 parejas</span>
</div>
<div class="main">
<div class="memory-grid" id="grid"></div>
</div>
<div class="footer">
<div class="helper">Toca dos cartas para emparejarlas</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const pairs=[
{id:1,a:"Guantes aislantes",b:"Descarga eléctrica",exp:"Los guantes aislantes impiden que la corriente pase a través del cuerpo."},
{id:2,a:"Casco",b:"Caída de objetos",exp:"El casco protege el cráneo de impactos por herramientas o materiales."},
{id:3,a:"Gafas protectoras",b:"Proyección partículas",exp:"Las gafas evitan que virutas o chispas dañen los ojos."},
{id:4,a:"Mascarilla FFP2",b:"Inhalación de polvo",exp:"La mascarilla filtra partículas finas y polvo del aire."}
];
let cards=[],first=null,second=null,locked=false,attempts=0,matched=0,results=[];
const grid=document.getElementById('grid'),attemptsEl=document.getElementById('attempts'),pairsEl=document.getElementById('pairs'),scene=document.getElementById('scene');

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function init(){
cards=[];
pairs.forEach(p=>{cards.push({pairId:p.id,text:p.a,type:'a'});cards.push({pairId:p.id,text:p.b,type:'b'})});
shuffle(cards);
grid.innerHTML='';
cards.forEach((c,i)=>{
const div=document.createElement('div');
div.className='memory-card covered';
div.dataset.index=i;
div.textContent='?';
div.onclick=()=>flip(i);
grid.appendChild(div);
});
ensureFits();
}

function flip(i){
if(locked)return;
const card=grid.children[i];
if(card.classList.contains('matched')||card.classList.contains('revealed'))return;
card.classList.remove('covered');
card.classList.add('revealed','pop');
card.textContent=cards[i].text;
if(!first){first={i,card};return}
second={i,card};
locked=true;
attempts++;
attemptsEl.textContent=`Intento ${attempts}/10`;
const p1=cards[first.i],p2=cards[second.i];
if(p1.pairId===p2.pairId&&p1.type!==p2.type){
setTimeout(()=>{
first.card.classList.remove('revealed');
first.card.classList.add('matched');
second.card.classList.remove('revealed');
second.card.classList.add('matched');
matched++;
pairsEl.textContent=`${matched}/4 parejas`;
results.push({pairId:p1.pairId,found:true});
reset();
if(matched===4)endGame(true);
else if(attempts>=10)endGame(false);
},300);
}else{
setTimeout(()=>{
first.card.classList.add('shake');
second.card.classList.add('shake');
},100);
setTimeout(()=>{
first.card.classList.remove('revealed','shake');
first.card.classList.add('covered');
first.card.textContent='?';
second.card.classList.remove('revealed','shake');
second.card.classList.add('covered');
second.card.textContent='?';
reset();
if(attempts>=10)endGame(false);
},2000);
}
}

function reset(){first=null;second=null;locked=false}

function endGame(won){
const foundIds=results.map(r=>r.pairId);
pairs.forEach(p=>{if(!foundIds.includes(p.id))results.push({pairId:p.id,found:false})});
setTimeout(()=>showResults(won),500);
}

function showResults(won){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const title=won?'¡Buen trabajo!':'¡Sigue practicando!';
const subtitle=won?`Encontraste las 4 parejas en ${attempts} intentos`:`Encontraste ${matched}/4 parejas`;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${title}</div>
<div class="results-score">${matched}/4</div>
<div class="results-subtitle">${subtitle}</div>
</div>
<div class="results-list">
${pairs.map(p=>{
const found=results.find(r=>r.pairId===p.id&&r.found);
return `<div class="result-item ${found?'correct':'incorrect'}">
<div class="result-question">${p.a} ↔ ${p.b}</div>
<div class="result-answer">${found?'✓ Pareja encontrada':'✗ No encontrada'}</div>
<div class="result-explanation">${p.exp}</div>
</div>`;
}).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{init();ensureFits()});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
init();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Elige tu arma: Herramientas de fontanería - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Elige tu arma</div>
<div class="subtitle" id="task">Cargando tarea...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Selecciona la herramienta correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">🔧 Tu primer día</div>
<div class="modal-body">Eres el nuevo ayudante de fontanería. Tu jefe te asigna tareas básicas. ¡Elige la herramienta correcta para cada una!</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const tasks=[
{task:"Cortar un tubo de cobre de 15mm",opts:["Cortatubos","Sierra de arco","Alicates"],ans:0,exp:"El cortatubos hace cortes limpios y perpendiculares en tubos de cobre sin rebabas. La sierra deja rebabas que dificultan el sellado. Los alicates no cortan tubos."},
{task:"Apretar un racor de latón en una llave de paso",opts:["Llave inglesa","Llave grifa","Destornillador"],ans:1,exp:"La llave grifa tiene mordazas dentadas ideales para agarrar racores y tubos redondos. La llave inglesa resbala en superficies cilíndricas. El destornillador no sirve para apretar racores."},
{task:"Desatascar un sifón de lavabo obstruido",opts:["Desatascador de ventosa","Sonda flexible","Martillo"],ans:0,exp:"El desatascador crea presión/succión para eliminar obstrucciones. La sonda es para tuberías más largas. El martillo dañaría las tuberías."},
{task:"Soldar una unión de tubería de cobre",opts:["Soplete de gas","Pistola de silicona","Soldador eléctrico"],ans:0,exp:"El soplete funde el estaño para soldar cobre. La silicona no suelda, solo sella. El soldador eléctrico es para electrónica, no alcanza temperatura suficiente."},
{task:"Comprobar que un tubo está horizontal",opts:["Nivel de burbuja","Flexómetro","Escuadra"],ans:0,exp:"El nivel indica si una superficie está horizontal o vertical. El flexómetro solo mide distancias. La escuadra comprueba ángulos de 90°."},
{task:"Sellar la rosca de un grifo para evitar fugas",opts:["Cinta de teflón","Masilla de fontanero","Cinta aislante"],ans:0,exp:"El teflón sella roscas metálicas impidiendo fugas. La masilla es para otros usos como fijación. La cinta aislante es para electricidad y no resiste agua a presión."}
];

let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),taskEl=document.getElementById('task'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

function startGame(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=tasks.length){showResults();return}
const t=tasks[idx];
taskEl.textContent=t.task;
prog.style.width=(idx/tasks.length*100)+'%';
counter.textContent=(idx+1)+'/'+tasks.length;
opts.innerHTML=t.opts.map((o,i)=>`<button class="btn-option" onclick="select(${i})">${o}</button>`).join('');
ensureFits();
}

function select(i){
const btns=opts.querySelectorAll('.btn-option');
const correct=i===tasks[idx].ans;
btns[i].classList.add(correct?'correct':'incorrect');
if(correct)score++;
answers.push({task:tasks[idx].task,user:tasks[idx].opts[i],correctTool:tasks[idx].opts[tasks[idx].ans],correct,exp:tasks[idx].exp,allOpts:tasks[idx].opts});
btns.forEach(b=>b.disabled=true);
setTimeout(()=>{idx++;render();},1000);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Jornada completada!</div>
<div class="results-score">${score}/${tasks.length}</div>
<div class="results-subtitle">Tareas con herramienta correcta</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.task}</div>
<div class="result-answer">${a.correct?'✓ '+a.user:'✗ Elegiste: '+a.user+' → Correcta: '+a.correctTool}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo del jefe</div>
<div class="result-explanation">Cortatubos para cortes limpios en cobre. Llave grifa para racores y tubos. Desatascador para obstrucciones cercanas. Soplete para soldar cobre. Nivel para comprobar horizontalidad. Teflón para sellar roscas.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🗣️ Tu primera llamada con el cliente - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.chat-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-history{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;animation:fadeIn .3s ease}
.chat-bubble.mentor{background:#e8f5e9;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.cliente{background:#fff3e0;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.user{background:#1a1a2e;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-sender{font-weight:700;font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.chat-sender img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.chat-sender.mentor-name{color:#2e7d32}
.chat-sender.cliente-name{color:#e65100}
.response-area{padding:12px;background:rgba(255,255,255,0.95);border-top:1px solid #eee;display:flex;flex-direction:column;gap:8px}
.response-btn{padding:12px 16px;border:2px solid #6c63ff;border-radius:12px;background:#fff;color:#1a1a2e;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-align:left}
.response-btn:active{transform:scale(0.98);background:#6c63ff;color:#fff}
.reaction{padding:8px 12px;background:#f0f4ff;border-radius:8px;font-size:13px;color:#666;margin-top:4px;border-left:3px solid #6c63ff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.progress-dots{display:flex;gap:6px;justify-content:center;padding:8px}
.progress-dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:all .3s}
.progress-dot.active{background:#6c63ff;transform:scale(1.2)}
.progress-dot.completed{background:#4caf50}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🗣️ Tu primera llamada</div>
<div class="subtitle" id="subtitle">Atiende al cliente con profesionalidad</div>
</div>
<div class="progress-row">
<div class="progress-dots" id="progressDots"></div>
<span class="badge" id="counter">Intro</span>
</div>
</div>
<div class="chat-container" id="chatContainer">
<div class="chat-history" id="chatHistory"></div>
<div class="response-area" id="responseArea"></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const AVATARS={
mentor:'https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png',
cliente:'https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png'
};
const TURNS=[
{
messages:[
{from:'mentor',text:'¡Eh, que suena el teléfono! Atiende tú, que yo tengo las manos ocupadas. Es un cliente, trátalo bien.'}
],
options:[
{text:'Buenos días, Climatizaciones Fresco, ¿en qué puedo ayudarle?',score:2,reaction:'👍 El cliente se siente bien atendido desde el primer momento.'},
{text:'¿Sí? ¿Qué quieres?',score:0,reaction:'😬 El cliente se queda desconcertado por el tono informal.'},
{text:'Diga, ¿qué pasa?',score:1,reaction:'🤔 Funciona, pero un saludo más profesional daría mejor imagen.'}
]
},
{
messages:[
{from:'cliente',text:'Hola, mire, llamo porque mi aire acondicionado no enfría nada. Lo enciendo y sale aire, pero templado. Llevo así tres días y con este calor...'}
],
options:[
{text:'Entiendo, debe ser muy incómodo. ¿Me puede decir el modelo del equipo?',score:2,reaction:'👍 Muestras empatía y recoges información útil.'},
{text:'Ya, eso suele pasar cuando no se hace mantenimiento.',score:0,reaction:'😠 El cliente se siente culpado y se pone a la defensiva.'},
{text:'Vale, ¿desde cuándo tiene el equipo instalado?',score:1,reaction:'🤔 Bien preguntar, pero primero conviene mostrar comprensión.'}
]
},
{
messages:[
{from:'cliente',text:'Pues no sé el modelo exacto, es uno de pared blanco... Lo compré hace dos años. ¿No pueden venir a verlo directamente?'}
],
options:[
{text:'Claro, podemos agendar una visita. ¿Qué día le vendría bien?',score:2,reaction:'👍 Ofreces solución sin prometer nada imposible.'},
{text:'Seguro que es el gas, eso lo arreglamos en un momento.',score:0,reaction:'😬 Prometer diagnósticos sin ver el equipo puede generar problemas.'},
{text:'Primero necesito saber el modelo sí o sí.',score:1,reaction:'🤔 Es útil, pero el cliente ya dijo que no lo sabe. Mejor ofrecer visita.'}
]
},
{
messages:[
{from:'cliente',text:'¿El jueves por la tarde podría ser? Salgo del trabajo a las 17h.'}
],
options:[
{text:'Perfecto, le apunto para el jueves a las 17:30. ¿Me confirma su dirección?',score:2,reaction:'👍 Confirmas datos y dejas margen. Muy profesional.'},
{text:'Vale, jueves. Ya te llamamos.',score:0,reaction:'😕 Sin confirmar hora ni datos, el cliente queda inseguro.'},
{text:'El jueves está complicado, ¿no puede otro día?',score:1,reaction:'🤔 A veces toca, pero intenta buscar soluciones antes de poner pegas.'}
]
},
{
messages:[
{from:'cliente',text:'Sí, es Calle Mayor 42, 2ºB. Pregunta por García.'}
],
options:[
{text:'Calle Mayor 42, 2ºB, Sr. García. Jueves 17:30. ¿Algún teléfono de contacto?',score:2,reaction:'👍 Repites los datos para confirmar. Excelente práctica.'},
{text:'Ok, apuntado. Hasta luego.',score:1,reaction:'🤔 Funciona, pero confirmar datos evita errores y da confianza.'},
{text:'Vale, ya lo tengo. Adiós.',score:0,reaction:'😐 Despedida demasiado brusca para un cliente nuevo.'}
]
}
];
let currentTurn=0,chatLog=[],decisions=[];
const chatHistory=document.getElementById('chatHistory');
const responseArea=document.getElementById('responseArea');
const counter=document.getElementById('counter');
const progressDots=document.getElementById('progressDots');
const subtitle=document.getElementById('subtitle');

function initProgressDots(){
progressDots.innerHTML=TURNS.map((_,i)=>`<div class="progress-dot" data-turn="${i}"></div>`).join('');
}

function updateProgress(){
document.querySelectorAll('.progress-dot').forEach((dot,i)=>{
dot.classList.remove('active','completed');
if(i<currentTurn)dot.classList.add('completed');
else if(i===currentTurn)dot.classList.add('active');
});
counter.textContent=currentTurn<TURNS.length?`${currentTurn+1}/${TURNS.length}`:'Final';
}

function addBubble(from,text,isUser=false){
const bubble=document.createElement('div');
bubble.className=`chat-bubble ${isUser?'user':from}`;
if(!isUser){
const senderDiv=document.createElement('div');
senderDiv.className=`chat-sender ${from}-name`;
senderDiv.innerHTML=`<img src="${AVATARS[from]}" alt="${from}">${from==='mentor'?'Mentor':'Cliente'}`;
bubble.appendChild(senderDiv);
}
const textDiv=document.createElement('div');
textDiv.textContent=text;
bubble.appendChild(textDiv);
chatHistory.appendChild(bubble);
chatHistory.scrollTop=chatHistory.scrollHeight;
chatLog.push({from,text,isUser});
}

function addReaction(text){
const reaction=document.createElement('div');
reaction.className='reaction';
reaction.textContent=text;
chatHistory.appendChild(reaction);
chatHistory.scrollTop=chatHistory.scrollHeight;
}

function showOptions(options){
responseArea.innerHTML=options.map((opt,i)=>
`<button class="response-btn" onclick="selectOption(${i})">${opt.text}</button>`
).join('');
}

function selectOption(idx){
const turn=TURNS[currentTurn];
const option=turn.options[idx];
addBubble('user',option.text,true);
decisions.push({turn:currentTurn+1,text:option.text,score:option.score,reaction:option.reaction});
responseArea.innerHTML='';
setTimeout(()=>{
addReaction(option.reaction);
setTimeout(()=>{
currentTurn++;
if(currentTurn<TURNS.length){
renderTurn();
}else{
showResults();
}
},800);
},400);
}

function renderTurn(){
updateProgress();
const turn=TURNS[currentTurn];
let delay=0;
turn.messages.forEach((msg,i)=>{
setTimeout(()=>{
addBubble(msg.from,msg.text);
if(i===turn.messages.length-1){
setTimeout(()=>showOptions(turn.options),300);
}
},delay);
delay+=500;
});
}

function showIntro(){
const modal=document.createElement('div');
modal.className='modal-backdrop active';
modal.innerHTML=`<div class="modal">
<div class="modal-title">📞 Tu primera llamada</div>
<div class="modal-body">Suena el teléfono en la empresa de climatización. Tu mentor te pide que atiendas. ¡Demuestra tu profesionalidad!</div>
<div class="modal-actions"><button class="cta" id="startBtn">Empezar</button></div>
</div>`;
document.body.appendChild(modal);
document.getElementById('startBtn').onclick=()=>{
modal.remove();
initProgressDots();
updateProgress();
renderTurn();
};
}

function showResults(){
setTimeout(()=>{
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const totalScore=decisions.reduce((sum,d)=>sum+d.score,0);
const maxScore=TURNS.length*2;
const percentage=Math.round((totalScore/maxScore)*100);
let rating='🌟';
if(percentage>=80)rating='🌟🌟🌟 ¡Excelente!';
else if(percentage>=50)rating='🌟🌟 Bien, pero puedes mejorar';
else rating='🌟 Necesitas practicar más';
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">📞 Llamada completada</div>
<div class="results-score">${totalScore}/${maxScore}</div>
<div class="results-subtitle">${rating}</div>
</div>
<div class="results-list">
${decisions.map((d,i)=>{
let status=d.score===2?'correct':d.score===1?'':'incorrect';
let icon=d.score===2?'✓':d.score===1?'~':'✗';
let label=d.score===2?'Respuesta ideal':d.score===1?'Aceptable':'Mejorable';
return `<div class="result-item ${status}">
<div class="result-question">Turno ${d.turn}</div>
<div class="result-answer">${icon} ${label}: "${d.text.substring(0,40)}..."</div>
<div class="result-explanation">${d.reaction}</div>
</div>`;
}).join('')}
<div class="result-item" style="background:#e8f5e9;border-left:4px solid #4caf50">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">Una buena primera impresión telefónica genera confianza. Saluda con el nombre de la empresa, escucha sin interrumpir, muestra empatía y siempre confirma los datos. Así fidelizas clientes desde el primer contacto.</div>
</div>
</div>
<div class="footer" style="position:sticky;bottom:0;background:#fff;padding:16px;border-top:1px solid #eee">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.chat-container')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.chat-container')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();showIntro();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

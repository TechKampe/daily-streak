
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Briefing 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Briefing 🔧</div>
<div class="subtitle" id="subtitle">Completa las frases con la opción correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="clozeText" style="font-size:1.1rem;text-align:center;margin-bottom:1.5rem;line-height:1.5"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper" id="helper">Selecciona la palabra correcta para el hueco</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">📋 Tu primer día</div>
<div class="modal-body">El oficial te pide repasar el manual antes de salir a obra. Completa cada frase seleccionando la palabra correcta.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>

<script>
const clozes=[
{sentence:"Antes de trabajar en un cuadro, corto la corriente con el ___.",blank:"interruptor general",opts:["interruptor general","enchufe","cable"],exp:{wrong:{"enchufe":"El enchufe es un punto de conexión, no un elemento de corte.","cable":"El cable conduce electricidad, no la interrumpe."}}},
{sentence:"Para proteger mis ojos de chispas uso ___.",blank:"gafas de seguridad",opts:["gafas de seguridad","guantes","casco"],exp:{wrong:{"guantes":"Los guantes protegen las manos, no los ojos.","casco":"El casco protege la cabeza de impactos, no los ojos."}}},
{sentence:"El color del cable de tierra es ___.",blank:"amarillo-verde",opts:["amarillo-verde","azul","marrón"],exp:{wrong:{"azul":"El azul es el color del neutro según normativa.","marrón":"El marrón es una fase activa, no tierra."}}},
{sentence:"Para medir tensión en un circuito uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","destornillador"],exp:{wrong:{"buscapolos":"El buscapolos detecta presencia de tensión, no la mide.","destornillador":"El destornillador es para apretar tornillos, no medir."}}},
{sentence:"El EPI que protege mis manos de descargas son los ___.",blank:"guantes aislantes",opts:["guantes aislantes","guantes de cuero","guantes de látex"],exp:{wrong:{"guantes de cuero":"El cuero no aísla de la electricidad.","guantes de látex":"El látex fino no ofrece protección eléctrica certificada."}}},
{sentence:"Para saber si un cable tiene tensión sin medirla uso el ___.",blank:"buscapolos",opts:["buscapolos","multímetro","alicate"],exp:{wrong:{"multímetro":"El multímetro mide valores exactos, el buscapolos solo detecta presencia.","alicate":"El alicate es para cortar o sujetar, no detectar tensión."}}}
];

let idx=0,answers=[];
const scene=document.getElementById('scene'),content=document.getElementById('content'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),clozeText=document.getElementById('clozeText'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

modal.classList.add('active');

function startGame(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=clozes.length){showResults();return}
const c=clozes[idx];
prog.style.width=((idx)/clozes.length*100)+'%';
counter.textContent=(idx+1)+'/'+clozes.length;
clozeText.innerHTML=c.sentence.replace('___','<u style="padding:0 8px;font-weight:700;color:var(--accent)">___</u>');
opts.innerHTML=c.opts.map(o=>`<button class="btn-option" onclick="selectOption('${o}')">${o}</button>`).join('');
ensureFits();
}

function selectOption(selected){
const c=clozes[idx];
const correct=selected===c.blank;
answers.push({sentence:c.sentence,blank:c.blank,user:selected,correct,exp:correct?null:c.exp.wrong[selected]});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent===c.blank)b.classList.add('correct');
else if(b.textContent===selected&&!correct)b.classList.add('incorrect');
});
clozeText.innerHTML=c.sentence.replace('___',`<u style="padding:0 8px;font-weight:700;color:${correct?'var(--ok)':'var(--err)'}">${selected}</u>`);
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Briefing completado!</div>
<div class="results-score">${score}/${clozes.length}</div>
<div class="results-subtitle">Frases completadas correctamente</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.blank+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto: '+a.user:'✗ Tu respuesta: '+a.user}</div>
<div class="result-explanation">${a.correct?'¡Perfecto! Conoces bien este término.':a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--accent-soft);border-left:4px solid var(--accent)">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Dominar el vocabulario técnico es clave para comunicarte bien en obra y evitar errores de seguridad. Repasa estos términos a menudo.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual 🔧</div>
<div class="subtitle" id="instruction">Selecciona la palabra correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div id="clozeArea">
<p id="clozeText"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper">Elige la palabra que falta</div>
</div>
</div>
<div class="modal-backdrop" id="introModal">
<div class="modal">
<div class="modal-title">📋 Tu primer día</div>
<div class="modal-body">Tu supervisor te entrega el manual de procedimientos, pero algunas palabras están borradas. ¡Complétalo!</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const clozes=[
{sentence:"Antes de soldar, me pongo la ___.",blank:"careta de soldar",opts:["careta de soldar","gorra","gafas de sol"],exp:"La careta protege de radiación UV y chispas. Las gafas de sol no filtran UV de soldadura."},
{sentence:"Para cortar tubo de cobre uso la ___.",blank:"cortatubos",opts:["cortatubos","sierra de calar","amoladora"],exp:"El cortatubos da cortes limpios sin virutas. La sierra deforma el tubo."},
{sentence:"Al detectar un escape de gas, primero debo ___.",blank:"ventilar la zona",opts:["ventilar la zona","encender la luz","llamar al vecino"],exp:"Ventilar evita acumulación. Encender la luz puede generar chispa."},
{sentence:"Al llegar a una vivienda, lo primero es ___.",blank:"saludar y presentarse",opts:["saludar y presentarse","empezar a trabajar","pedir un café"],exp:"Presentarse genera confianza profesional con el cliente."},
{sentence:"Para medir tensión, uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","destornillador"],exp:"El multímetro mide tensión con precisión. El buscapolos solo detecta presencia de fase."},
{sentence:"Antes de intervenir un circuito, debo ___.",blank:"cortar la corriente",opts:["cortar la corriente","avisar al jefe","preparar las herramientas"],exp:"Cortar la corriente es el primer paso de seguridad obligatorio."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),clozeText=document.getElementById('clozeText'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),introModal=document.getElementById('introModal');

function startGame(){
introModal.classList.remove('active');
render();
}

function render(){
if(idx>=clozes.length){showResults();return}
const c=clozes[idx];
prog.style.width=(idx/clozes.length*100)+'%';
counter.textContent=(idx+1)+'/'+clozes.length;
clozeText.innerHTML=c.sentence.replace('___','<span class="cloze-blank">___</span>');
opts.innerHTML=c.opts.map((o,i)=>`<button class="btn-option" onclick="selectOption(${i})">${o}</button>`).join('');
ensureFits();
}

function selectOption(i){
const c=clozes[idx];
const correct=c.opts[i]===c.blank;
answers.push({sentence:c.sentence,correct:c.blank,user:c.opts[i],isCorrect:correct,exp:c.exp});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===i)b.classList.add(correct?'correct':'incorrect');
if(c.opts[j]===c.blank)b.classList.add('correct');
});
clozeText.innerHTML=c.sentence.replace('___',`<span class="cloze-filled ${correct?'ok':'err'}">${c.opts[i]}</span>`);
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual Completado!</div>
<div class="results-score">${score}/${clozes.length}</div>
<div class="results-subtitle">Frases correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.sentence.replace('___','<strong>'+a.correct+'</strong>')}</div>
<div class="result-answer">${a.isCorrect?'✓ Correcto':'✗ Respondiste: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Usar la terminología correcta evita malentendidos, mejora la seguridad y transmite profesionalidad ante clientes y compañeros.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{introModal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

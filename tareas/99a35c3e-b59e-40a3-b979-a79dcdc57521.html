
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 ¿Herramienta o EPI? Clasifica rápido - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 ¿Herramienta o EPI?</div>
<div class="subtitle">Clasifica cada elemento</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div class="card" id="item-card">
<span class="card-text" id="item-text">Cargando...</span>
</div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper">Toca la categoría correcta para cada elemento</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">📦 ¡Bienvenido al almacén!</div>
<div class="modal-body">Es tu primer día. Organiza el material en dos zonas: EPI (protección) y Herramientas de trabajo.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">¡Empezar!</button>
</div>
</div>
</div>

<script>
const items = [
{name:"Guantes dieléctricos",cat:"EPI",exp:"Protegen contra descargas eléctricas, son equipo de protección."},
{name:"Destornillador",cat:"Herramienta",exp:"Sirve para apretar/aflojar tornillos, es herramienta de trabajo."},
{name:"Casco de seguridad",cat:"EPI",exp:"Protege la cabeza de impactos, es equipo de protección obligatorio."},
{name:"Polímetro",cat:"Herramienta",exp:"Instrumento de medición eléctrica, es herramienta técnica."},
{name:"Gafas de protección",cat:"EPI",exp:"Protegen los ojos de partículas y chispas."},
{name:"Alicates",cat:"Herramienta",exp:"Para cortar y sujetar cables, es herramienta manual."},
{name:"Arnés anticaídas",cat:"EPI",exp:"Protege en trabajos en altura, es equipo de seguridad vital."},
{name:"Nivel láser",cat:"Herramienta",exp:"Para alinear instalaciones, es herramienta de precisión."},
{name:"Botas dieléctricas",cat:"EPI",exp:"Aíslan de corriente eléctrica, son EPI para electricistas."},
{name:"Pelacables",cat:"Herramienta",exp:"Para pelar el aislamiento de cables, es herramienta específica."}
];

let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),itemText=document.getElementById('item-text'),itemCard=document.getElementById('item-card'),cats=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

function startGame(){
modal.classList.remove('active');
render();
}

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
itemText.textContent=item.name;
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
itemCard.classList.remove('correct','incorrect');
cats.innerHTML=`
<button class="btn-option" onclick="classify('EPI')">🛡️ EPI</button>
<button class="btn-option" onclick="classify('Herramienta')">🔧 Herramienta</button>
`;
ensureFits();
}

function classify(choice){
const item=items[idx];
const correct=choice===item.cat;
if(correct)score++;
answers.push({name:item.name,correct,correctCat:item.cat,userCat:choice,exp:item.exp});
itemCard.classList.add(correct?'correct':'incorrect');
const btns=cats.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent.includes(choice))b.classList.add(correct?'correct':'incorrect');
});
setTimeout(()=>{idx++;render();},600);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`
<div class="results-scroll">
<div class="results-header">
<div class="results-title">🎉 ¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`
<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.correctCat:'✗ Dijiste '+a.userCat+', era '+a.correctCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>
`).join('')}
</div>
<div class="result-item">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Antes de empezar cualquier tarea, separa mentalmente lo que te protege de lo que usas para trabajar. ¡La seguridad siempre primero!</div>
</div>
<div class="footer">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

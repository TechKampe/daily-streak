
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Completa el Manual 🔧 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Completa el Manual 🔧</div>
<div class="subtitle" id="instruction">Selecciona la opción correcta</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/6</span>
</div>
</div>
<div class="main">
<div class="content" id="content">
<p id="cloze-text"></p>
<div class="options" id="options"></div>
</div>
</div>
<div class="footer">
<div class="helper">Elige la herramienta o acción correcta</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const clozes=[
{text:"Para medir tensión eléctrica, uso el ___.",blank:"multímetro",opts:["multímetro","buscapolos","pinza amperimétrica"],exp:"El buscapolos solo detecta fase, y la pinza mide corriente, no tensión."},
{text:"Antes de manipular un cuadro eléctrico, corto ___.",blank:"el diferencial",opts:["el diferencial","la luz","el agua"],exp:"Cortar 'la luz' es ambiguo; el diferencial garantiza seguridad total."},
{text:"Para detectar fugas de gas usamos ___.",blank:"detector de gas",opts:["detector de gas","manómetro","multímetro"],exp:"El manómetro mide presión y el multímetro parámetros eléctricos."},
{text:"Para roscar tubería de cobre necesito ___.",blank:"soldadura",opts:["teflón","soldadura","masilla"],exp:"El cobre se une por soldadura; el teflón es para roscas y la masilla para sellados."},
{text:"Para cortar tubo de PVC uso ___.",blank:"cortatubos",opts:["cortatubos","sierra de calar","radial"],exp:"El cortatubos da un corte limpio; sierra y radial son excesivos para PVC."},
{text:"Para verificar continuidad en un cable uso ___.",blank:"multímetro",opts:["multímetro","buscapolos","nivel láser"],exp:"Solo el multímetro tiene función de continuidad; los otros no miden eso."}
];
let idx=0,score=0,answers=[];
const scene=document.getElementById('scene'),content=document.getElementById('content'),opts=document.getElementById('options'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),clozeText=document.getElementById('cloze-text');

function render(){
if(idx>=clozes.length){showResults();return}
const c=clozes[idx];
prog.style.width=(idx/clozes.length*100)+'%';
counter.textContent=(idx+1)+'/'+clozes.length;
clozeText.innerHTML=c.text.replace('___','<u class="cloze-blank">___</u>');
opts.innerHTML=c.opts.map(o=>`<button class="btn-option" onclick="selectOpt(this,'${o}')">${o}</button>`).join('');
ensureFits();
}

function selectOpt(btn,opt){
const c=clozes[idx];
const correct=opt===c.blank;
if(correct)score++;
answers.push({text:c.text,blank:c.blank,user:opt,correct,exp:c.exp,opts:c.opts});
opts.querySelectorAll('.btn-option').forEach(b=>{
b.disabled=true;
if(b.textContent===c.blank)b.classList.add('correct');
else if(b===btn&&!correct)b.classList.add('incorrect');
});
clozeText.querySelector('.cloze-blank').innerHTML='<strong>'+c.blank+'</strong>';
clozeText.querySelector('.cloze-blank').classList.add(correct?'correct':'incorrect');
setTimeout(()=>{idx++;render();},900);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Manual completado!</div>
<div class="results-score">${score}/${clozes.length}</div>
<div class="results-subtitle">Respuestas correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.text.replace('___','<strong>'+a.blank+'</strong>')}</div>
<div class="result-answer">${a.correct?'✓ Correcto':'✗ Tu respuesta: '+a.user}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo final</div>
<div class="result-explanation">Dominar el vocabulario técnico te ayuda a comunicarte con claridad en obra y evitar errores costosos.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

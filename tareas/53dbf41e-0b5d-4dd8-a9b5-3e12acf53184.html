
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Herramienta o EPI? 🛠️ - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">¿Herramienta o EPI? 🛠️</div>
<div class="subtitle">Clasifica cada elemento en su categoría</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progress" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/10</span>
</div>
</div>
<div class="main">
<div id="item-display"></div>
<div class="options" id="categories"></div>
</div>
<div class="footer">
<div class="helper">Toca la categoría correcta para cada elemento</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar 1_low.png" alt="" loading="lazy">
<script>
const items=[
{name:"Guantes aislantes",cat:"EPI",exp:"Protegen las manos de descargas eléctricas."},
{name:"Destornillador",cat:"Herramienta",exp:"Sirve para apretar o aflojar tornillos."},
{name:"Casco de seguridad",cat:"EPI",exp:"Protege la cabeza de golpes y caídas de objetos."},
{name:"Polímetro",cat:"Herramienta",exp:"Mide tensión, corriente y resistencia eléctrica."},
{name:"Gafas de seguridad",cat:"EPI",exp:"Protegen los ojos de partículas y salpicaduras."},
{name:"Alicates",cat:"Herramienta",exp:"Sirven para cortar y sujetar cables."},
{name:"Chaleco reflectante",cat:"EPI",exp:"Aumenta la visibilidad del trabajador."},
{name:"Cinta aislante",cat:"Herramienta",exp:"Aísla empalmes y protege conexiones."},
{name:"Botas de seguridad",cat:"EPI",exp:"Protegen los pies de golpes y descargas."},
{name:"Nivel láser",cat:"Herramienta",exp:"Proyecta líneas para alinear instalaciones."}
];
const categories=["Herramienta","EPI"];
let idx=0,answers=[];
const scene=document.getElementById('scene'),itemDisplay=document.getElementById('item-display'),catsEl=document.getElementById('categories'),prog=document.getElementById('progress'),counter=document.getElementById('counter');

function render(){
if(idx>=items.length){showResults();return}
const item=items[idx];
prog.style.width=((idx)/items.length*100)+'%';
counter.textContent=(idx+1)+'/'+items.length;
itemDisplay.innerHTML=`<div class="brand" style="font-size:1.5rem;text-align:center;margin-bottom:1rem;">${item.name}</div>`;
catsEl.innerHTML=categories.map(c=>`<button class="btn-option" onclick="selectCat('${c}')">${c}</button>`).join('');
ensureFits();
}

function selectCat(cat){
const item=items[idx];
const correct=cat===item.cat;
const btns=catsEl.querySelectorAll('.btn-option');
btns.forEach(b=>{
b.disabled=true;
if(b.textContent===item.cat)b.classList.add('correct');
if(b.textContent===cat&&!correct)b.classList.add('incorrect');
});
answers.push({name:item.name,user:cat,correct,rightCat:item.cat,exp:item.exp});
setTimeout(()=>{idx++;render();},600);
}

function showResults(){
setTimeout(()=>{
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.correct).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Almacén organizado!</div>
<div class="results-score">${score}/${items.length}</div>
<div class="results-subtitle">Clasificaciones correctas</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${a.name}</div>
<div class="result-answer">${a.correct?'✓ '+a.rightCat:'✗ Dijiste '+a.user+' → '+a.rightCat}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
</div>
<div class="result-item" style="background:var(--surface-alt,#f5f5f5);margin-top:1rem;">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">Antes de empezar tu jornada, revisa que tienes todos los EPIs puestos y las herramientas necesarias a mano. Organiza mentalmente: lo que te protege va contigo, lo que usas para trabajar va en el cinturón o caja.</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.style.setProperty('--ui-scale',1);
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact');
if(scene.scrollHeight>scene.clientHeight)scene.classList.add('compact-xs');
if(scene.scrollHeight>scene.clientHeight){
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,scene.clientHeight/scene.scrollHeight));
}
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
render();
</script>
</body>
</html>

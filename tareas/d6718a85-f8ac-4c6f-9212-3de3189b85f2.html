
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu primera satisfacción de cliente 💬 - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
.chat-container{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-history{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.chat-bubble.npc{background:#f0f0f0;color:#333;align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.player{background:#1a1a1a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-sender{font-size:11px;font-weight:700;margin-bottom:4px;opacity:0.7}
.chat-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px}
.chat-row{display:flex;align-items:flex-start;gap:8px}
.chat-row.player{flex-direction:row-reverse}
.chat-row.player .chat-avatar{margin-right:0;margin-left:8px}
.response-area{padding:12px 16px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
.response-btn{width:100%;padding:14px 16px;margin-bottom:8px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all 0.2s}
.response-btn:last-child{margin-bottom:0}
.response-btn:active{background:#f5f5f5;border-color:#ccc}
.reaction{font-size:12px;color:#666;font-style:italic;padding:4px 14px}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">Tu primera satisfacción 💬</div>
<div class="subtitle" id="subtitle">Cierre profesional con cliente</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">0/5</span>
</div>
</div>
<div class="chat-container" id="chatContainer">
<div class="chat-history" id="chatHistory"></div>
<div class="response-area" id="responseArea"></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png" alt="" loading="lazy">
<script>
const avatars={
mentor:'https://techkampe.github.io/daily-streak/assets/Avatar%201_low.png',
cliente:'https://techkampe.github.io/daily-streak/assets/Avatar%204_low.png'
};
const turns=[
{messages:[
{sender:'Doña Carmen',avatar:'cliente',text:'¡Ay, hijo! Ya has terminado. Oye, ¿me puedes explicar qué has hecho exactamente? Es que yo de esto no entiendo nada...'}
],options:[
{text:'He cambiado el enchufe viejo por uno nuevo con toma de tierra.',score:2,reaction:'Doña Carmen asiente con alivio'},
{text:'Pues lo típico, señora. Quitar lo viejo y poner lo nuevo.',score:0,reaction:'Doña Carmen frunce el ceño, algo confundida'},
{text:'He sustituido el mecanismo y verificado las conexiones. ¿Quiere que le enseñe?',score:2,reaction:'Doña Carmen sonríe interesada'}
]},
{messages:[
{sender:'Doña Carmen',avatar:'cliente',text:'¿Y esto es seguro? Es que me da miedo que haya un cortocircuito o algo...'}
],options:[
{text:'Tranquila, he comprobado que todo está bien conectado y con protección.',score:2,reaction:'Doña Carmen respira aliviada'},
{text:'Sí, sí, no se preocupe.',score:1,reaction:'Doña Carmen asiente, aunque no muy convencida'},
{text:'Bueno, nunca se sabe, pero debería estar bien.',score:0,reaction:'Doña Carmen se pone nerviosa'}
]},
{messages:[
{sender:'Mentor (WhatsApp)',avatar:'mentor',text:'¿Cómo va? Recuerda explicarle el precio con claridad 👍'},
{sender:'Doña Carmen',avatar:'cliente',text:'Por cierto, ¿cuánto te debo? Es que otro electricista me cobró menos la última vez...'}
],options:[
{text:'Son 45€. Incluye mano de obra, material de calidad y garantía del trabajo.',score:2,reaction:'Doña Carmen valora la explicación'},
{text:'Pues si quiere llame al otro, yo cobro lo que cobro.',score:0,reaction:'Doña Carmen se siente ofendida'},
{text:'Son 45€, pero si le parece mucho puedo bajar un poco...',score:1,reaction:'Doña Carmen duda de la profesionalidad'}
]},
{messages:[
{sender:'Doña Carmen',avatar:'cliente',text:'Está bien, hijo. Oye, ¿y si tengo algún problema luego, a quién llamo?'}
],options:[
{text:'Aquí le dejo mi tarjeta. Cualquier duda, me llama sin compromiso.',score:2,reaction:'Doña Carmen guarda la tarjeta sonriendo'},
{text:'Pues ya buscará a alguien, yo tengo muchos trabajos.',score:0,reaction:'Doña Carmen se queda decepcionada'},
{text:'Puede llamar a la empresa, ellos le pasan el aviso.',score:1,reaction:'Doña Carmen asiente, algo impersonal'}
]},
{messages:[
{sender:'Doña Carmen',avatar:'cliente',text:'Muchas gracias, ¿eh? Que tengas buen día. ¡Eres muy majo!'}
],options:[
{text:'Gracias a usted, Doña Carmen. Ha sido un placer. ¡Cuídese!',score:2,reaction:'Doña Carmen se despide encantada'},
{text:'Venga, adiós.',score:0,reaction:'Doña Carmen se queda con sensación fría'},
{text:'De nada. Si necesita algo más, ya sabe.',score:1,reaction:'Doña Carmen asiente educadamente'}
]}
];
let currentTurn=0,answers=[],chatHistory=document.getElementById('chatHistory'),responseArea=document.getElementById('responseArea');

function addBubble(sender,avatar,text,isPlayer=false){
const row=document.createElement('div');
row.className='chat-row'+(isPlayer?' player':'');
if(!isPlayer){
const img=document.createElement('img');
img.className='chat-avatar';
img.src=avatars[avatar]||avatars.cliente;
img.alt=sender;
row.appendChild(img);
}
const bubble=document.createElement('div');
bubble.className='chat-bubble'+(isPlayer?' player':' npc');
if(!isPlayer){
const senderEl=document.createElement('div');
senderEl.className='chat-sender';
senderEl.textContent=sender;
bubble.appendChild(senderEl);
}
const textEl=document.createElement('span');
textEl.textContent=text;
bubble.appendChild(textEl);
row.appendChild(bubble);
chatHistory.appendChild(row);
chatHistory.scrollTop=chatHistory.scrollHeight;
}

function addReaction(text){
const r=document.createElement('div');
r.className='reaction';
r.textContent=text;
chatHistory.appendChild(r);
chatHistory.scrollTop=chatHistory.scrollHeight;
}

function updateProgress(){
document.getElementById('progress').style.width=(currentTurn/turns.length*100)+'%';
document.getElementById('counter').textContent=currentTurn+'/'+turns.length;
}

function renderTurn(){
if(currentTurn>=turns.length){showResults();return}
const turn=turns[currentTurn];
turn.messages.forEach(m=>addBubble(m.sender,m.avatar,m.text));
responseArea.innerHTML='';
turn.options.forEach((opt,i)=>{
const btn=document.createElement('button');
btn.className='response-btn';
btn.textContent=opt.text;
btn.onclick=()=>selectOption(i);
responseArea.appendChild(btn);
});
updateProgress();
}

function selectOption(i){
const turn=turns[currentTurn];
const opt=turn.options[i];
addBubble('Tú','player',opt.text,true);
addReaction(opt.reaction);
answers.push({turn:currentTurn+1,question:turn.messages[turn.messages.length-1].text,chosen:opt.text,score:opt.score,reaction:opt.reaction});
currentTurn++;
responseArea.innerHTML='<div style="text-align:center;padding:16px;color:#666">Continuando...</div>';
setTimeout(renderTurn,800);
}

function showResults(){
setTimeout(()=>{
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const total=answers.reduce((a,b)=>a+b.score,0);
const max=turns.length*2;
let grade='Mejorable';
if(total>=8)grade='¡Excelente!';
else if(total>=6)grade='Bien hecho';
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">${grade}</div>
<div class="results-score">${total}/${max}</div>
<div class="results-subtitle">Puntos de profesionalidad</div>
</div>
<div class="results-list">
${answers.map(a=>`<div class="result-item ${a.score===2?'correct':a.score===1?'':'incorrect'}">
<div class="result-question">Turno ${a.turn}: ${a.question.substring(0,40)}...</div>
<div class="result-answer">${a.score===2?'✓ Excelente':a.score===1?'◐ Mejorable':'✗ Inadecuado'}</div>
<div class="result-explanation">${getExplanation(a.turn,a.score)}</div>
</div>`).join('')}
<div class="result-item" style="background:#f0f7ff;border-left:4px solid #2196F3">
<div class="result-question">💡 Consejo profesional</div>
<div class="result-explanation">La satisfacción del cliente empieza con una explicación clara, sigue con un precio justificado y termina con una despedida que invite a volver a llamarte. ¡Eso fideliza!</div>
</div>
</div>
<div class="footer" style="position:sticky;bottom:0;background:#fff;padding:16px;border-top:1px solid #eee">
<button class="cta" onclick="completeTask()">Ver mi recompensa</button>
</div>
</div>`;
},500);
}

function getExplanation(turn,score){
const exp={
1:{2:'Explicar el trabajo en términos sencillos genera confianza.',1:'Una respuesta corta deja dudas.',0:'Respuestas vagas hacen que el cliente desconfíe.'},
2:{2:'Transmitir seguridad sin tecnicismos tranquiliza al cliente.',1:'Respuestas escuetas no eliminan el miedo.',0:'Nunca generes más dudas de las que resuelves.'},
3:{2:'Justificar el precio con valor añadido es profesional.',1:'Rebajar sin que te lo pidan resta credibilidad.',0:'Ponerse a la defensiva espanta clientes.'},
4:{2:'Dejar contacto directo fideliza y muestra compromiso.',1:'Derivar a la empresa es correcto pero impersonal.',0:'Rechazar el seguimiento es perder un cliente para siempre.'},
5:{2:'Una despedida cálida y personalizada deja huella positiva.',1:'Correcto pero olvidable.',0:'Las despedidas frías anulan todo el buen trabajo previo.'}
};
return exp[turn]?.[score]||'';
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const scene=document.getElementById('scene');
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
const scene=document.getElementById('scene');
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

function showIntro(){
addBubble('Mentor (WhatsApp)','mentor','¡Ey! Acabo de ver que terminaste la instalación. La clienta es Doña Carmen, muy maja pero pregunta mucho. Tú tranquilo, responde con claridad y profesionalidad. ¡Tú puedes! 💪');
setTimeout(renderTurn,1500);
}

window.addEventListener('load',()=>{ensureFits();showIntro();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

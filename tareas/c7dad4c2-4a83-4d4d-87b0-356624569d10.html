
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔍 Caza el Fallo: Obra en Marcha - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔍 Caza el Fallo</div>
<div class="subtitle" id="sceneDesc">Cargando escena...</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><div class="bar"><i id="progress"></i></div></div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper">Toca el elemento incorrecto</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop active" id="modal">
<div class="modal">
<div class="modal-title">🔍 Caza el Fallo</div>
<div class="modal-body">Eres supervisor junior en una obra. Revisa cada escena y detecta el error tocando el elemento incorrecto.</div>
<div class="modal-actions">
<button class="cta" onclick="startGame()">Comenzar</button>
</div>
</div>
</div>

<script>
const scenes=[
{desc:"Electricista trabajando en cuadro eléctrico con tensión",
items:["Destornillador aislado","Sin guantes aislantes","Comprobador de tensión","Botas de seguridad"],
error:1,correct:"Guantes aislantes",exp:"Manipular cuadros con tensión sin guantes aislantes es un riesgo grave de electrocución según normativa PRL."},
{desc:"Albañil preparando mezcla de mortero en la obra",
items:["Arena fina","Cemento Portland","Proporción 1:10 cemento-arena","Agua limpia"],
error:2,correct:"Proporción 1:3 o 1:4",exp:"La proporción 1:10 es incorrecta. El mortero estándar usa 1:3 o 1:4 (cemento:arena) para garantizar resistencia."},
{desc:"Zona de excavación en acceso principal de la obra",
items:["Cascos obligatorios","Vallas perimetrales","Sin señalización de peligro","Iluminación nocturna"],
error:2,correct:"Señalización de peligro",exp:"Toda zona de riesgo debe tener señalización visible. Es obligatorio por PRL y evita accidentes."},
{desc:"Fontanero cortando tuberías de cobre en el sótano",
items:["Cortatubos de cobre","Gafas de protección","Lijadora angular para cortar","Guantes de trabajo"],
error:2,correct:"Cortatubos o sierra específica",exp:"La lijadora angular no es adecuada para cortar cobre: genera rebabas y riesgo de proyecciones."},
{desc:"Escalera de mano apoyada para acceder a forjado",
items:["Ángulo de 75°","Apoyada en superficie estable","Sin sobresalir del punto de acceso","Operario con arnés"],
error:2,correct:"Sobresalir 1m del punto de acceso",exp:"La escalera debe sobresalir al menos 1 metro por encima del punto de desembarco para un agarre seguro."}
];
let idx=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),descEl=document.getElementById('sceneDesc'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),modal=document.getElementById('modal');

function startGame(){modal.classList.remove('active');render();}

function render(){
if(idx>=scenes.length){showResults();return}
const s=scenes[idx];
descEl.textContent=s.desc;
prog.style.width=(idx/scenes.length*100)+'%';
counter.textContent=(idx+1)+'/'+scenes.length;
opts.innerHTML=s.items.map((item,i)=>`<button class="btn-option" onclick="selectItem(${i})">${item}</button>`).join('');
ensureFits();
}

function selectItem(i){
const s=scenes[idx];
const btns=opts.querySelectorAll('.btn-option');
btns.forEach(b=>b.disabled=true);
btns[i].classList.add(i===s.error?'correct':'incorrect');
if(i!==s.error)btns[s.error].classList.add('correct');
answers.push({desc:s.desc,chosen:s.items[i],correct:s.items[s.error],isCorrect:i===s.error,exp:s.exp,correctAlt:s.correct});
setTimeout(()=>{idx++;render();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const score=answers.filter(a=>a.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">🔍 Inspección completada</div>
<div class="results-score">${score}/${scenes.length}</div>
<div class="results-subtitle">Errores detectados correctamente</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">Escena ${i+1}: ${a.desc}</div>
<div class="result-answer">${a.isCorrect?'✓ Detectaste: '+a.chosen:'✗ Elegiste: '+a.chosen}</div>
<div class="result-answer">Error real: ${a.correct} → ${a.correctAlt}</div>
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item">
<div class="result-question">💡 Consejo del supervisor</div>
<div class="result-explanation">La atención al detalle salva vidas en obra. Antes de actuar, observa, verifica y pregunta si algo no cuadra.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',ensureFits);
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

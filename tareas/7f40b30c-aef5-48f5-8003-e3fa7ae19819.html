
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ Voltios a prueba: ¿Dominas lo básico? - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">⚡ Voltios a prueba</div>
<div class="subtitle" id="question">Cargando pregunta...</div>
</div>
<div class="progress-row">
<div class="bar-wrap">
<span class="bar-label">Progreso</span>
<div class="bar"><i id="progressBar" style="width:0%"></i></div>
</div>
<span class="badge" id="counter">1/5</span>
</div>
</div>
<div class="main">
<div class="options" id="options"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Tu supervisor evalúa tus conocimientos</div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">

<div class="modal-backdrop" id="introModal">
<div class="modal">
<div class="modal-title">⚡ Primera semana de aprendiz</div>
<div class="modal-body">Tu supervisor quiere evaluar tus conocimientos básicos. Responde 5 preguntas sobre electricidad.</div>
<div class="modal-actions">
<button class="cta" onclick="startQuiz()">¡Comenzar!</button>
</div>
</div>
</div>

<script>
const quizData=[
{q:"¿Qué tipo de corriente hay en un enchufe doméstico?",opts:["Corriente alterna (CA)","Corriente continua (CC)","Corriente mixta"],ans:0,exp:"Los enchufes domésticos usan corriente alterna a 230V. Las pilas y baterías usan continua."},
{q:"¿Para qué sirve el interruptor diferencial?",opts:["Proteger contra sobrecargas","Detectar fugas y evitar electrocución","Medir el consumo eléctrico"],ans:1,exp:"El diferencial detecta fugas de corriente y corta el circuito, protegiendo a las personas."},
{q:"¿De qué color es el cable de tierra según normativa?",opts:["Azul","Marrón o negro","Verde y amarillo"],ans:2,exp:"El cable de tierra siempre es verde/amarillo. Es tu conexión de seguridad obligatoria."},
{q:"¿En qué unidad se mide la intensidad eléctrica?",opts:["Voltios (V)","Amperios (A)","Vatios (W)"],ans:1,exp:"La intensidad se mide en Amperios. Los Voltios miden tensión y los Vatios miden potencia."},
{q:"¿Qué herramienta detecta tensión sin contacto?",opts:["Buscapolos o detector de tensión","Alicates de corte","Destornillador plano"],ans:0,exp:"El buscapolos detecta tensión sin tocar cables. Úsalo SIEMPRE antes de manipular un circuito."}
];

let currentIdx=0,score=0,answers=[];
const scene=document.getElementById('scene'),opts=document.getElementById('options'),qEl=document.getElementById('question'),progBar=document.getElementById('progressBar'),counter=document.getElementById('counter'),helper=document.getElementById('helper'),introModal=document.getElementById('introModal');

function startQuiz(){
introModal.classList.remove('active');
renderQuestion();
}

function renderQuestion(){
if(currentIdx>=quizData.length){showResults();return}
const d=quizData[currentIdx];
qEl.textContent=d.q;
progBar.style.width=((currentIdx)/quizData.length*100)+'%';
counter.textContent=(currentIdx+1)+'/'+quizData.length;
helper.textContent='Toca la respuesta correcta';
opts.innerHTML=d.opts.map((o,i)=>`<button class="btn-option" aria-label="Opción: ${o}" onclick="selectAnswer(${i})">${o}</button>`).join('');
ensureFits();
}

function selectAnswer(i){
const d=quizData[currentIdx];
const correct=i===d.ans;
if(correct)score++;
answers.push({q:d.q,opts:d.opts,userIdx:i,ansIdx:d.ans,correct,exp:d.exp});
const btns=opts.querySelectorAll('.btn-option');
btns.forEach((b,j)=>{
b.disabled=true;
if(j===d.ans)b.classList.add('correct');
else if(j===i&&!correct)b.classList.add('incorrect');
});
helper.textContent=correct?'✓ ¡Correcto!':'✗ Respuesta incorrecta';
setTimeout(()=>{currentIdx++;renderQuestion();},800);
}

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const pct=Math.round(score/quizData.length*100);
let msg=pct>=80?'¡Excelente base teórica!':pct>=60?'Buen nivel, sigue practicando':'Repasa los conceptos básicos';
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">⚡ Evaluación completada</div>
<div class="results-score">${score}/${quizData.length}</div>
<div class="results-subtitle">${msg}</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.correct?'correct':'incorrect'}">
<div class="result-question">${i+1}. ${a.q}</div>
<div class="result-answer">${a.correct?'✓ '+a.opts[a.ansIdx]:'✗ Tu respuesta: '+a.opts[a.userIdx]}</div>
${!a.correct?`<div class="result-answer" style="opacity:0.8">Correcta: ${a.opts[a.ansIdx]}</div>`:''}
<div class="result-explanation">${a.exp}</div>
</div>`).join('')}
<div class="result-item" style="background:var(--surface-alt)">
<div class="result-question">💡 Consejo de seguridad</div>
<div class="result-explanation">Antes de tocar cualquier cable, SIEMPRE verifica con el buscapolos que no hay tensión. Tu vida vale más que cualquier prisa.</div>
</div>
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{introModal.classList.add('active');ensureFits();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

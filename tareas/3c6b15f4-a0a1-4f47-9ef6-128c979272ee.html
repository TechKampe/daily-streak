
<!DOCTYPE html>
<html lang="es" class="gameplay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🔧 Primero lo primero: Ordena y domina - Kämpe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://techkampe.github.io/daily-streak/assets/css/daily_tasks.css">
<style>
html.results body{overflow:visible!important;overscroll-behavior:auto!important}
html.force-scroll{overflow-y:auto!important;height:auto!important;position:static!important}
html.force-scroll body{overflow:visible!important;height:auto!important;position:static!important;overscroll-behavior:auto!important}
html.force-scroll .main,html.force-scroll .content,html.force-scroll .board{overflow:visible;touch-action:auto}
html.force-scroll .scene.gameplay{height:auto;max-height:none;overflow:visible}
</style>
</head>
<body>
<div class="scene gameplay" id="scene">
<div class="hud">
<div class="hud-titles">
<div class="brand">🔧 Ordena y domina</div>
<div class="subtitle" id="subtitle">Demuestra que conoces los protocolos</div>
</div>
<div class="progress-row">
<div class="bar-wrap"><span class="bar-label">Progreso</span><div class="bar"><i id="progress" style="width:0%"></i></div></div>
<span class="badge" id="counter">Reto 1/3</span>
</div>
</div>
<div class="main">
<div class="cards" id="cards"></div>
</div>
<div class="footer">
<div class="helper" id="helper">Ordena los pasos con ↑↓ o arrastrando</div>
<button class="cta" id="cta">Confirmar orden</button>
</div>
</div>
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-title">🔧 Tu primer día en el taller</div>
<div class="modal-body">Tu supervisor te observa. Ordena 3 secuencias de pasos correctamente para demostrar que dominas los protocolos básicos.</div>
<div class="modal-actions"><button class="cta" onclick="closeModal()">¡Empezar!</button></div>
</div>
</div>
<img class="avatar" src="https://techkampe.github.io/daily-streak/assets/Avatar%202_low.png" alt="" loading="lazy">
<script>
const challenges=[
{title:"Preparar herramienta eléctrica",steps:["Revisar cable y clavija","Verificar interruptor apagado","Conectar a corriente","Probar en vacío","Comenzar trabajo"],correct:[0,1,2,3,4],tip:"Siempre revisa visualmente la herramienta antes de conectarla."},
{title:"Reportar incidencia al supervisor",steps:["Asegurar la zona afectada","Documentar con fotos","Informar al supervisor","Completar parte escrito","Esperar instrucciones"],correct:[0,1,2,3,4],tip:"Documenta antes de informar: las pruebas son clave."},
{title:"Organizar puesto al inicio de jornada",steps:["Revisar orden de trabajo","Verificar EPIs disponibles","Preparar herramientas necesarias","Despejar zona de trabajo","Confirmar con el equipo"],correct:[0,1,2,3,4],tip:"La preparación evita el 80% de los accidentes."}
];
let idx=0,answers=[],draggedEl=null,dragStartY=0,dragStartTime=0;
const scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),cta=document.getElementById('cta'),prog=document.getElementById('progress'),counter=document.getElementById('counter'),subtitle=document.getElementById('subtitle'),helper=document.getElementById('helper'),modal=document.getElementById('modal');

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function closeModal(){modal.classList.remove('active');render();}
function showModal(){modal.classList.add('active');}

function render(){
if(idx>=challenges.length){showResults();return;}
const ch=challenges[idx];
subtitle.textContent=ch.title;
prog.style.width=((idx)/challenges.length*100)+'%';
counter.textContent=`Reto ${idx+1}/${challenges.length}`;
helper.textContent='Ordena los pasos con ↑↓ o arrastrando';
const shuffled=shuffle(ch.steps.map((s,i)=>({text:s,origIdx:i})));
cardsEl.innerHTML=shuffled.map((s,i)=>`<div class="card" data-idx="${i}" draggable="true">
<span class="card-num">${i+1}</span>
<span class="card-text">${s.text}</span>
<div class="card-controls">
<button class="btn-ghost" aria-label="Subir" onclick="moveCard(${i},-1)">↑</button>
<button class="btn-ghost" aria-label="Bajar" onclick="moveCard(${i},1)">↓</button>
</div>
</div>`).join('');
setupDrag();
ensureFits();
}

function getOrder(){return Array.from(cardsEl.querySelectorAll('.card .card-text')).map(el=>el.textContent);}
function updateNumbers(){cardsEl.querySelectorAll('.card').forEach((c,i)=>{c.querySelector('.card-num').textContent=i+1;c.dataset.idx=i;});}

function moveCard(i,dir){
const cards=Array.from(cardsEl.children);
const newI=i+dir;
if(newI<0||newI>=cards.length)return;
const card=cards[i];
card.style.transition='transform 0.2s';
card.style.transform=`translateY(${dir*60}px)`;
setTimeout(()=>{
card.style.transition='';card.style.transform='';
if(dir<0)cardsEl.insertBefore(card,cards[newI]);
else cardsEl.insertBefore(cards[newI],card);
updateNumbers();
},150);
}

function setupDrag(){
const cards=cardsEl.querySelectorAll('.card');
cards.forEach(card=>{
card.addEventListener('pointerdown',onDragStart);
card.addEventListener('pointermove',onDragMove);
card.addEventListener('pointerup',onDragEnd);
card.addEventListener('pointercancel',onDragEnd);
});
}

function onDragStart(e){
if(e.target.closest('.card-controls'))return;
draggedEl=e.currentTarget;
draggedEl.classList.add('dragging');
draggedEl.setPointerCapture(e.pointerId);
dragStartY=e.clientY;
dragStartTime=Date.now();
}

function onDragMove(e){
if(!draggedEl)return;
const dy=e.clientY-dragStartY;
draggedEl.style.transform=`translateY(${dy}px)`;
draggedEl.style.zIndex=10;
}

function onDragEnd(e){
if(!draggedEl)return;
const dy=e.clientY-dragStartY;
const elapsed=Math.max(Date.now()-dragStartTime,1);
const velocity=Math.abs(dy)/elapsed;
const cards=Array.from(cardsEl.children);
const currentIdx=cards.indexOf(draggedEl);
let newIdx=currentIdx;
const threshold=40;
const velThreshold=0.4;
if(Math.abs(dy)>threshold||velocity>velThreshold){
const steps=Math.max(1,Math.round(Math.abs(dy)/50));
if(dy<0)newIdx=Math.max(0,currentIdx-steps);
else newIdx=Math.min(cards.length-1,currentIdx+steps);
}
draggedEl.style.transition='transform 0.2s';
draggedEl.style.transform='';
draggedEl.style.zIndex='';
setTimeout(()=>{
draggedEl.style.transition='';
if(newIdx!==currentIdx){
if(newIdx<currentIdx)cardsEl.insertBefore(draggedEl,cards[newIdx]);
else if(newIdx<cards.length-1)cardsEl.insertBefore(draggedEl,cards[newIdx+1]);
else cardsEl.appendChild(draggedEl);
updateNumbers();
}
draggedEl.classList.remove('dragging');
draggedEl=null;
},200);
}

cta.onclick=()=>{
const ch=challenges[idx];
const userOrder=getOrder();
const correctOrder=ch.correct.map(i=>ch.steps[i]);
const isCorrect=JSON.stringify(userOrder)===JSON.stringify(correctOrder);
answers.push({title:ch.title,userOrder,correctOrder,isCorrect,tip:ch.tip});
idx++;
if(idx<challenges.length){
cardsEl.innerHTML='';
setTimeout(render,300);
}else{
showResults();
}
};

function showResults(){
setTimeout(()=>{
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
document.documentElement.classList.replace('gameplay','results');
scene.classList.replace('gameplay','results');
const correct=answers.filter(a=>a.isCorrect).length;
scene.innerHTML=`<div class="results-scroll">
<div class="results-header">
<div class="results-title">¡Evaluación completada!</div>
<div class="results-score">${correct}/${answers.length}</div>
<div class="results-subtitle">Secuencias correctas</div>
</div>
<div class="results-list">
${answers.map((a,i)=>`<div class="result-item ${a.isCorrect?'correct':'incorrect'}">
<div class="result-question">${a.isCorrect?'✅':'❌'} Reto ${i+1}: ${a.title}</div>
<div class="result-answer"><strong>Tu orden:</strong><br>${a.userOrder.map((s,j)=>`${j+1}. ${s}`).join('<br>')}</div>
${!a.isCorrect?`<div class="result-answer" style="margin-top:8px;color:var(--ok)"><strong>✅ Orden correcto:</strong><br>${a.correctOrder.map((s,j)=>`${j+1}. ${s}`).join('<br>')}</div>`:''}
<div class="result-explanation">💡 ${a.tip}</div>
</div>`).join('')}
</div>
<div class="footer"><button class="cta" onclick="completeTask()">Ver mi recompensa</button></div>
</div>`;
},500);
}

function completeTask(){
if(window.ReactNativeWebView){
window.ReactNativeWebView.postMessage(JSON.stringify({action:'TASK_COMPLETED'}));
}else if(window.parent!==window){
window.parent.postMessage(JSON.stringify({action:'TASK_COMPLETED'}),'*');
}else{
alert('No se pudo registrar la tarea. Ciérrala y vuelve a abrirla desde la app.');
}
}

function overflows(){
const m=document.querySelector('.main,.content,.board')||scene;
return m.scrollHeight>m.clientHeight+1||scene.scrollHeight>scene.clientHeight+1;
}

function ensureFits(){
scene.classList.remove('compact','compact-xs');
document.documentElement.classList.remove('force-scroll');
document.documentElement.style.setProperty('--ui-scale',1);
if(overflows())scene.classList.add('compact');
if(overflows())scene.classList.add('compact-xs');
if(overflows()){
const m=document.querySelector('.main,.content,.board')||scene;
document.documentElement.style.setProperty('--ui-scale',Math.max(0.88,m.clientHeight/m.scrollHeight));
}
if(overflows())document.documentElement.classList.add('force-scroll');
}

window.addEventListener('load',()=>{ensureFits();showModal();});
window.addEventListener('resize',ensureFits);
window.addEventListener('orientationchange',()=>setTimeout(ensureFits,100));
</script>
</body>
</html>

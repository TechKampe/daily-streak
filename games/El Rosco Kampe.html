<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El Rosco Kämpe</title>
<style>
  :root{
    --blue-deep:#051433;
    --blue-bg:#0A2A66;
    --tile:#1C6BD6;
    --tile-dark:#0D3F9E;
    --orange:#F59B0B;
    --orange-light:#FFC246;
    --green:#2FB54C;
    --green-dark:#1E8E38;
    --red:#E04338;
    --red-dark:#B02A21;
    --white:#FFFFFF;
    --ink:#0A1B3D;
  }
  *{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(120vmax 120vmax at 50% -20%, #14459e 0%, var(--blue-bg) 45%, var(--blue-deep) 100%);
    color:var(--white);
    min-height:100%;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  /* subtle studio spotlights */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(40vmax 20vmax at 15% 0%, rgba(255,255,255,.06), transparent 70%),
      radial-gradient(40vmax 20vmax at 85% 0%, rgba(255,255,255,.06), transparent 70%);
  }
  #fx{position:fixed; inset:0; pointer-events:none; z-index:9}

  .app{
    position:relative; z-index:1;
    height:100dvh;
    display:flex; flex-direction:column;
    padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
  }

  /* ===== header ===== */
  .topbar{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 6px;
  }
  .title-sm{
    font-weight:900; font-size:14px; letter-spacing:.14em;
    color:var(--orange-light);
  }
  .clock.penalty{ animation:penaltyFlash .9s ease; }
  @keyframes penaltyFlash{ 0%,60%{background:#8a1d15; border-color:#ff8d81} 100%{background:rgba(0,0,0,.35)} }
  .penalty-float{
    position:absolute; right:14px; top:34px;
    font-weight:900; font-size:20px; color:#FF7A6B;
    text-shadow:0 2px 4px rgba(0,0,0,.6);
    animation:floatUp 1.3s ease-out both;
    pointer-events:none;
  }
  @keyframes floatUp{ from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-28px)} }
  .clock{
    font-variant-numeric:tabular-nums;
    font-weight:900; font-size:18px;
    background:rgba(0,0,0,.35);
    border:2px solid rgba(255,255,255,.25);
    border-radius:99px;
    padding:4px 14px;
  }

  /* ===== rosco ring ===== */
  .rosco-wrap{
    position:relative;
    width:min(92vw, 46dvh, 440px);
    aspect-ratio:1;
    margin:6px auto 0;
    flex:none;
  }
  .tile{
    position:absolute;
    width:11.5%; aspect-ratio:1;
    border-radius:50%;
    display:grid; place-items:center;
    font-weight:900; font-size:clamp(13px,3.4vw,19px);
    color:#fff;
    background:radial-gradient(circle at 32% 28%, #4a93ec, var(--tile) 55%, var(--tile-dark));
    border:2px solid rgba(255,255,255,.65);
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.25);
    transform:translate(-50%,-50%);
    transition:background .25s, transform .25s, box-shadow .25s;
  }
  .tile.current{
    background:radial-gradient(circle at 32% 28%, #ffd97a, var(--orange) 55%, #c67b06);
    transform:translate(-50%,-50%) scale(1.28);
    box-shadow:0 0 18px rgba(245,155,11,.9), 0 3px 8px rgba(0,0,0,.45);
    animation:tilePulse 1.1s ease-in-out infinite;
    z-index:2;
  }
  @keyframes tilePulse{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25)} }
  .tile.ok{
    background:radial-gradient(circle at 32% 28%, #6fe08a, var(--green) 55%, var(--green-dark));
  }
  .tile.ko{
    background:radial-gradient(circle at 32% 28%, #f08078, var(--red) 55%, var(--red-dark));
  }
  /* center of the ring */
  .ring-center{
    position:absolute; inset:22%;
    border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.08), rgba(0,0,0,.25));
    border:2px solid rgba(255,255,255,.15);
  }
  .ring-center .big-letter{
    font-size:clamp(44px,13vw,74px); font-weight:900; line-height:1;
    text-shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.4);
  }
  .ring-center .qcount{
    font-size:12px; font-weight:800; letter-spacing:.18em;
    color:rgba(255,255,255,.7); margin-top:6px;
  }

  /* ===== question + answers ===== */
  .qa{
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    gap:10px;
    padding-top:12px;
  }
  .question{
    background:linear-gradient(180deg, #ffffff, #e9eefc);
    color:var(--ink);
    border-radius:14px;
    border:3px solid var(--orange);
    box-shadow:0 6px 0 rgba(0,0,0,.3);
    padding:12px 16px;
    font-size:clamp(15px,4.2vw,20px); font-weight:800; line-height:1.3;
    text-align:center;
    text-wrap:balance;
    min-height:3.6em;
    display:grid; place-items:center;
  }
  .answers{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .ans{
    min-width:0; overflow-wrap:break-word;
    font:inherit; cursor:pointer;
    background:linear-gradient(180deg, #2f6fd0, #16408f);
    color:#fff;
    border:2px solid rgba(255,255,255,.55);
    border-radius:12px;
    padding:12px 10px;
    font-size:clamp(13px,3.8vw,17px); font-weight:800; line-height:1.2;
    box-shadow:0 4px 0 rgba(0,0,0,.35);
    transition:transform .08s, filter .12s;
    min-height:3.2em;
  }
  .ans:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
  .ans.right{ background:linear-gradient(180deg, #4ecf6b, var(--green-dark)); border-color:#d8ffe1; }
  .ans.wrong{ background:linear-gradient(180deg, #ef6a5f, var(--red-dark)); border-color:#ffd9d5; animation:ansShake .4s; }
  .ans.faded{ opacity:.35; }
  @keyframes ansShake{ 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} }

  /* ===== screens (start / final) ===== */
  .screen{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px;
    background:
      radial-gradient(120vmax 120vmax at 50% -20%, #14459e 0%, var(--blue-bg) 45%, var(--blue-deep) 100%);
  }
  .screen .logo{ height:min(84px,12vh); margin-bottom:18px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
    animation:pop .6s cubic-bezier(.2,1.3,.4,1) both, bob 3.4s ease-in-out .7s infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes pop{ from{opacity:0; transform:scale(.75)} to{opacity:1; transform:scale(1)} }
  .screen h1{
    font-size:clamp(38px,10vw,64px); font-weight:900; line-height:.95;
    text-shadow:0 3px 0 var(--orange), 0 6px 0 rgba(0,0,0,.35), 0 12px 26px rgba(0,0,0,.5);
    animation:pop .55s .1s both;
  }
  .screen .sub{
    margin-top:14px; max-width:420px;
    font-size:clamp(15px,4vw,18px); font-weight:700; line-height:1.45;
    color:rgba(255,255,255,.85);
    animation:fadeUp .5s .3s both;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  .name-input{
    margin-top:22px;
    font:inherit; font-weight:800; font-size:18px; text-align:center;
    background:rgba(255,255,255,.95); color:var(--ink);
    border:3px solid var(--orange); border-radius:12px;
    padding:12px 16px; width:min(300px,80vw);
    animation:fadeUp .5s .4s both;
  }
  .name-input:focus{ outline:3px solid var(--orange-light); }
  .btn{
    margin-top:16px;
    font:inherit; cursor:pointer;
    font-size:19px; font-weight:900; letter-spacing:.02em;
    color:#5a3403;
    background:linear-gradient(180deg, var(--orange-light), var(--orange) 60%, #c67b06);
    border:2px solid #ffe6b3; border-radius:14px;
    padding:14px 40px;
    box-shadow:0 5px 0 #8a5604, 0 10px 18px -6px rgba(245,155,11,.55);
    animation:fadeUp .5s .5s both;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #8a5604; }
  .btn:disabled{ opacity:.4; filter:grayscale(.7); cursor:not-allowed; }
  .btn:disabled:active{ transform:none; }

  /* final result */
  .result-card{
    margin-top:18px;
    background:linear-gradient(180deg, #ffffff, #e9eefc);
    color:var(--ink);
    border:3px solid var(--orange);
    border-radius:18px;
    box-shadow:0 8px 0 rgba(0,0,0,.3);
    padding:18px 28px;
    animation:pop .5s .25s both;
  }
  .result-card .rname{ font-size:clamp(20px,6vw,28px); font-weight:900; }
  .result-card .rscore{
    font-size:clamp(40px,12vw,60px); font-weight:900; line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .result-card .rtime{
    font-size:clamp(16px,4.6vw,22px); font-weight:800;
    font-variant-numeric:tabular-nums; color:#4a5878;
  }
  .recap{
    margin-top:14px; max-width:440px; width:100%;
    max-height:26dvh; overflow-y:auto;
    text-align:left; font-size:14px; line-height:1.5;
    background:rgba(0,0,0,.3); border-radius:12px; padding:12px 16px;
    animation:fadeUp .5s .5s both;
  }
  .recap b{ color:var(--orange-light); }
  .again{
    margin-top:12px; font-size:13px; font-weight:700;
    color:rgba(255,255,255,.55); text-decoration:underline;
    background:none; border:none; cursor:pointer;
    font-family:inherit;
  }

  /* ===== event modal ===== */
  .modal-back{
    position:fixed; inset:0; z-index:20;
    background:rgba(3,8,22,.75);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation:fadeIn .25s both;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .modal{
    position:relative;
    width:min(400px,92vw);
    min-height:280px;
    background:linear-gradient(180deg, #ffffff, #eef2fd);
    color:var(--ink);
    border:4px solid var(--orange);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    padding:24px 22px 90px;
    text-align:center;
    animation:modalIn .45s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes modalIn{ from{opacity:0; transform:scale(.8) translateY(20px)} to{opacity:1; transform:none} }
  .modal .m-emoji{ font-size:54px; line-height:1; margin-bottom:12px; }
  .modal .m-emoji img{ height:110px; }
  .modal .m-title{ font-size:20px; font-weight:900; line-height:1.3; text-wrap:balance; }
  .modal .m-text{ margin-top:10px; font-size:16px; font-weight:600; line-height:1.4; color:#3c4a6b; text-wrap:balance; }
  .modal .m-btn{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    font:inherit; cursor:pointer;
    font-size:17px; font-weight:900;
    color:#5a3403;
    background:linear-gradient(180deg, var(--orange-light), var(--orange) 60%, #c67b06);
    border:2px solid #ffe6b3; border-radius:12px;
    padding:12px 34px;
    box-shadow:0 4px 0 #8a5604;
    transition:left .15s, bottom .15s;
    white-space:nowrap;
  }
  .modal .m-btn:active{ transform:translateX(-50%) translateY(2px); }
  .modal .m-btn.free{ transition:left .12s ease-out, top .12s ease-out; }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app" id="app" style="visibility:hidden">
  <div class="topbar">
    <div class="title-sm">EL ROSCO KÄMPE <span style="opacity:.45;font-size:10px">v4</span></div>
    <div class="clock" id="clock">0:00</div>
  </div>
  <div class="rosco-wrap" id="rosco">
    <div class="ring-center">
      <div class="big-letter" id="bigLetter"></div>
      <div class="qcount" id="qcount"></div>
    </div>
  </div>
  <div class="qa">
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
  </div>
</div>
<div id="overlay"></div>

/* eventos: tras responder la letra en posición N (1-based) */
const EVENTS = {

     text:'… Falsa alarma: era Fer calentando la campana.', btn:'Seguir' },

/* ============================================================ */

const app      = document.getElementById('app');
const overlay  = document.getElementById('overlay');
const rosco    = document.getElementById('rosco');
const bigLetter= document.getElementById('bigLetter');
const qcount   = document.getElementById('qcount');
const questionEl=document.getElementById('question');
const answersEl= document.getElementById('answers');
const clockEl  = document.getElementById('clock');

let playerName='';
let idx=0;
let hits=0;
let times=[];          // ms per question
let fails=[];          // {l, correct}
let qStart=0;
let eventMs=0, evStart=0;   // los diálogos SÍ cuentan: son trampas
let answering=false;
let tiles=[];

const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(ms){
  const t=Math.round(ms/1000);
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
}

/* ---- build ring ---- */
function buildRing(){
  tiles.forEach(t=>t.remove()); tiles=[];
  const n=QUESTIONS.length;
  QUESTIONS.forEach((q,i)=>{
    const ang=-Math.PI/2 + (i/n)*Math.PI*2;
    const d=document.createElement('div');
    d.className='tile';
    d.textContent=q.l;
    d.style.left=(50+44*Math.cos(ang))+'%';
    d.style.top =(50+44*Math.sin(ang))+'%';
    rosco.appendChild(d);
    tiles.push(d);
  });
}

/* ---- clock ---- */
function totalMs(){
  let t=times.reduce((a,b)=>a+b,0)+eventMs;
  if(qStart) t+=performance.now()-qStart;
  if(evStart) t+=performance.now()-evStart;
  return t;
}
setInterval(()=>{ if(app.style.visibility!=='hidden') clockEl.textContent=fmt(totalMs()); },250);

/* ---- gameplay ---- */
function showQuestion(){
  const q=QUESTIONS[idx];
  tiles.forEach((t,i)=>t.classList.toggle('current', i===idx));
  bigLetter.textContent=q.l;
  qcount.textContent=(idx+1)+' / '+QUESTIONS.length;
  questionEl.textContent='Con la '+q.l+': '+q.def;
  answersEl.innerHTML=q.opts.map((o,i)=>
    `<button class="ans" data-i="${i}">${esc(o)}</button>`).join('');
  [...answersEl.querySelectorAll('.ans')].forEach(b=>{
    b.addEventListener('click',()=>answer(+b.dataset.i));
  });
  answering=true;
  qStart=performance.now();
}

function answer(i){
  if(!answering) return;
  answering=false;
  times.push(performance.now()-qStart); qStart=0;
  const q=QUESTIONS[idx];
  const btns=[...answersEl.querySelectorAll('.ans')];
  const correct = i===q.ok;
  btns.forEach((b,bi)=>{
    if(bi===q.ok) b.classList.add(correct?'right':'right');
    else if(bi===i) b.classList.add('wrong');
    else b.classList.add('faded');
  });
  if(correct){
    hits++;
    tiles[idx].classList.add('ok');
    burstAt(tiles[idx]);
  } else {
    tiles[idx].classList.add('ko');
    fails.push({l:q.l, correct:q.opts[q.ok]});
    times[times.length-1]+=10000; // penalización por fallo
    clockEl.classList.remove('penalty'); void clockEl.offsetWidth; clockEl.classList.add('penalty');
    const p=document.createElement('div');
    p.className='penalty-float'; p.textContent='+10s';
    clockEl.parentElement.appendChild(p);
    setTimeout(()=>p.remove(), 1400);
  }
  tiles[idx].classList.remove('current');
  setTimeout(()=>{
    const pos=idx+1;
    idx++;
    const next=()=>{ (idx>=QUESTIONS.length)? showFinal() : showQuestion(); };
    if(EVENTS[pos] && idx<QUESTIONS.length){ showEvent(EVENTS[pos], next); }
    else next();
  }, reduce? 60 : 850);
}

/* ---- events: el reloj SIGUE corriendo — los diálogos hacen perder tiempo a propósito ---- */
function showEvent(ev, done){
  evStart=performance.now();
  const emoji = ev.emoji==='oso'
    ? `<img src="${OSO}" alt="oso">`
    : esc(ev.emoji);
  overlay.innerHTML=`
    <div class="modal-back">
      <div class="modal" id="modal">
        <div class="m-emoji">${emoji}</div>
        <div class="m-title">${esc(ev.title)}</div>
        ${ev.text? `<div class="m-text">${esc(ev.text)}</div>`:''}
        <button class="m-btn" id="mbtn">${esc(ev.btn)}</button>
      </div>
    </div>`;
  const btn=document.getElementById('mbtn');
  const modal=document.getElementById('modal');

  if(ev.dodge){
    let dodges=0, armedAt=0;
    const flee=(e)=>{
      if(dodges>=3) return;
      e.preventDefault(); e.stopPropagation();
      dodges++;
      btn.classList.add('free');
      btn.style.transform='none';
      const mw=modal.clientWidth, mh=modal.clientHeight;
      const bw=btn.offsetWidth, bh=btn.offsetHeight;
      const x=10+Math.random()*(mw-bw-20);
      const y=60+Math.random()*(mh-bh-80);
      btn.style.left=x+'px';
      btn.style.top=y+'px';
      btn.style.bottom='auto';
      if(dodges===3){ btn.textContent='No me interesa'; armedAt=performance.now(); }
    };
    btn.addEventListener('pointerdown',(e)=>{
      if(dodges<3){ flee(e); }
    });
    btn.addEventListener('click',(e)=>{
      // ignore any click within 700ms of arming: kills same-gesture and ghost clicks on all devices
      if(dodges<3 || performance.now()-armedAt<700){ e.preventDefault(); return; }
      close();
    });
  } else {
    btn.addEventListener('click', close);
  }
  function close(){
    eventMs+=performance.now()-evStart; evStart=0;
    overlay.innerHTML='';
    done();
  }
}

/* ---- screens ---- */
function showStart(){
  app.style.visibility='hidden';
  overlay.innerHTML=`
    <div class="screen">
      <img class="logo" src="${LOGO}" alt="Kämpe">
      <h1>EL ROSCO<br>KÄMPE</h1>
      <div class="sub">15 letras sobre nuestra casa. Gana quien acierte más en menos tiempo. Cada fallo suma 10 segundos.</div>
      <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="Tu nombre" autocomplete="off">
      <button class="btn" id="startBtn" disabled>¡Empezar!</button>
    </div>`;
  const input=document.getElementById('nameInput');
  const startBtn=document.getElementById('startBtn');
  input.addEventListener('input',()=>{ startBtn.disabled = input.value.trim().length===0; });
  startBtn.addEventListener('click',()=>{
    if(input.value.trim().length===0) return;
    playerName=input.value.trim();
    overlay.innerHTML='';
    startGame();
  });
}
function startGame(){
  idx=0; hits=0; times=[]; fails=[]; eventMs=0; evStart=0;
  buildRing();
  app.style.visibility='visible';
  showQuestion();
}
function showFinal(){
  app.style.visibility='hidden';
  const total=times.reduce((a,b)=>a+b,0)+eventMs;
  const avg=total/QUESTIONS.length;
  const recap = fails.length
    ? `<div class="recap">${fails.map(f=>`<b>${esc(f.l)}</b> → ${esc(f.correct)}`).join('<br>')}</div>`
    : `<div class="recap" style="text-align:center">🏆 ¡Rosco perfecto!</div>`;
  overlay.innerHTML=`
    <div class="screen">
      <h1 style="font-size:clamp(30px,8vw,48px)">¡ROSCO COMPLETADO!</h1>
      <div class="result-card">
        <div class="rname">${esc(playerName)}</div>
        <div class="rscore">${hits} / ${QUESTIONS.length}</div>
        <div class="rtime">⏱ ${fmt(total)} · ${(avg/1000).toFixed(1)}s por letra</div>
      </div>
      ${recap}
      <div class="sub" style="animation-delay:.6s">Enseña esta pantalla para el ranking 📱</div>
      <button class="again" id="againBtn">volver a jugar</button>
    </div>`;
  document.getElementById('againBtn').addEventListener('click', showStart);
  bigBurst('#F59B0B'); setTimeout(()=>bigBurst('#2FB54C'),350); setTimeout(()=>bigBurst('#FFC246'),700);
}

/* ---- confetti ---- */
const fx=document.getElementById('fx');
const ctx=fx.getContext('2d');
let dpr=Math.min(devicePixelRatio||1,2);
let parts=[];
function sizeFx(){ fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; fx.style.width=innerWidth+'px'; fx.style.height=innerHeight+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', sizeFx); sizeFx();
const PALETTE=["#F59B0B","#FFC246","#2FB54C","#1C6BD6","#FFFFFF"];
function spawn(x,y,vx,vy,color){
  parts.push({x,y,vx,vy,life:1,fade:0.008+Math.random()*0.008,
    color:color||PALETTE[(Math.random()*PALETTE.length)|0],
    w:5+Math.random()*5,h:8+Math.random()*8,
    rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.4,
    flut:Math.random()*Math.PI*2,fspd:0.1+Math.random()*0.12});
}
function burstAt(el){
  if(reduce) return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<24;i++){
    const ang=(Math.PI*2)*(i/24), sp=2+Math.random()*5;
    spawn(cx,cy,Math.cos(ang)*sp,Math.sin(ang)*sp-2);
  }
}
function bigBurst(color){
  if(reduce) return;
  const cx=innerWidth/2, cy=innerHeight*0.4;
  for(let i=0;i<130;i++){
    const ang=(Math.PI*2)*(i/130)+Math.random()*0.3, sp=5+Math.random()*12;
    spawn(cx,cy,Math.cos(ang)*sp,Math.sin(ang)*sp-5,(i%4?null:color));
  }
}
function tickFx(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);
  for(const p of parts){
    p.flut+=p.fspd;
    p.x+=p.vx+Math.sin(p.flut)*1.2; p.y+=p.vy;
    p.vy+=0.2; p.vx*=0.985; p.rot+=p.vr; p.life-=p.fade;
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    const sq=Math.abs(Math.cos(p.flut));
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.4+0.6*sq));
    ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(tickFx);
}
tickFx();

showStart();
</script>
